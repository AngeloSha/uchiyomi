# ┌───────────────────────────────────────────────────────────────────────────┐
# │  THIS IS THE DEVELOPMENT STACK. It builds both images from source.        │
# │  To INSTALL Uchiyomi, do not clone the repo -- take one file instead:     │
# │    curl -O https://raw.githubusercontent.com/AngeloSha/uchiyomi/main/deploy/docker-compose.yml
# │    docker compose up -d                                                   │
# │  See README.md -> Install.                                                │
# └───────────────────────────────────────────────────────────────────────────┘
# Uchiyomi — self-hosted OLED manga/manhwa reader (bring-your-own CBZ library)
# services: yomi-db (private Postgres) · yomi-app (the single container, same as the install) ·
#           yomi-flaresolverr + yomi-suwayomi (optional) · yomi-bff + yomi-web under `--profile split`
services:
  yomi-db:
    image: supabase/postgres:15.8.1.085
    container_name: yomi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: yomi
      POSTGRES_USER: yomi
      POSTGRES_PASSWORD: ${DB_PASSWORD:-uchiyomi}   # internal-only DB (no published port); override in .env for extra safety
    volumes:
      - yomi_pgdata:/var/lib/postgresql/data
    networks:
      - yomi_internal          # private: only the BFF can reach the DB
    # NOTE: deliberately NO `ports:` and only on yomi_internal -> unreachable from outside the stack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yomi -d yomi"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - com.centurylinklabs.watchtower.enable=false

  # The two-container split. Still built from source here because its images are still published on
  # every release -- `docker compose --profile split up -d` brings it back. Not started by default.
  yomi-bff:
    profiles: ["split"]
    build: ./bff
    image: yomi-bff:prod
    container_name: yomi-bff
    restart: unless-stopped
    env_file: .env
    environment:
      # Run as the owner of your library so file operations work. Unset = uid 10002, library read-only.
      PUID: ${PUID:-}
      PGID: ${PGID:-}
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://yomi:${DB_PASSWORD:-uchiyomi}@yomi-db:5432/yomi
      KOMGA_BASE_URL: ${KOMGA_BASE_URL:-http://komga:25600}
      KOMGA_API_KEY: ${KOMGA_API_KEY:-}        # only used when LIBRARY_BACKEND=komga
      JWT_SECRET: ${JWT_SECRET:-}                                 # optional: auto-generated + persisted to /config if empty
      INITIAL_USER_PASSWORD_HASH_B64: ${INITIAL_USER_PASSWORD_HASH_B64:-}   # optional: first-run web setup creates the admin
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8081}   # the split serves on SPLIT_WEB_PORT
      CACHE_DIR: /cache
      CACHE_MAX_BYTES: "16106127360"   # 15 GiB image cache cap
      LIBRARY_ROOT: /library
      DL_ROOT: /library-dl             # owned, writable download dir (separate from Suwayomi's read library)
      LIBRARY_BACKEND: ${LIBRARY_BACKEND:-owned}           # Phase-1 cutover: serve from the owned CBZ library, not Komga
      FLARESOLVERR_URL: http://yomi-flaresolverr:8191   # Cloudflare solver for Cloudflare-protected sources
      SOURCES_DIR: /sources            # runtime source plugins are loaded from here (none = scraper-free core)
      CUSTOM_SITES_FILE: /config/sites.json   # admin-added Madara/Manganato sites (Add-a-site form)
      # Extension engine: a Suwayomi server that runs Mihon/Tachiyomi extensions. Wired up by default;
      # set SUWAYOMI_URL to an empty string in .env to turn the feature off entirely.
      SUWAYOMI_URL: ${SUWAYOMI_URL:-http://yomi-suwayomi:4567}
      SUWAYOMI_USERNAME: ${SUWAYOMI_USERNAME:-}
      SUWAYOMI_PASSWORD: ${SUWAYOMI_PASSWORD:-}
      SUWAYOMI_MAX_SOURCES: ${SUWAYOMI_MAX_SOURCES:-25}
    volumes:
      - yomi_imgcache:/cache
      - ${LIBRARY_PATH:-./library}:/library                   # your existing CBZ library (bring-your-own)
      - yomi_library:/library-dl                             # owned, writable download dir
      - ${SOURCES_PATH:-./sources}:/sources:ro               # user-supplied source plugins (compiled .js)
      - yomi_config:/config                                  # writable app config (custom sites list)
      - ${BACKUP_PATH:-yomi_backups}:/backups                # nightly DB + config backups (see docs/USAGE.md)
    networks:
      - yomi_internal            # reach the DB
      - yomi_app                 # reach the web + flaresolverr
    expose:
      - "3000"
    depends_on:
      yomi-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - com.centurylinklabs.watchtower.enable=false

  yomi-web:
    profiles: ["split"]
    build: ./web
    image: yomi-web:prod
    container_name: yomi-web
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "${SPLIT_WEB_PORT:-8081}:80"   # split only; WEB_PORT belongs to yomi-app, which stays up alongside it
    networks:
      - yomi_app
    depends_on:
      - yomi-bff
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - com.centurylinklabs.watchtower.enable=false
  # The shipped topology, built from source. `docker compose up -d` gives you the SAME single container the
  # install ships and the end-to-end tests drive, so a contributor runs what is released.
  yomi-app:
    build:
      context: .
      dockerfile: Dockerfile.aio
    image: yomi-app:prod
    container_name: yomi-app
    restart: unless-stopped
    env_file: .env
    environment:
      # Run as the owner of your library so file operations work. Unset = uid 10002, library read-only.
      PUID: ${PUID:-}
      PGID: ${PGID:-}
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://yomi:${DB_PASSWORD:-uchiyomi}@yomi-db:5432/yomi
      JWT_SECRET: ${JWT_SECRET:-}                                 # auto-generated + persisted to /config if empty
      INITIAL_USER_PASSWORD_HASH_B64: ${INITIAL_USER_PASSWORD_HASH_B64:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      CACHE_DIR: /cache
      CACHE_MAX_BYTES: "16106127360"   # 15 GiB image cache cap
      LIBRARY_ROOT: /library
      DL_ROOT: /library-dl             # owned, writable download dir
      LIBRARY_BACKEND: ${LIBRARY_BACKEND:-owned}
      FLARESOLVERR_URL: http://yomi-flaresolverr:8191
      SOURCES_DIR: /sources
      CUSTOM_SITES_FILE: /config/sites.json
      SUWAYOMI_URL: ${SUWAYOMI_URL:-http://yomi-suwayomi:4567}
      SUWAYOMI_USERNAME: ${SUWAYOMI_USERNAME:-}
      SUWAYOMI_PASSWORD: ${SUWAYOMI_PASSWORD:-}
      SUWAYOMI_MAX_SOURCES: ${SUWAYOMI_MAX_SOURCES:-25}
    volumes:
      - yomi_imgcache:/cache
      - ${LIBRARY_PATH:-./library}:/library                   # your existing CBZ library (bring-your-own)
      - yomi_library:/library-dl
      - ${SOURCES_PATH:-./sources}:/sources:ro
      - yomi_config:/config
      - ${BACKUP_PATH:-yomi_backups}:/backups
    networks:
      - yomi_internal
      - yomi_app
    ports:
      - "${WEB_PORT:-8080}:3000"   # open the app at http://localhost:8080
    depends_on:
      yomi-db:
        condition: service_healthy
    healthcheck:
      # /livez, not /healthz: a database blip must not mark the whole app unhealthy. Matches Dockerfile.aio.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/livez >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - com.centurylinklabs.watchtower.enable=false


  # Cloudflare solver (headless Chrome) — lets the Aqua Manga source adapter get past Cloudflare.
  yomi-flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: yomi-flaresolverr
    restart: unless-stopped
    # Chrome writes its shared-memory segments here, and Docker's default /dev/shm is 64 MB. Under that,
    # chromedriver dies mid-challenge and FlareSolverr reports "Service /app/chromedriver unexpectedly
    # exited" or fails to reach its own session -- which looks, from the app's side, exactly like the manga
    # site blocking us. Measured on one install: seven such failures in 24 hours across four sources.
    shm_size: 1gb
    # The leak is the other half of the problem. FlareSolverr grew to 2.5 GB over 62 days of uptime on one
    # install, and a bloated solver starts failing mid-challenge rather than dying cleanly, which reads from
    # the app's side as the SITES being broken. A cap plus `restart: unless-stopped` turns an unbounded leak
    # into an automatic restart: idle it sits around 150 MB, so 2 GB is generous headroom for a real solve.
    mem_limit: 2g
    # It had no healthcheck at all, so `docker ps` said "Up 2 months" while it was crashing on every request.
    # The root endpoint answers with a readiness sentence, which is the only honest signal it offers.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8191/ | grep -q 'FlareSolverr is ready' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      LOG_LEVEL: info
      TZ: UTC
    networks:
      - yomi_app
    expose:
      - "8191"
    labels:
      - com.centurylinklabs.watchtower.enable=false

  # Extension engine. Runs Mihon/Tachiyomi extensions (which are Android/Kotlin) on the JVM and exposes them
  # over an API; Uchiyomi keeps owning the library, reader, downloads and updates and only asks it for
  # search/chapters/pages. Browse and install extensions from Uchiyomi's own admin panel.
  #
  # Pinned rather than :stable on purpose -- :stable is v2.2.2100, which is older than the extension API the
  # current repository indexes require, so it sees an empty catalogue.
  # It is a JVM and sits around 800MB of RAM. Do not want it? Set SUWAYOMI_URL= (empty) in .env.
  yomi-suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:v2.3.2243
    container_name: yomi-suwayomi
    restart: unless-stopped
    environment:
      TZ: UTC
      # Uchiyomi does the downloading and owns the library; this instance must never write into it.
      AUTO_DOWNLOAD_CHAPTERS: "false"
      DOWNLOAD_AS_CBZ: "true"
    volumes:
      - yomi_suwayomi:/home/suwayomi/.local/share/Tachidesk
    networks:
      - yomi_app
    expose:
      - "4567"
    labels:
      - com.centurylinklabs.watchtower.enable=false

networks:
  yomi_internal:                 # private: only db + bff (DB never leaves this network)
    driver: bridge
  yomi_app:                      # app tier: bff + web + flaresolverr talk to each other
    driver: bridge

volumes:
  yomi_pgdata:
  yomi_imgcache:
  yomi_library:
  yomi_config:
  yomi_suwayomi:  # optional extension engine's own data (extensions + its database)
  yomi_backups:   # default backup target; set BACKUP_PATH to a host dir (ideally another disk) to override
