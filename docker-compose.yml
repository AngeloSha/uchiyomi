# Umami — cookieless, self-hosted analytics for uchiyomi.com.
#
# Deliberately NOT given a hostname of its own. koryomi-web reverse-proxies it at https://uchiyomi.com/stats/,
# which means: no new DNS record, and the tracker is first-party, so the content blockers that self-hosters
# run do not silently delete the only measurement this project has.
#
# The subnet is pinned because this host has exhausted Docker's default address pools; a new project that
# lets Docker choose fails to create its network.

services:
  umami-db:
    image: postgres:16-alpine
    container_name: umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - umami-db:/var/lib/postgresql/data
    networks: [umami_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - com.centurylinklabs.watchtower.enable=false

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${DB_PASSWORD:?}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      BASE_PATH: /stats
      DISABLE_TELEMETRY: "1"
    depends_on:
      umami-db:
        condition: service_healthy
    expose:
      - "3000"
    networks: [umami_internal, proxy]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/stats/api/heartbeat >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      - com.centurylinklabs.watchtower.enable=false

volumes:
  umami-db:

networks:
  umami_internal:
    ipam:
      config:
        - subnet: 10.81.0.0/24
  proxy:
    external: true
