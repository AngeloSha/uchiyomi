# Pass through the real protocol when fronted by NPM (which terminates TLS).
map $http_x_forwarded_proto $fwd_proto {
  ""      $scheme;
  default $http_x_forwarded_proto;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker DNS so the BFF upstream is re-resolved if it restarts.
  resolver 127.0.0.11 valid=30s ipv6=off;

  # Send relative Location headers. nginx listens on 80 inside the container, so when it adds a trailing
  # slash to a directory it builds an absolute URL from that -- and the published port is lost:
  #
  #   GET http://localhost:8080/library  ->  301 Location: http://localhost/library/
  #
  # 8080 is the documented default, so every deep link, bookmark and hard refresh on a path without a
  # trailing slash landed on a dead URL. Client-side navigation never round-trips, which is why it looks
  # fine until someone reloads. Relative redirects resolve against whatever origin the client actually
  # used, including the port and any reverse proxy in front.
  absolute_redirect off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  # ---- single-origin: reverse-proxy the BFF for /api, /auth, /img ----
  location /api/ {
    set $bff http://yomi-bff:3000;
    proxy_pass $bff;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 120s;
  }
  location /auth/ {
    set $bff http://yomi-bff:3000;
    proxy_pass $bff;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }
  location /img/ {
    set $bff http://yomi-bff:3000;
    proxy_pass $bff;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 0;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 120s;
    # let the image cache headers (immutable) flow through untouched
  }
  # ---- OPDS catalog for external readers (HTTP Basic auth) ----
  location /opds {
    set $bff http://yomi-bff:3000;
    proxy_pass $bff;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_buffering off;
    client_max_body_size 0;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 300s;
  }

  # never cache the service worker or manifest (so updates roll out)
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    types { } default_type application/manifest+json;
    try_files $uri =404;
  }

  # hashed Next assets — cache hard
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /icons/ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # SPA routing for the static export (App Router emits /route/index.html)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ $uri.html /index.html;
  }

  location = /healthz { return 200 "ok"; add_header Content-Type text/plain; }
}
