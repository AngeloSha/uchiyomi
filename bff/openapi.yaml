  /api/series/{id}/listing:
    get:
      tags:
        - library
      summary: The chapters the sources list that this server does not hold, with the reason each is absent.
      operationId: getApiSeriesIdListing
      description: >-
        Read from the listing the updater persisted at the last check (the sweep, Check now), never from the
        sources themselves, so `checkedAt` is how old the answer is. Only numbers with NO chapter row are
        ghosts: a chapter the read-chapter cleanup deleted keeps its row (`pruned` on the Book) and is not
        listed here. `why` is one of `missing` (not fetched yet), `held` (waiting for a preferred group),
        `failed` (the sweep gave up after the retry cap; `attempts` says how many), `blocked` (only blocked
        groups released it; unblock the group to fetch it), `floor` (below the series' Latest-N floor), `archive`
        (an active slow archive will fetch it; since v0.49.0). `reason`,
        the downloader's last error text, is present for admins only. `read: true` marks a number the caller
        ticked read without it being here (POST /api/series/{id}/listing-progress). A chapter matches its
        listing number by its override-aware number, so a chapter an admin renumbered is not also a ghost.
        `numbering` (v0.49.0, #116) says how the series is numbered and why: { mode (null = automatic, source,
        posting_order), by (auto, manual), pending (posting_order, source, remap: a change waiting for an
        admin), note (the detector's last verdict), changedAt, sourceName, extSourceId? }.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [checkedAt, content]
                properties:
                  checkedAt:
                    type: [string, "null"]
                    format: date-time
                  content:
                    type: array
                    items:
                      $ref: "#/components/schemas/Ghost"
                  archive:
                    type: [object, "null"]
                    description: >-
                      Since v0.49.0 (#117): the series' slow archive, or null -- `{state, done, left, failed, mine,
                      pausedForAll, etaMs?, nextAt?, waiting?, attention?}`, as in ArchiveSeries. `pausedForAll`
                      (since v0.49.1) is the admin's pause of every archive (`paused` on ArchiveView), which a queued
                      row's `state` does not show, for a viewer who may not download and so cannot read the queue.
                  numbering:
                    type: [object, "null"]
                    description: >-
                      Since v0.49.0 (#116), to every viewer of the series: `{mode, by, pending, note, changedAt,
                      sourceName, extSourceId?}` as described above. While `pending` is set the series downloads
                      nothing until an admin confirms or declines the change (POST
                      /api/admin/series/{id}/numbering).
        "401":
          description: Not authenticated
        "404":
          description: Not found, or not visible to this account
  /api/series/{id}/listing-progress:
    post:
      tags:
        - library
      summary: Mark chapters read by number, including chapters this server does not hold.
      operationId: postApiSeriesIdListingProgress
      description: >-
        For the caller only. Each number is resolved in one pass: a number a chapter row holds (its
        override-aware number, a deleted chapter's row included) is marked read on that row, as the library's
        bulk mark-read does (`viaBook`); a number the last listing (GET /api/series/{id}/listing) has and no row
        holds becomes a read mark (`marked`); anything else is skipped as `not_listed` -- the listing is the
        authorisation, as for POST /api/sources/fetch. Marking a number already marked keeps the first mark's
        time and counts nothing. No reading event is written (stats, streaks and Wrapped are not moved). When a
        marked chapter later lands on the server, the mark becomes ordinary read progress on it, stamped with
        the mark's time (never after the file, so the read-chapter cleanup does not take the new file). Not
        gated on the download permission: a mark costs no bytes. When something changed, ONE tracker push
        follows for the series (for new marks alone, only with the Komga ghost-chapters setting on, since
        marks count for nothing without it), and a mark reaches AniList / MyAnimeList / Kitsu only as part of a contiguous
        run of read chapters from the start, and only with the Komga ghost-chapters setting on -- a lone tick
        far ahead is never sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingNumbers"
      security:
        - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, marked, viaBook, skipped]
                properties:
                  ok: { type: boolean }
                  marked: { type: integer, description: New read marks on numbers this server does not hold. }
                  viaBook: { type: integer, description: Chapter rows this call moved to read. }
                  skipped:
                    type: array
                    items:
                      type: object
                      required: [number, reason]
                      properties:
                        number: { type: number }
                        reason: { type: string, enum: [not_listed] }
        "400":
          description: No numbers, more than 500, or a number outside 0..1000000
        "401":
          description: Not authenticated
        "404":
          description: Not found, or not visible to this account
    delete:
      tags:
        - library
      summary: Mark chapters unread by number, including chapters this server does not hold.
      operationId: deleteApiSeriesIdListingProgress
      description: >-
        For the caller only, and a DELETE like the library's bulk mark-unread: a number a chapter row holds
        loses that row's read progress (`viaBook`), and the caller's read mark on the number goes (`unmarked`).
        Not checked against the listing -- it only removes the caller's own rows, and a mark can outlive the
        listing row it was made on. Nothing is pushed to the trackers, which stay ahead: the safe direction.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingNumbers"
      security:
        - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, unmarked, viaBook]
                properties:
                  ok: { type: boolean }
                  unmarked: { type: integer, description: Read marks removed. }
                  viaBook: { type: integer, description: Chapter rows whose read progress was removed. }
        "400":
          description: No numbers, more than 500, or a number outside 0..1000000
        "401":
          description: Not authenticated
        "404":
          description: Not found, or not visible to this account
  /api/series/{id}/groups:
