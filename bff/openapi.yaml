          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: >-
            A manifest whose `pages` keep their original one-based positions. A repair placeholder carries
            `missing: true` (and may also carry `junk`), so offline readers preserve the partial-chapter
            evidence.
          content:
            application/json:
              schema:
                type: object
                required: [bookId, seriesId, seriesTitle, title, number, pageCount, readingDirection, coverUrl, totalBytes, pages]
                properties:
                  bookId: { type: string }
                  seriesId: { type: string }
                  seriesTitle: { type: string }
                  title: { type: string }
                  number: {}
                  pageCount: { type: integer }
                  readingDirection: { type: string }
                  mediaType: { type: [string, "null"] }
                  coverUrl: { type: string }
                  totalBytes: { type: integer }
                  pages:
                    type: array
                    items:
                      type: object
                      required: [number, url, width, height, bytes, mediaType]
                      properties:
                        number: { type: integer, minimum: 1 }
                        url: { type: string }
                        width: { type: [integer, "null"] }
                        height: { type: [integer, "null"] }
                        bytes: { type: [integer, "null"] }
                        mediaType: { type: [string, "null"] }
                        junk: { type: boolean }
                        missing: { type: boolean, description: True only for a repair placeholder. }
        "401":
          description: Not authenticated
        "404":
          description: Not found, or not visible to this account
        "410":
          description: The chapter is a pruned tombstone and has no pages to download.
