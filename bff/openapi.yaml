        deleted from the server, whose page list is empty -- out of the LIST only; they still count for the
        progress endpoints. `sort` honours the direction only (`metadata.numberSort,asc|desc`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - { name: unpaged, in: query, required: false, schema: { type: boolean } }
        - { name: media_status, in: query, required: false, schema: { type: string }, description: READY excludes tombstones. }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500 } }
        - { name: sort, in: query, required: false, schema: { type: string } }
        - { name: deleted, in: query, required: false, schema: { type: boolean }, description: Accepted and ignored. }
      security:
        - komgaApiKey: []
        - komgaBearer: []
        - komgaBasic: []
        - komgaSession: []
      responses:
        "200":
          description: A KomgaPage whose content is KomgaBook.
