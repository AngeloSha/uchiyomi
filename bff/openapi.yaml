  /api/admin/settings:
    get:
      tags:
        - admin
      summary: Server settings, plus extensions_configured (whether an extension engine exists).
      operationId: getApiAdminSettings
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. The row
        includes scanlator_prefs, the server-wide release preferences (ScanlatorPrefs; the default is no
        priority, nothing blocked, two days of patience), and backup_hour, the local hour (0-23) of the
        nightly backup.
      security:
        - bearer: []
      responses:
        "200":
          description: >-
            The settings row. Only the read-chapter cleanup fields and backup_hour are described here; the
            rest are the snake_case columns PATCH sets (server_name, allow_registration, updater_hours, ...).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  cleanup_read:
                    type: boolean
                    description: Whether the opt-in read-chapter cleanup is on. Off by default.
                  cleanup_read_days:
                    type: integer
                    minimum: 0
                    maximum: 3650
                    description: >-
                      Days after the last reader finishes before the file goes. 0 deletes at the next run.
                  cleanup_read_due:
                    type: [integer, "null"]
                    description: >-
                      How many chapters the cleanup would delete if it ran now, at the current day setting,
                      whether or not it is switched on -- so the number can be seen before consenting. Memoised
                      for half a minute; null when it could not be counted.
                  backup_hour:
                    type: integer
                    minimum: 0
                    maximum: 23
                    description: Local hour of the nightly backup. Default 3.
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
    patch:
      tags:
        - admin
      summary: "Change server settings: name, open registration, update interval, backup hour, extension check
        interval and its kill switch, the update check, the opt-in install count, the opt-in read-chapter
        cleanup, and the server-wide scanlation-group preferences."
      operationId: patchApiAdminSettings
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Answers
        the same row GET does, so a client can replace what it holds.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                serverName:
                  type: string
                allowRegistration:
                  type: boolean
                updaterHours:
                  type: integer
                extensionHours:
                  type: integer
                extensionAutoUpdate:
                  type: boolean
                updateCheck:
                  description: Ask GitHub whether a newer release exists. Sends nothing about this install.
                  type: boolean
                installPing:
                  description: >-
                    Opt in to the anonymous install count. Turning it on mints a per-install secret; turning
                    it off destroys it and asks the collector to forget the current month's id.
                  type: boolean
                scanlatorPrefs:
                  description: >-
                    The server-wide release preferences, replaced whole. Blocks made here apply to every
                    series; the priority applies to a series that has no ranking of its own.
                  $ref: "#/components/schemas/ScanlatorPrefs"
                cleanupRead:
                  description: >-
                    Opt in to deleting the file of a chapter that everyone who started it has finished, once
                    it has been finished for cleanupReadDays. Off by default. Only chapters under the
                    download directory are ever touched; a chapter anyone is partway through is never
                    touched; the chapter and everyone's reading progress survive the file.
                  type: boolean
                cleanupReadDays:
                  description: >-
                    Days to wait after the last reader finishes, counted from the newest progress update on
                    the chapter. 0 means the next run deletes it; it is a grace period, not the off switch
                    (that is cleanupRead).
                  type: integer
                  minimum: 0
                  maximum: 3650
                backupHour:
                  type: integer
                  minimum: 0
                  maximum: 23
                  description: >-
                    Local hour of the nightly backup. The pending timer is re-armed at once, so the change
                    applies to the next run rather than the one after.
                komgaGhostChapters:
                  description: >-
                    List the chapters this server does not hold on the Komga-compatible API: the ones the
                    sources listed but the sweep never fetched, and the tombstones whose files the read
                    cleanup deleted. Off by default. They report media.status READY so the extension does
                    not filter them out, carry a page count of 0 and a size of "not downloaded", and cannot
                    be opened. Their numbers count towards the chapter total the trackers read, which is
                    what the setting is for; they never affect lastReadContinuousNumberSort. Nothing outside
                    /api/v1 and /api/v2 changes.
                  type: boolean
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/admin/tasks:
    get:
      tags:
        - admin
      summary: Scheduled tasks with last run, last result and whether one is running.
      operationId: getApiAdminTasks
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Since
        v0.37.0 the list always carries `verify` ("Verify chapter files", schedule "on demand · after a
        database-only restore") with `lastRun` (epoch ms or null) and `lastResult` {ok, checked, missing,
        readLibraryMissing, unmounted: string[], roots, ms, stopped?: 'shutdown'} or null -- it never runs by
        itself, so it is listed even when it never has. Its run is detached (see the run route), so this
        entry is where the counts appear: `checked` is rows whose file was looked for under roots that were
        not skipped (both roots), `missing` the download-root rows marked this run, `readLibraryMissing` the
        read-library rows whose file is gone (counted, never marked), `unmounted` the roots left alone (a
        bare path: no file at all under it; "<root> (95 % of 20 chapter files missing)": the 90 % rule).
        Both are persisted in server_settings (verify_last_run / verify_last_result) and survive a restart;
        a run that threw stores a null result rather than an older healthy one.
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/admin/tasks/{id}/run:
    post:
      tags:
        - admin
      summary: Start a scheduled task now (scan, update, backup, fingerprint, pagehash, cleanup, extensions, verify).
        {ok:false,error:busy} while it runs, {ok:false,error:not_enabled} for a task that is switched off.
      operationId: postApiAdminTasksIdRun
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. `scan` is
        awaited and answers with its result; the others, `verify` included, start in the background and
        answer {ok: true, started: true} ({ok: false, error: 'busy'} while one runs). `verify` (since v0.37.0,
        "Verify chapter files") is detached because one stat per row over a network share is minutes on a
        large library and a request that long dies at the reverse proxy while the walk goes on; its counts
        land on GET /api/admin/tasks as the `verify` entry's `lastResult`, persisted across restarts. It stats
        every un-pruned chapter row under both roots but marks ONLY rows under the download folder
        (/library-dl) as pruned with `pruned_reason = 'missing'` -- the one reason the updater does not count
        as held, so the next sweep (and Fetch newest) download them again onto the same rows; a read-library
        row whose file is gone is counted in `readLibraryMissing` and never marked, because a re-fetch could
        not land on that row. Per root it applies the read-chapter cleanup's whole-batch rule: a root where no
        checked row's FILE is present (an empty folder is not proof of a mount), or that cannot be read, is a
        volume that is not mounted (or an empty disk, which looks the same from inside the container), so it
        marks nothing there and names the bare root in `unmounted`; and a root with more than 90 % of its
        checked files missing is refused the same way, named as "<root> (N % of M chapter files missing)".
        Rows are never deleted; a row the cleanup already marked keeps its reason. Never runs at boot or on a
        schedule. Audit: `task.run` {task: 'verify'} at the press and `library.verify` {checked, missing,
        readLibraryMissing, unmounted, ms} when the walk ends.
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            The task. `cleanup` is the opt-in read-chapter cleanup and answers not_enabled while cleanup_read
            is off; its run is subject to the same consent and the same vetoes as the hourly one. `verify` is
            the repair for a database restored without its chapter files.
          schema:
            type: string
            enum: [scan, update, backup, fingerprint, pagehash, cleanup, extensions, verify]
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
