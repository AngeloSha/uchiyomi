  /api/library/bulk/newest:
    post:
      tags:
        - personal
      summary: "Fetch newest: start a detached run that fetches, for each selected series, the newest chapter its
        sources list if it is not on the shelf yet. 202 with the total; 409 busy while one runs."
      operationId: postApiLibraryBulkNewest
      description: >-
        Since v0.37.0. The one bulk action that fetches bytes from sources, so it is a job rather than a request
        that waits, and it carries the download gate the /api/sources surface sits behind: a member whose
        `canDownload` permission is off is refused (an absent permission allows, admins are exempt, an
        unreadable account row fails closed). Per series the rule is the newest release the series' sources
        list and nothing else: a live row holding it answers `up_to_date`; a number held only as a cleanup /
        Delete-files tombstone (no live row beside it) is `skipped` with "Chapter N was deleted from this
        server on purpose. Fetch again on the series page brings it back." and nothing is fetched (a
        'missing' tombstone from the verify task is not held and IS fetched); otherwise that one number is
        fetched with the series' Latest-N floor ignored for it alone -- the floor is never moved and nothing
        below it is fetched -- and the retry cap for that number reset as the series page's Fetch does. A
        number held for a preferred group is honoured, not overridden; a source the account's age limit
        excludes, one in a cooldown, one listing nothing, and a series with a download already running are
        each skipped with a reason. A source the admin disabled is never asked for its listing: a series whose
        every source is disabled is skipped at once with no network call, one that also follows a live source
        is asked on that one only. Ids the caller cannot see are not an error: they are reported skipped ("Not
        in your library.") and count towards `total`. Only after a source was actually asked does the run
        pause 1.5 s before the next series (cooldowns, disabled sources and ids not in the library are not
        paced); one library scan runs at the end. While the run is inside a series that series answers 409
        busy to POST /api/sources/fetch, /api/sources/fill and the admin chapters/refetch, and only then. One
        run per server, never queued; a restart forgets it. Audit: `download.bulk_newest` {count, asked}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  description: Series ids, 1-64 characters each; duplicates count once.
                  items:
                    type: string
      security:
        - bearer: []
      responses:
        "202":
          description: "Started: { ok: true, total } where total is the number of distinct ids asked."
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  total:
                    type: integer
        "400":
          description: "bad_request: the body is not { ids } of one to five hundred series ids."
        "401":
          description: Not authenticated
        "403":
          description: "forbidden: this account may not download chapters."
        "409":
          description: "busy: a Fetch newest run is already going; wait for it to finish."
    get:
      tags:
        - personal
      summary: "Fetch newest: the current run, or the last one -- counts for every signed-in viewer, per-series
        results for the account that started it and for admins."
      operationId: getApiLibraryBulkNewest
      description: >-
        Since v0.37.0. Always 200. `results` are in the order the ids were given (the order they were started);
        `reason` is a sentence, present on every outcome but `downloaded`; `title` is empty for an id outside
        the caller's library. Any member other than the starter (or an admin) gets the counts with `results:
        []`, so a title from a library they were not granted cannot leak through someone else's selection.
        Before any run: zeros, `startedAt` null, `results` empty. In memory: a restart forgets it.
      security:
        - bearer: []
      responses:
        "200":
          description: The run's state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  running:
                    type: boolean
                  done:
                    type: integer
                    description: Series settled so far, the ones skipped before any source was asked included.
                  total:
                    type: integer
                  startedAt:
                    type: [string, "null"]
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        outcome:
                          type: string
                          enum: [downloaded, up_to_date, skipped, failed]
                        reason:
                          type: string
                          description: A sentence; present on every outcome but `downloaded`.
        "401":
          description: Not authenticated
