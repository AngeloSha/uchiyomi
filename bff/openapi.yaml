        reads the preference screen again, finds the key's current position, checks the value against the
        setting's type and choices, and only then writes it: the engine addresses a write by position, which an
        extension update can move. A value that really changed drops the source's cached chapter lists (what the
        add dialog shows). A change to a numbering setting that the engine took (`applied`) marks every series
        from this source that uses the source's numbers for a remap (`numbering_pending = 'remap'`): each waits
        for an admin to confirm its renaming (POST /api/admin/series/{id}/numbering, mode remap) before it updates
        again, unless its next check finds that every chapter keeps its number, which settles the remap by itself;
        series numbered by posting order are unaffected. Audited as `source.extension_pref`, a text setting's value
        by its length only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key: { type: string, maxLength: 256 }
                value:
                  description: A boolean (switch, checkbox), a string (list, text) or a list of strings (multiselect).
                  oneOf:
                    - type: boolean
                    - type: string
                      maxLength: 4096
                    - type: array
                      maxItems: 200
                      items: { type: string }
      security:
        - bearer: []
      responses:
        "200":
          description: "OK: { ok, changed, applied (the engine holds the value), remap (series marked), preferences, usedBy, renumbers }"
        "400":
          description: "bad_request, unknown_pref, ambiguous_pref, disabled, bad_value (not one of the setting's choices), or not_configured"
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: The extension server has no such source (unknown_source)
        "502":
          description: "`unreachable`: the extension server did not answer; or `extension_error`: it answered with the extension's own exception, whose first line is in `message`"
  /api/admin/extensions/catalog:
    get:
      tags:
        - admin
      summary: "The extension catalogue: installed, updatable, and available, a page at a time."
      operationId: getApiAdminExtensionsCatalog
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Installed first,
        then those with an update, then by name. Answers `{content, total, matched, shown, offset, limit, installed,
        updatable, hiddenAdult, adultTotal, langs}`: `content` is the page `offset`..`offset + limit` of the
        `matched` extensions (v0.53.0; before, the first 400 alone), `shown` its length, `total` the whole
        catalogue, `installed` and `updatable` counted over the whole catalogue, `hiddenAdult` the 18+ extensions
        the other filters match that the 18+ filter keeps out (0 with `nsfw=true`; the whole catalogue's before
        v0.53.0), and `adultTotal` (v0.53.0) the whole catalogue's 18+ extensions that are not installed, whatever
        was asked: `total` less these is how many the list holds without `nsfw=true`. An installed 18+ extension
        is always listed.
      parameters:
        - name: q
          in: query
          required: false
          description: Part of the extension's name or package name, any case.
          schema:
            type: string
        - name: lang
          in: query
          required: false
          description: The extension's language code as the catalogue's `langs` lists it (`all` for a multi-language one); empty or `all` for every language.
          schema:
            type: string
        - name: installed
          in: query
          required: false
          description: "`true`: installed extensions only."
          schema:
            type: string
        - name: updates
          in: query
          required: false
          description: "`true`: only extensions with a newer version waiting (v0.53.0)."
          schema:
            type: string
        - name: nsfw
          in: query
          required: false
          description: "`true`: include 18+ extensions that are not installed (they are left out by default)."
          schema:
            type: string
        - name: offset
          in: query
          required: false
          description: Where the page starts among the matches (v0.53.0). Default 0.
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          description: How many extensions the page holds (v0.53.0). Default and maximum 400.
          schema:
            type: integer
            minimum: 1
            maximum: 400
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/admin/extensions/update-all:
    post:
      tags:
        - admin
      summary: Re-read the repositories, then update every installed extension with a newer version. 409 while a
        check runs.
      operationId: postApiAdminExtensionsUpdateAll
      description: Requires an admin account and a token carrying the admin scope. Scopes only ever restrict.
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "409":
