  /api/sources/add:
    post:
      tags:
        - sources
      summary: Add a series from a source. Answers once the outcome is decided and downloads afterwards;
        started:true means downloading now.
      operationId: postApiSourcesAdd
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                sourceId:
                  type: string
                chapterCount:
                  type: integer
                  minimum: 1
                  description: How many chapters to take; omit for all.
                chapterFrom:
                  type: string
                  enum: [oldest, newest, none]
                  default: oldest
                  description: >-
                    Which end chapterCount counts from. Either way the selection is downloaded ascending.
                    With newest, a chapter floor is set so auto-update fetches new releases only. `none`
                    adds the series with no chapters at all: the row is created and followed, the listing
                    is written, no download starts, and a chapter floor is set just above the newest listed
                    number (max + 0.001, so every number listed today is below it and the next release is
                    not; null when the source lists nothing) so auto-update follows new releases only --
                    older chapters can be fetched from the series page. The row is stamped as checked (the
                    add just asked the source), so `checkedAt` and the source's chapter count are set from
                    the start; a series removed from the library and added back this way is revived under
                    its old id. `chapterCount` is ignored, and an empty listing is not `no_chapters`.
                autoUpdate:
                  type: boolean
                force:
                  type: boolean
      security:
        - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, title, folder, chapters, started, nothing]
                properties:
                  ok: { type: boolean }
                  title: { type: string }
                  folder: { type: string }
                  chapters: { type: integer, description: How many chapters the add will fetch; 0 when already in the library or for a `none` add. }
                  started: { type: boolean, description: The download is running now. }
                  nothing: { type: boolean, description: "A `none` add: the series was created and floored and nothing was fetched or queued. Tells that outcome from `already in library`, which also answers chapters 0 and started false." }
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
