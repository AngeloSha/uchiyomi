  /api/sources/jobs/{folder}:
    delete:
      tags:
        - sources
      summary: Dismiss a stopped job; 409 while it is still running, or while its auto-follow judgement runs.
      operationId: deleteApiSourcesJobsFolder
      description: >-
        Since v0.49.0 only the account that started the job, or an admin, may dismiss it; anyone else gets
        403, answered before the 409 -- and 404 for a job GET /api/sources/jobs does not hand them, exactly as
        for no job at all. Only a job that has stopped: 409 `running` while `status` is
        `downloading`, and likewise while the card's `autoFollow.done` is false -- a nothing-yet carrier card
        is `done` from birth, and dropping it mid-judgement would let the follows land with the report they
        belong to gone, while the dialog polled for a card that no longer existed.
        Since v0.50.0 a folder with no job dismisses its chapters that could not be saved instead (the
        activity feed's `failed` entries, the slow archive's aside), on the same terms: 404 when the caller is
        shown none, 403 unless every one is theirs or the caller is an admin. Dismissing a job also clears
        its folder's failed chapters (a member's, their own). Either way they leave the feed and the log.
      parameters:
