            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: >-
            The chapter. Only the fields added in v0.31.0 and v0.32.0 are described here; the rest of the
            shape follows Komga's book DTO (id, seriesId, number, media, metadata, readProgress, ...). The
