      tags:
        - library
      summary: Record reading progress. silent:true writes exactly what you say (even unread) and stays out of
        history and streaks; otherwise a write can only move forward.
      operationId: putApiBooksIdProgress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                completed:
                  type: boolean
                silent:
                  type: boolean
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
        "404":
          description: Not found, or not visible to this account
  /api/sources:
