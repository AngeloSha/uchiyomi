      summary: "Remove from library over a selection: the single soft-delete once per id, files never touched."
      operationId: postApiAdminSeriesBulkHide
      description: >-
        Since v0.37.0. Requires an admin account and a token carrying the admin scope. Scopes only ever
        restrict. Exactly DELETE /api/admin/series/{id} once per id -- deleted_at set, tracker link dropped,
        chapter rows, files, progress, favourites and ratings kept, restorable from the Removed list -- and
        nothing more: deleting files stays the per-title, typed-confirmation step on
        /api/admin/series/{id}/delete-files, so Select all plus one tap can never wipe a folder. An id that
        cannot be hidden is skipped with its reason and the rest still apply. One `series.delete` audit row
        per hidden series carrying {id, title, books}, as the single route writes it; nothing for skipped ids.
      requestBody:
