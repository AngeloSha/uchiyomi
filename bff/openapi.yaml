      summary: Declare a library.
      operationId: postApiAdminLibraries
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Since v0.55.1 a
        library holds one or more folders (`paths`; `path` alone is one), and the save moves, in its own transaction,
        every series that is not filed by hand and sits under one of them: each goes to the library holding the
