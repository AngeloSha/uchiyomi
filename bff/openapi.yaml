              properties:
                autoUpdate:
                  type: boolean
                  description: Whether the scheduled updater keeps checking this series.
                scanlatorPrefs:
                  description: >-
                    The series' own release preferences, replaced whole; null clears them so the server-wide
                    ones apply again. The priority given here replaces the global list for this series, the
                    blocked list is added to it, and a null patienceDays inherits.
                  oneOf:
