    get:
      tags:
        - admin
      summary: Progress of a running series check.
      operationId: getApiAdminSeriesIdCheck
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Answers
        { running } while the check runs and { running: false, added, waiting?, error?, startedAt,
        finishedAt } once it has finished; waiting is how many missing chapter numbers were held back for a
        ranked group (omitted when none), so "0 added" next to it does not read as nothing new.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [running]
                properties:
                  running: { type: boolean }
                  added: { type: integer, description: Chapters that landed in this check. }
                  waiting: { type: integer, description: Missing numbers held for a ranked group; absent when 0. }
                  error: { type: string }
                  startedAt: { type: integer, format: int64 }
                  finishedAt: { type: integer, format: int64 }
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
