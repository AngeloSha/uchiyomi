                  pruned:
                    type: boolean
                    description: >-
                      The file was deleted by the read-chapter cleanup or an admin; the row stays so progress
                      survives; no pages behind it. The chapter is still listed and still counts as read, but
                      the page list is empty, next/previous step over it, and the download manifest answers
                      410.
                  owned:
                    type: boolean
                    description: >-
                      Downloaded by this server (the file sits under the download directory); only such
                      chapters can be deleted or fetched again. False for a chapter the scanner found in the
                      read library.
                  missingPages:
                    type: [array, "null"]
                    description: >-
                      One-based indices represented by repair placeholders in a partial chapter; null once
                      the chapter is complete.
                    items:
                      type: integer
                      minimum: 1
                  numberEnd:
                    type: [number, "null"]
                    description: >-
                      Since v0.55.2: the last chapter of a file that holds several, read from a name like
                      "Batman 01-07 (1987).cbz"; null for one chapter, and for a file an admin gave one number.
                      `number` and `metadata.numberSort` stay the start (1), and `metadata.number` reads the
                      range ("1–7"). Every number from the start to the end counts as held.
        "401":
          description: Not authenticated
        "404":
          description: Not found, or not visible to this account
