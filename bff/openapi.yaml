      operationId: postApiTrackersProviderResyncSeriesid
      description: >-
        The one deliberate way down. Progress is otherwise monotonic per series (a tracker takes a lower
        number and rewrites the entry with no undo): this deletes the caller's `tracker_progress` floor for
        the series on THAT provider only -- `anilist`, `myanimelist` or `kitsu`; any other name is 404
        `unknown_provider` -- and pushes the current local count at once, lower or not. The other providers'
        floors are untouched. No web control calls it; a floor the tracker has since corrected is taken by
        reading the list again (POST /api/admin/import/batches with `origin: tracker` replaces the floor).
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: seriesId
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "404":
          description: Not found, or not visible to this account
