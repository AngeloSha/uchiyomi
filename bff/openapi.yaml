      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission, or an archive this account did not queue"
        "404":
          description: No archive for that series, or one this account may not see
        "409":
          description: "Conflict: `done` -- the archive has finished"
  /api/sources/archive/{seriesId}:
    delete:
      tags:
        - sources
      summary: Stop a slow archive, or dismiss a finished one. What landed stays.
      operationId: deleteApiSourcesArchiveSeriesId
      description: >-
        Since v0.49.0. The account that queued it, or an admin (403 otherwise; 404 to one who cannot see the
        series). A chapter in flight finishes. The rest goes back to where it was before the archive: under a
        Latest-N or Nothing-yet floor it waits for someone to fetch it, otherwise the nightly sweep fetches it at its
        own pace. Audited as `download.archive_stop`.
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission, or an archive this account did not queue"
        "404":
          description: No archive for that series, or one this account may not see
  /api/sources/add:
    post:
      tags:
        - sources
      summary: Add a series from a source. Answers once the outcome is decided and downloads afterwards;
        started:true means downloading now.
      operationId: postApiSourcesAdd
      description: >-
        An add never fetches a chapter the library already holds. What is held is read from the library by
        FOLDER across every root -- including a read-only library the server did not download and whatever
        the files there are named -- so removing a series and adding it again downloads only what is
        actually missing (`chapters` counts that remainder). A chapter removed with **Delete files** is the
        one exception and IS fetched again: the nightly sweep treats that tombstone as held so it does not
        undo a deliberate deletion, but an add is somebody asking for the chapter now. When the whole
        selection is already here the answer carries `alreadyHere` with `chapters: 0` and `started: false`,
        and the series is still routed, floored, listed and given its cover as any other add would.
        Since v0.49.1 the add keeps the other names its source's description lists (GET
        /api/admin/series/{id}/alt-titles), before `alsoFollow` is judged, so a candidate that names the work by
        one of them matches -- exactly, and measured by the numbering both ways.

      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                sourceId:
                  type: string
                chapterCount:
                  type: integer
                  minimum: 1
                  description: How many chapters to take; omit for all.
                chapterFrom:
                  type: string
                  enum: [oldest, newest, none]
                  default: oldest
                  description: >-
                    Which end chapterCount counts from. Either way the selection is downloaded ascending.
                    With newest, a chapter floor is set so auto-update fetches new releases only. `none`
                    adds the series with no chapters at all: the row is created and followed, the listing
                    is written, no download starts, and a chapter floor is set just above the newest listed
                    number (max + 0.001, so every number listed today is below it and the next release is
                    not; null when the source lists nothing) so auto-update follows new releases only --
                    older chapters can be fetched from the series page. The row is stamped as checked (the
                    add just asked the source), so `checkedAt` and the source's chapter count are set from
                    the start; a series removed from the library and added back this way is revived under
                    its old id. `chapterCount` is ignored, and an empty listing is not `no_chapters`.
                autoUpdate:
                  type: boolean
                force:
                  type: boolean
                numbering:
                  type: string
                  enum: [auto, source, posting_order]
                  description: >-
                    How to number the series (v0.49.0, #116). `auto` (the default) numbers by posting order when
                    the source gives many different posts one number; `source` keeps the source's numbers;
                    `posting_order` numbers the posts 1..K whatever the detector says. `alsoFollow` is ignored
                    under posting order. A folder that already holds chapters is never renumbered by an add: it
                    is added in the source's numbers with a renumbering pending, for an admin to review (unless
                    the series kept an assignment for this source, when it was removed and is added back).
                alsoFollow:
                  type: array
                  maxItems: 6
                  items:
                    type: object
                    required: [source, sourceId]
                    properties:
                      source: { type: string, minLength: 1, maxLength: 200, description: Another adapter the caller found carrying this title. }
                      sourceId: { type: string, minLength: 1, maxLength: 200, description: The title's id on that adapter. }
                  description: >-
                    Other sources that carry this title, as the add dialog already found them (no search
                    runs for them), to be followed for the series when they qualify. ADMINS ONLY: for any
                    other role the field is dropped before the add, which then proceeds exactly as with none
                    given (no judgement, no carrier card) -- following is an admin act, as the manual route
                    POST /api/admin/series/{id}/sources is. Judged on the server once the listing exists --
                    at once for a `none` add, after the first chapter lands on a download -- by two rules.
                    The candidate's OWN title must match this series' (exact or containing, after
                    normalisation, alt titles included), else `title_differs`. Then its numbering, against a
                    primary listing of at least three numbers: with an EXACT title and a primary listing at
                    least ten, it must list at least 90% of the primary's numbers (the fill-scan rule; a copy
                    that runs on past the primary qualifies); with a containing title, or a primary listing
                    fewer than ten, the numbering must agree BOTH ways -- at least 90% of the primary's
                    numbers listed by it AND at least 90% of its numbers listed by the primary -- else
                    `numbering_differs`, so a sequel that continues past the primary ("Tokyo Ghoul:re" 1..60
                    for "Tokyo Ghoul" 1..20) is refused although it lists every number, while "(Official)"
                    1..22 for 1..20 follows (20 of 22). At most two sources are followed per series, in the
                    order given; the rest read `cap`. The primary itself, a disabled source, one in a
                    cooldown, one not loaded and one outside the caller's age cap are `unavailable` and
                    never asked. Up to six are asked, at most two lookups each, under a 90-second wall; what
                    is left is `not_tried`. Followers land with no author (`auto: true` on the series'
                    sources). Results are NOT in this answer: they are on the series' job card (GET
                    /api/sources/jobs, `autoFollow`), which a `none` add gets minted for the purpose.
                    Ignored for a title already in the library.
                archive:
                  type: boolean
                  description: >-
                    Since v0.49.0 (#117): "Archive the rest slowly" -- what the selection leaves is queued for the
                    slow archive (the rules of POST /api/sources/archive), once the add has settled. Ignored when
                    the selection is the whole listing.
                edition:
                  type: object
                  required: [of]
                  description: >-
                    Since v0.52.0 (#72): add this as a language edition of the series `of`, which the caller must
                    be able to open (404 otherwise). The edition is a series of its own -- its own folder,
                    `<source>/<title> (<LANG>)`, chapters, sources and reading progress -- linked to `of`'s work,
                    so the Library shows one card for both. `lang` is this copy's language, defaulting to what the
                    source declares and required when the source declares none (400 `edition_lang`); `ofLang` is
                    `of`'s language, applied only when `of` does not state one. The title's duplicate check is
                    skipped. Refused with 409 `edition_exists` when the work already holds that language (exact
                    code: `es` and `es-419` are two editions) and `edition_hidden` when a removed edition holds it.
                  properties:
                    of: { type: string, maxLength: 64 }
                    lang: { type: string, maxLength: 35, description: A BCP-47 code (`es-419`) or MangaDex's spelling (`es-la`). }
                    ofLang: { type: string, maxLength: 35 }
      security:
        - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, title, folder, chapters, started, nothing]
                properties:
                  ok: { type: boolean }
                  title: { type: string }
                  folder: { type: string }
                  chapters: { type: integer, description: How many chapters the add will fetch; 0 when already in the library, for a `none` add, or when the library already holds every chapter selected. }
                  started: { type: boolean, description: The download is running now. }
                  nothing: { type: boolean, description: "A `none` add: the series was created and floored and nothing was fetched or queued. Tells that outcome from `already in library`, which also answers chapters 0 and started false." }
                  seriesId:
                    type: string
                    description: >-
                      The library id of the series this add landed on -- the row it found already there, the
                      one it minted, the one it revived, or the one it stamped with nothing left to fetch --
                      so a client can open it without searching for it by title. Absent on a fresh download,
                      whose row is created behind the reply: that id appears on the job card (GET
                      /api/sources/jobs, `seriesId`) once the first chapter is scanned in. Also absent when
                      the caller may not see the series, which an "already in library" answer can name.
                  alreadyHere:
                    type: integer
                    minimum: 1
                    description: >-
                      Every chapter selected was already in the library, so none was fetched (`chapters` is
                      0 and `started` false). Absent on a partial re-add, where `chapters` is the remainder.
                  archive:
                    type: string
                    enum: [queued, later, nothing, already, unrouted, denied, not_found]
                    description: >-
                      Only when the request asked for `archive`: what became of the rest -- an outcome of POST
                      /api/sources/archive, or `later` on a download, which queues it once the first chapter is in
                      and the listing is written (it then shows on GET /api/sources/jobs `archive`). `later` too when
                      the add left the series' numbering for an admin's review (#116: a folder that already held
                      books): it is queued, and its boundary is placed once the renumber has settled, in the numbers
                      the series keeps. `nothing` when the selection was the whole listing.
                  edition:
                    type: object
                    description: >-
                      Since v0.52.0, on an add that asked for `edition`: its language, and `workId` once it is
                      linked. A download links once its first chapter is scanned in, so this answer has the
                      language only and the job card (GET /api/sources/jobs, `edition`) the rest. `unlinked`
                      says the series was added on its own instead: `taken` when another add took the language a
                      moment earlier, `gone` when `of` was removed meanwhile.
                    properties:
                      lang: { type: string }
                      workId: { type: string }
                      unlinked: { type: string, enum: [taken, gone] }
        "400":
          description: >-
            Malformed body or parameter; or, since v0.52.0, `edition_lang`: an edition from a source that
            declares no single language must say which language it is in.
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
        "409":
          description: >-
            Conflict: already exists, already running, or duplicate. A `duplicate` carries
            `existing: {title, source, id?}` -- the copy already on this server, whichever library it is in,
            since that is what makes it a duplicate. `id` is included only when the caller may see that
            series, so a client can offer to open it. Since v0.52.0 a `duplicate` whose source is in a language
            the library does not hold the title in also carries the server's offer, `edition: {of, heldLangs,
            lang}` -- send the add again with `edition: {of}` to add it as that language's edition -- only to a
            caller who may open `of`. `edition_exists` and `edition_hidden` carry `existing: {title, lang, id?}`,
            the edition holding the language: `id` when the caller may open it, and to an admin for a removed
            one, which Admin → Library puts back.
