  /api/series/{id}/listing:
    get:
      tags:
        - library
      summary: The chapters the sources list that this server does not hold, with the reason each is absent.
      operationId: getApiSeriesIdListing
      description: >-
        Read from the listing the updater persisted at the last check (the sweep, Check now), never from the
        sources themselves, so `checkedAt` is how old the answer is. Only numbers with NO chapter row are
        ghosts: a chapter the read-chapter cleanup deleted keeps its row (`pruned` on the Book) and is not
        listed here. `why` is one of `missing` (not fetched yet), `held` (waiting for a preferred group),
        `failed` (the sweep gave up after the retry cap; `attempts` says how many), `blocked` (only blocked
        groups released it; unblock the group to fetch it), `floor` (below the series' Latest-N floor). `reason`,
        the downloader's last error text, is present for admins only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [checkedAt, content]
                properties:
                  checkedAt:
                    type: [string, "null"]
                    format: date-time
                  content:
                    type: array
                    items:
