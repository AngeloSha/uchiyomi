  /api/v1/series/{id}/books:
    get:
      tags:
        - komga
      summary: "The chapter list (the extension asks `unpaged=true&media_status=READY&deleted=false`)."
      operationId: getApiV1SeriesIdBooks
      description: >-
        A Spring page of KomgaBook ordered by the override-aware chapter number, then file. `unpaged=true` is
        one page of everything with no 500 cap: `size` is the chapter count (at least 1), `number` 0, `first`
        and `last` true, `totalPages` 1 (0 for an empty series); the paged form (`page`, `size`) stays capped
