# Uchiyomi API -- OpenAPI 3.1.
#
# Served at /api/docs (Swagger UI) and /api/docs/json. Kept honest by bff/test/openapiCoverage.test.ts, which
# compares every registered route against this file in both directions, and docs/api.md against both.
# Generated once from the route table and then hand-maintained: add the operation here when you add the route.
openapi: 3.1.0
info:
  title: Uchiyomi API
  version: 0.39.0
  description: "Everything the web app does, it does over this API. Session JWTs are for the browser; scripts
    use a personal API token (Profile -> Connections -> API tokens), sent as `Authorization: Bearer uy_...`.
    Scopes: read (every token; GET plus the library search POST, which is a query), write (anything that changes data), admin (the /api/admin surface, which also
    needs an admin account). /img/* takes the yomi_img cookie, an API token as a Bearer, or the OPDS token
    over HTTP Basic -- so a third-party client needs ONE credential for the JSON and the pictures alike;
    /opds/* takes the OPDS token over HTTP Basic only. /api/v1/* and /api/v2/* are the Komga-compatible
    surface for Mihon's Komga extension and tracker (since v0.38.0): an API token as `X-API-Key`, as
    `Authorization: Bearer`, or as the HTTP Basic password, and the UCHIYOMI-SESSION cookie those requests
    mint -- never a password, never an OPDS token, never a session JWT. List endpoints answer { content: [...] } (the Komga routes answer
    Spring's page envelope); errors answer a non-2xx status with { error, message }. The prose guide with
    worked examples is docs/api.md."
servers:
  - url: /
    description: This server
tags:
  - name: health
    description: Liveness and readiness
  - name: auth
    description: Authentication, sessions, two-factor, single sign-on, first-run setup
  - name: library
    description: "Reading: home, series, chapters, pages, progress"
  - name: sources
    description: "Sources: find, browse and add series"
  - name: personal
    description: "Per-account data: favourites, collections, notes, tokens, trackers"
  - name: downloads
    description: Offline downloads
  - name: images
    description: Image server (cookie or OPDS Basic auth)
  - name: opds
    description: OPDS catalogue for external readers (HTTP Basic)
  - name: admin
    description: Administration (admin account and admin scope)
  - name: komga
    description: "Komga-compatible API for Mihon's Komga extension and tracker (API token as X-API-Key, Bearer or Basic password, or the UCHIYOMI-SESSION cookie)"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A session JWT from POST /auth/login, or a personal API token (uy_...). Admin routes need the
        admin scope and an admin account.
    opdsBasic:
      type: http
      scheme: basic
      description: >-
        HTTP Basic where the password is the OPDS token from POST /api/opds/token. Refused (401) while the
        account is disabled, like every other credential of a disabled account; the token is not revoked and
        works again once the account is re-enabled.
    imgCookie:
      type: apiKey
      in: cookie
      name: yomi_img
      description: Set at login so <img> tags can authenticate.
    komgaApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        A personal API token (uy_...) as the Komga extension's "API key" field sends it, on every request.
        Only on /api/v1/* and /api/v2/*. Read-only tokens browse; the tracker's PUT needs the write scope
        (403 otherwise). A token whose account is disabled, that has expired or that was revoked is a 401.
        Wins over an Authorization header, and any presented credential wins over the cookie. Ten failed
        credentials from one client address in five minutes (the /auth/login budget) and every further
        request from that address that presents a credential is 429 too_many_requests with Retry-After until
        the window ends; a request with no credential and a cookie-only request are neither counted nor
        blocked, and a valid key never counts.
    komgaBasic:
      type: http
      scheme: basic
      description: >-
        HTTP Basic where the PASSWORD is a personal API token (uy_...) and the username is ignored -- what
        the Komga extension sends after a 401 when no API key is configured. Account passwords are refused
        here on purpose: this protocol has no channel for a two-factor code, and a password path would
        bypass 2FA and the lockout. OPDS tokens and session JWTs are refused too. Because the extension only
        presents the password after a 401, a changed password is not noticed while the previous
        UCHIYOMI-SESSION cookie is valid (up to 7 days): revoke the old token, or use the API key field,
        which is sent on every request. Counted against the same failed-credential limit as komgaApiKey.
    komgaBearer:
      type: http
      scheme: bearer
      description: >-
        `Authorization: Bearer uy_...` -- a personal API token the way the rest of the API takes it, accepted
        on /api/v1/* and /api/v2/* since the v0.38.0 fix pass so a script can use one header for everything.
        API tokens only: a session JWT here is 401 ("Account sessions are not accepted here"), never
        outranked by a remembered cookie. Precedence X-API-Key, then Bearer, then Basic, then the cookie;
        counted against the same failed-credential limit as komgaApiKey.
    komgaSession:
      type: apiKey
      in: cookie
      name: UCHIYOMI-SESSION
      description: >-
        Minted by every request /api/v1/* or /api/v2/* authenticated with komgaApiKey or komgaBasic (HttpOnly;
        SameSite=Lax; Path=/; Secure only over HTTPS; Max-Age = min(7 days, the token's remaining life); no
        Domain), re-minted when absent, invalid, past half its life, or minted for another token, never on a
        401. Honoured ONLY by the Komga routes, for the requests Mihon's tracker sends with no credential at
        all. Its value names the API token row, which is re-read on every use, so revoking the token, letting
        it expire or disabling the account ends the cookie too. A cookie that does not verify counts as no
        cookie, never as a refusal -- and only the canonical value the server minted verifies
        (`v1.<tokenId>.<exp>.<mac>`, decimal exp with no leading zeros; any other spelling is no cookie).
        Named UCHIYOMI-SESSION rather than KOMGA-SESSION so a real Komga on the same host does not
        overwrite it in the phone's cookie jar. POST /auth/logout clears it from a browser too.
  schemas:
    KomgaPage:
      type: object
      description: >-
        Spring's page envelope, every one of the nine keys always present (the Kotlin client refuses a
        missing one). `number` is 0-based; `size` is 1..500 (default 20); `totalPages` is 0 for an empty
        result and `last` is true on the final page and on an empty one. An `unpaged=true` chapter list is
        the one answer that is not a page: `size` is the row count (at least 1, no 500 cap), `number` 0,
        `first` and `last` true, `totalPages` 1 (0 for an empty series).
      required: [content, empty, first, last, number, numberOfElements, size, totalElements, totalPages]
      properties:
        content: { type: array, items: {} }
        empty: { type: boolean }
        first: { type: boolean }
        last: { type: boolean }
        number: { type: integer, minimum: 0 }
        numberOfElements: { type: integer }
        size: { type: integer, minimum: 1, description: "1..500 on a page; the row count on an unpaged chapter list." }
        totalElements: { type: integer }
        totalPages: { type: integer }
    KomgaDateTime:
      type: string
      description: >-
        `yyyy-MM-ddTHH:mm:ss`, UTC, no zone letter and no milliseconds: the extension parses chapter dates
        strictly (LocalDateTime.parse) and a trailing `Z` or `.sss` would date every chapter at the epoch.
        A required date that is not known is `1970-01-01T00:00:00`.
      example: "2026-09-20T12:34:56"
    KomgaAuthor:
      type: object
      required: [name, role]
      properties:
        name: { type: string }
        role: { type: string, description: "`writer` for a series author; `translator` for a chapter's scanlation group (what the extension turns back into `scanlator`)." }
    KomgaLibrary:
      type: object
      required: [id, name, root, unavailable]
      properties:
        id: { type: string }
        name: { type: string }
        root: { type: string, description: Always empty; the on-disk path is not disclosed. }
        unavailable: { type: boolean, description: Always false. }
    KomgaSeries:
      type: object
      description: >-
        Komga's SeriesDto as both the extension and Mihon's tracker decode it, every non-null field padded.
        `metadata.status` is ENDED | ONGOING | ABANDONED | HIATUS for the statuses this server knows
        (Completed, Ongoing, On Hiatus, Cancelled and their synonyms) and otherwise the stored value
        upper-cased, which the client shows as UNKNOWN. `readingDirection` is one of LEFT_TO_RIGHT |
        RIGHT_TO_LEFT | VERTICAL | WEBTOON. The three read counts are real on GET /api/v1/series/{id}
        (Mihon derives UNREAD / READING / COMPLETED from them) and zero read / all unread in listings.
      required: [id, libraryId, name, url, fileLastModified, booksCount, booksReadCount, booksUnreadCount, booksInProgressCount, deleted, oneshot, metadata, booksMetadata]
      properties:
        id: { type: string }
        libraryId: { type: string }
        name: { type: string }
        url: { type: string, description: Always empty. }
        created: { oneOf: [ { $ref: "#/components/schemas/KomgaDateTime" }, { type: "null" } ] }
        lastModified: { oneOf: [ { $ref: "#/components/schemas/KomgaDateTime" }, { type: "null" } ] }
        fileLastModified: { $ref: "#/components/schemas/KomgaDateTime" }
        booksCount: { type: integer }
        booksReadCount: { type: integer }
        booksUnreadCount: { type: integer }
        booksInProgressCount: { type: integer }
        deleted: { type: boolean, description: Always false; a hidden series is a 404 here. }
        oneshot: { type: boolean, description: Always false. }
        metadata:
          type: object
          required: [status, statusLock, title, titleLock, titleSort, titleSortLock, summary, summaryLock, readingDirection, readingDirectionLock, publisher, publisherLock, ageRatingLock, language, languageLock, genres, genresLock, tags, tagsLock, totalBookCountLock]
          properties:
            status: { type: string }
            statusLock: { type: boolean }
            created: { oneOf: [ { $ref: "#/components/schemas/KomgaDateTime" }, { type: "null" } ] }
            lastModified: { oneOf: [ { $ref: "#/components/schemas/KomgaDateTime" }, { type: "null" } ] }
            title: { type: string }
            titleLock: { type: boolean }
            titleSort: { type: string }
            titleSortLock: { type: boolean }
            summary: { type: string }
            summaryLock: { type: boolean }
            readingDirection: { type: string, enum: [LEFT_TO_RIGHT, RIGHT_TO_LEFT, VERTICAL, WEBTOON] }
            readingDirectionLock: { type: boolean }
            publisher: { type: string }
            publisherLock: { type: boolean }
            ageRating: { type: [integer, "null"] }
            ageRatingLock: { type: boolean }
            language: { type: string }
            languageLock: { type: boolean }
            genres: { type: array, items: { type: string } }
            genresLock: { type: boolean }
            tags: { type: array, items: { type: string } }
            tagsLock: { type: boolean }
            totalBookCount: { type: [integer, "null"], description: Always null. }
            totalBookCountLock: { type: boolean }
        booksMetadata:
          type: object
          required: [authors, authorsLock, tags, tagsLock, summary, summaryNumber, created, lastModified]
          properties:
            authors: { type: array, items: { $ref: "#/components/schemas/KomgaAuthor" } }
            authorsLock: { type: boolean }
            tags: { type: array, items: { type: string } }
            tagsLock: { type: boolean }
            releaseDate: { type: [string, "null"], description: Always null. }
            summary: { type: string, description: The series summary again; the extension falls back to it. }
            summaryNumber: { type: string, description: Always empty. }
            created: { $ref: "#/components/schemas/KomgaDateTime" }
            lastModified: { $ref: "#/components/schemas/KomgaDateTime" }
    KomgaBook:
      type: object
      description: >-
        Komga's BookDto for one chapter. `number`, `metadata.numberSort` and the progress endpoint's numbers
        are ONE quantity, the override-aware chapter number, unrounded: the extension makes it the chapter
        number, and Mihon compares and PUTs it back in that unit. `metadata.number` is the display string.
        `name` is the chapter title or empty, never null. `media.status` is READY for a chapter whose file
        is on the server and ERROR for a tombstone (deleted from the server). `sizeBytes` is the file's size
        on disk (lib_books.size; 0 when never stamped) and `size` is Komga's text for it ("1.5 KiB", "0 B"),
        which the extension shows in its default chapter name `{number} - {title} ({size})`.
      required: [id, seriesId, seriesTitle, name, url, number, fileLastModified, sizeBytes, size, media, metadata, deleted, oneshot]
      properties:
        id: { type: string }
        seriesId: { type: string }
        seriesTitle: { type: string }
        name: { type: string }
        url: { type: string, description: Always empty. }
        number: { type: number }
        created: { oneOf: [ { $ref: "#/components/schemas/KomgaDateTime" }, { type: "null" } ] }
        lastModified: { oneOf: [ { $ref: "#/components/schemas/KomgaDateTime" }, { type: "null" } ] }
        fileLastModified: { $ref: "#/components/schemas/KomgaDateTime" }
        sizeBytes: { type: integer, description: The file size on disk; 0 when never stamped. }
        size: { type: string, description: "Komga's text for sizeBytes (\"1.5 KiB\")." }
        media:
          type: object
          required: [status, mediaType, pagesCount, mediaProfile, epubDivinaCompatible, comment]
          properties:
            status: { type: string, enum: [READY, ERROR] }
            mediaType: { type: string }
            pagesCount: { type: integer }
            mediaProfile: { type: string, description: Always DIVINA. }
            epubDivinaCompatible: { type: boolean, description: Always false. }
            comment: { type: string }
        metadata:
          type: object
          required: [title, titleLock, summary, summaryLock, number, numberLock, numberSort, numberSortLock, releaseDateLock, authors, authorsLock, tags, tagsLock, isbn, isbnLock, links, linksLock]
          properties:
            title: { type: string }
            titleLock: { type: boolean }
            summary: { type: string }
            summaryLock: { type: boolean }
            number: { type: string }
            numberLock: { type: boolean }
            numberSort: { type: number }
            numberSortLock: { type: boolean }
            releaseDate: { type: [string, "null"], description: "`yyyy-MM-dd` (the source's chapter date, else the file's time) or null." }
            releaseDateLock: { type: boolean }
            authors: { type: array, items: { $ref: "#/components/schemas/KomgaAuthor" }, description: The scanlation group, if any, as role `translator`. }
            authorsLock: { type: boolean }
            tags: { type: array, items: { type: string } }
            tagsLock: { type: boolean }
            isbn: { type: string }
            isbnLock: { type: boolean }
            links: { type: array, items: {} }
            linksLock: { type: boolean }
        deleted: { type: boolean }
        oneshot: { type: boolean }
    KomgaPageDto:
      type: object
      required: [number, fileName, mediaType]
      properties:
        number: { type: integer, minimum: 1, description: 1-based, as Komga numbers pages and as the extension puts it in the image URL. }
        fileName: { type: string }
        mediaType: { type: string }
        width: { type: [integer, "null"] }
        height: { type: [integer, "null"] }
    KomgaReadProgressV2:
      type: object
      description: >-
        What Mihon's Komga tracker reads. Over EVERY chapter of the series, tombstones included (members'
        history refers to them). `lastReadContinuousNumberSort` is the number of the last chapter in the
        LEADING run of completed chapters ordered by the override-aware number (chapters 1, 2 and 4 read
        reports 2; nothing read reports 0, and so does a run that ends on -- or starts with an unread --
        number-0 chapter); `maxNumberSort` is the highest chapter number. Mihon truncates the latter to its chapter total and derives UNREAD / READING /
        COMPLETED from the counts.
      required: [booksCount, booksReadCount, booksUnreadCount, booksInProgressCount, lastReadContinuousNumberSort, maxNumberSort]
      properties:
        booksCount: { type: integer }
        booksReadCount: { type: integer }
        booksUnreadCount: { type: integer }
        booksInProgressCount: { type: integer }
        lastReadContinuousNumberSort: { type: number }
        maxNumberSort: { type: number }
    KomgaUser:
      type: object
      required: [id, email, roles, sharedAllLibraries, sharedLibrariesIds, labelsAllow, labelsExclude]
      properties:
        id: { type: string }
        email: { type: string, description: The username (the extension calls the field the account email). }
        roles: { type: array, items: { type: string }, description: "[USER], or [ADMIN, USER] for an admin." }
        sharedAllLibraries: { type: boolean, description: True when the account has no per-library grants. }
        sharedLibrariesIds: { type: array, items: { type: string } }
        labelsAllow: { type: array, items: { type: string }, description: Always empty. }
        labelsExclude: { type: array, items: { type: string }, description: Always empty. }
        ageRestriction:
          type: [object, "null"]
          description: "`{ age, restriction: ALLOW_ONLY }` from the account's max_age_rating, or null when it has none."
          properties:
            age: { type: integer }
            restriction: { type: string }
    ScanlatorPrefs:
      type: object
      description: >-
        Release preferences: which scanlation group to take when a source lists a chapter more than once,
        which never to take, and how long to hold a new chapter for a ranked group before the best available
        copy is taken instead. Stored server-wide on the settings row and, optionally, per series. When both
        exist they merge: blocked is the union, a per-series priority replaces the global list, and a null
        per-series patienceDays inherits the global one (2 when that is null too). Names are compared
        case-insensitively with punctuation and spaces ignored, so "Asura Scans" and "asurascans" are one
        group. On write every field is optional: a missing list is empty and a missing patienceDays is
        null (inherit); responses always carry all three.
      properties:
        priority:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 80 }
          description: Groups to take first, best first. A chapter only waits for one of these when the list is non-empty.
        blocked:
          type: array
          maxItems: 200
          items: { type: string, minLength: 1, maxLength: 80 }
          description: >-
            Groups never to take. A joint release is dropped only when every group on it is blocked, and a
            copy that names no group is never blocked.
        patienceDays:
          type: [integer, "null"]
          minimum: 0
          maximum: 30
          description: Days to hold a new chapter for a ranked group; 0 takes the best copy at once; null inherits.
    SeriesSource:
      type: object
      description: One place a series' chapters come from. The primary is the pair the series was added with; the rest were followed later.
      required: [sourceId, name, sourceSeriesId, primary, checkedAt, chapters, registered, auto]
      properties:
        sourceId: { type: string, description: The adapter id. }
        name: { type: string, description: The adapter's display name, or the id when the adapter is not loaded. }
        sourceSeriesId: { type: string, description: The series' id on that source. }
        primary: { type: boolean }
        checkedAt: { type: [string, "null"], format: date-time, description: When the updater last listed it. }
        chapters: { type: [integer, "null"], description: "For a follower, the distinct chapter numbers it listed then; for the primary, the merged count across every followed source after the release preferences (the same figure as the series' source.chapters)." }
        registered: { type: boolean, description: Whether the adapter is loaded right now; a follower whose extension was removed keeps its row so it can still be unfollowed. }
        auto: { type: boolean, description: "Followed by the add-time auto-follow (POST /api/sources/add alsoFollow) rather than by a person: the row has no author. Always false for the primary. A person confirming the same source through a fill-scan plan turns it false." }
    Ghost:
      type: object
      description: A chapter number the sources listed at the last check that this server has no row for.
      required: [number, title, publishedAt, scanlator, groups, sourceId, sourceName, why]
      properties:
        number: { type: number }
        title: { type: [string, "null"] }
        publishedAt: { type: [string, "null"], format: date-time }
        scanlator: { type: [string, "null"], description: The group on the copy the release rules chose, as the source shows it. }
        groups: { type: array, items: { type: string }, description: Every group that released any copy of the number. }
        sourceId: { type: string, description: The adapter the chosen copy would be fetched through. }
        sourceName: { type: string }
        why:
          type: string
          enum: [missing, held, blocked, failed, floor]
        attempts: { type: integer, description: Only when the chapter has failed at least once. }
        reason: { type: string, description: The downloader's last error text. Admins only. }
        waitingFor: { type: string, description: "Only when why is held, and only when a priority group survives the blocklist: the effective first-choice group (the series' own priority over the global one) the chapter is being held for, spelt as the preference names it." }
        waitDaysLeft: { type: integer, minimum: 0, description: "Only with waitingFor: whole days until the patience window closes, counted as the sweep counts it -- from the oldest hosted copy that is not from a blocked group, under today's preferences (so 0 when the window has closed since the last check)." }
    SkippedNumber:
      type: object
      required: [number, reason]
      properties:
        number: { type: number }
        reason:
          type: string
          enum: [not_listed, blocked_group, already_here, source_unavailable, cooldown, duplicate]
          description: >-
            `duplicate` is a second pick for a number already picked in the same body: the first pick was
            handled, this one was not.
        source: { type: string, description: Present when the skipped entry was a pick, naming the copy asked for. }
        sourceId: { type: string, description: Present when the skipped entry was a pick. }
    Pick:
      type: object
      description: >-
        One specific copy of a chapter number, as GET /api/series/{id}/versions lists it. A pick is
        authorised by a matching entry in the number's stored copies (`not_listed` otherwise) and ignores
        the group rules including the blocklist -- an explicit choice of one copy -- but never `already_here`.
      required: [number, source, sourceId]
      properties:
        number: { type: number, minimum: 0, maximum: 1000000 }
        source: { type: string, minLength: 1, maxLength: 200, description: The adapter id the copy is listed on. }
        sourceId: { type: string, minLength: 1, maxLength: 200, description: The chapter id within that source. }
    Cadence:
      type: object
      description: >-
        A group's release rhythm, from the median gap between its last ten release DAYS (a day with several
        chapters is one release day, so a group that ships two at a time is not "daily"): `daily` (at most
        1.5 days), `weekly` (at most 9), `monthly` (at most 40), `irregular` (longer); `unknown` with fewer
        than two distinct dated days. `quiet` when the silence since the last release exceeds three
        intervals (never less than 14 days), or 45 days when the rhythm is unknown.
      required: [kind, intervalDays, daysSince, quiet]
      properties:
        kind:
          type: string
          enum: [daily, weekly, monthly, irregular, unknown]
        intervalDays: { type: [number, "null"], description: The median gap in days, one decimal; null when unknown. }
        daysSince: { type: [integer, "null"], description: Whole days since the last dated release; null when none is dated. }
        quiet: { type: boolean }
    GroupStat:
      type: object
      description: >-
        One scanlation group's figures for a series. Groups are merged by the same equality the release
        rules use (case, spaces and punctuation ignored); the name is the first spelling seen on disk, else
        the first listed. A joint release counts once for each of its groups.
      required: [name, releases, first, last, lastReleaseAt, cadence, onDisk, chapters, langs, weeks]
      properties:
        name: { type: string }
        releases: { type: integer, description: Chapters the group released -- distinct numbers across every followed source; a second copy of a number is not a second release. }
        first: { type: [number, "null"], description: The lowest chapter number it released. }
        last: { type: [number, "null"], description: The highest chapter number it released. }
        lastReleaseAt: { type: [string, "null"], format: date-time }
        cadence:
          $ref: "#/components/schemas/Cadence"
        onDisk: { type: integer, description: Live chapters on this server stamped with the group. }
        chapters: { type: array, items: { type: number }, description: The numbers it released, ascending, each once. }
        langs: { type: array, items: { type: string }, description: The languages its copies are in, sorted. }
        weeks:
          type: array
          minItems: 12
          maxItems: 12
          items: { type: boolean }
          description: "One flag per week for the last twelve, oldest first, newest last (index 11 is the seven days ending now): true when the group released in that week, from the same per-number release dates the cadence is judged on. A release dated ahead of the server's clock counts as this week."
    Copy:
      type: object
      description: One version of a listed chapter number, as the sources list it.
      required: [key, source, sourceName, groups, scanlator, lang, pages, publishedAt, chosen, blocked, onDisk]
      properties:
        key: { type: string, description: "`<source>:<sourceId>`, unique within the number." }
        source: { type: string, description: The adapter id; with `sourceId` this is what a Pick names. }
        sourceName: { type: string }
        groups: { type: array, items: { type: string } }
        scanlator: { type: [string, "null"], description: The group string as the source shows it (a joint release reads "A & B"). }
        lang: { type: [string, "null"] }
        pages: { type: [integer, "null"], description: 0 is an external link (not downloadable); null when the source does not say. }
        publishedAt: { type: [string, "null"], format: date-time }
        chosen: { type: boolean, description: The copy the release rules chose at the last check. }
        blocked: { type: boolean, description: Every group on the copy is blocked by the effective preferences. A copy with no groups is never blocked. }
        onDisk: { type: boolean, description: "Best effort: a live chapter for the number came from the same source with the same group stamp (or, for a file with no stamp, this is the chosen copy)." }
paths:
  /livez:
    get:
      tags:
        - health
      summary: Is the process alive? Unconditional {ok:true}; what the container healthcheck polls.
      operationId: getLivez
      security: []
      responses:
        "200":
          description: OK
  /healthz:
    get:
      tags:
        - health
      summary: Is the database reachable? Runs SELECT 1; 503 when Postgres is down.
