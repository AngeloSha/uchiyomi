          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  scanlator:
                    type: [string, "null"]
                    description: >-
                      The group that released the file on disk, as the source showed it (a joint release
                      reads "A & B"). Null for a chapter the scanner found rather than the downloader wrote,
                      which includes everything downloaded before v0.31.0.
                  sourceId:
                    type: [string, "null"]
                    description: The adapter the file was downloaded from; null when the scanner found it.
                  pruned:
                    type: boolean
                    description: >-
                      The file was deleted by the read-chapter cleanup or an admin; the row stays so progress
                      survives; no pages behind it. The chapter is still listed and still counts as read, but
                      the page list is empty, next/previous step over it, and the download manifest answers
                      410.
                  owned:
                    type: boolean
                    description: >-
                      Downloaded by this server (the file sits under the download directory); only such
                      chapters can be deleted or fetched again. False for a chapter the scanner found in the
                      read library.
