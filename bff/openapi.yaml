  /api/admin/notify-targets:
    get:
      tags:
        - admin
      summary: Every notification target (webhook, Home Assistant, ntfy, Discord), masked.
      operationId: getApiAdminNotifyTargets
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Since v0.43.0.
        Each target is shown by its masked display form alone (scheme and host); the address, the token and the
        ntfy topic are never returned and there is no endpoint that reveals them.
      security:
        - bearer: []
      responses:
        "200":
          description: The targets, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [targets]
                properties:
                  targets:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotifyTarget"
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
    post:
      tags:
        - admin
      summary: Add a notification target. The address and token are sealed and never shown again.
      operationId: postApiAdminNotifyTargets
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Since v0.43.0.
        What each kind needs - webhook: url, optional token (sent as a Bearer header). home_assistant: url (only
        its origin is kept), token (a long-lived access token), service (domain.service, e.g.
        notify.mobile_app_pixel; the request path is rebuilt from it, never concatenated). ntfy: url (default
        https://ntfy.sh), topic (1-64 of A-Z a-z 0-9 _ -), optional token. discord: url, a Discord webhook address
        (https, discord.com or discordapp.com, /api/webhooks/id/token). Private addresses (192.168.x, 10.x,
        .local) are allowed on purpose; http(s) only, no user:password in the address, cloud-metadata addresses
        and this server's own port are refused. Every refusal is a fixed sentence that never repeats what was
        typed. The audit row notify.target.create carries the id, kind, name, host and userId, never the address
        or the token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name]
              properties:
                kind:
                  type: string
                  enum: [webhook, home_assistant, ntfy, discord]
                name: { type: string, minLength: 1, maxLength: 80 }
                url: { type: string, maxLength: 2048 }
                token: { type: [string, "null"], maxLength: 4096 }
                topic: { type: string, maxLength: 64 }
                service: { type: string, maxLength: 255 }
                events:
                  type: array
                  items: { type: string, enum: [new_chapters, health] }
                  minItems: 1
                  description: Default both.
                template:
                  type: [string, "null"]
                  maxLength: 500
                  description: "The digest message. Variables {count}, {series}, {list}; null or blank is the default \"{count} new chapters in {series}\"."
                userId:
                  type: [string, "null"]
                  format: uuid
                  description: Aim the target at one person - the digest then carries only their favourites, and health notices reach it only when that person is an admin.
                includeAdult:
                  type: boolean
                  description: Name series from libraries rated 18+ in the digest. Default false - a target aimed at a person is still bounded by that person's libraries and age cap.
                enabled: { type: boolean, description: Default true. }
      security:
        - bearer: []
      responses:
        "201":
          description: The saved target, masked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifyTarget"
        "400":
          description: >-
            Malformed body (bad_request, with the field names in fields), or a refusal - bad_url, blocked_address
            (cloud metadata), self_target (this server), token_required, bad_token, bad_service, bad_topic,
            bad_discord_url, unknown_user.
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/admin/notify-targets/{id}:
    patch:
      tags:
        - admin
      summary: Change a notification target; re-entering an address or token replaces it.
      operationId: patchApiAdminNotifyTargetsId
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Since v0.43.0.
        Any subset of name, enabled, events, template, userId, includeAdult, and the credentials url, token, topic, service;
        the kind cannot change (an unknown field is a 400). A re-entered credential is merged over the stored
        ones and the target validated again as at creation; a new address or token clears last_error and the
        failure streak, and switching a target back on gives it a fresh streak. When the stored secret can no
        longer be read (a regenerated JWT_SECRET) a partial re-entry is a 400 reenter_all - type the address and
        the token again. A stored credential never follows the address to another host: a url on another origin
        is a 400 reenter_token when a token is stored and none was sent, or reenter_topic for ntfy, so a
        re-point plus a Test cannot read back a secret the API never returns; a path change on the same origin
        keeps them. The audit row notify.target.update carries the id, the NAMES of the fields sent - never
        their values - and the new host when the address changed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                url: { type: string, maxLength: 2048 }
                token: { type: [string, "null"], maxLength: 4096, description: null or blank removes an optional token. }
                topic: { type: string, maxLength: 64 }
                service: { type: string, maxLength: 255 }
                events:
                  type: array
                  items: { type: string, enum: [new_chapters, health] }
                  minItems: 1
                template: { type: [string, "null"], maxLength: 500 }
                userId: { type: [string, "null"], format: uuid }
                includeAdult: { type: boolean }
                enabled: { type: boolean }
      security:
        - bearer: []
      responses:
        "200":
          description: The target after the change, masked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifyTarget"
        "400":
          description: Malformed body, a refusal as for POST, reenter_all, reenter_token or reenter_topic.
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
    delete:
      tags:
        - admin
      summary: Delete a notification target.
      operationId: deleteApiAdminNotifyTargetsId
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Since v0.43.0.
        Audited as notify.target.delete with the id, kind and name.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: "{ok: true}"
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
  /api/admin/notify-targets/{id}/test:
    post:
      tags:
        - admin
      summary: Send one test message to a SAVED target and say how it went.
      operationId: postApiAdminNotifyTargetsIdTest
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Since v0.43.0.
        Takes the id of a saved target and nothing else - an address in the body is ignored, so this cannot be
        used to probe an arbitrary URL. Five per minute per admin (keyed on the account, not the address).
        Not retried; redirects are never followed. The answer is a reason from a closed set, never the target's
        answer body, headers or resolved address. The result is recorded on the target (lastOkAt / lastError),
        but a failed Test does not count towards the automatic switch-off. Audited as notify.target.test.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: How the delivery went.
          content:
            application/json:
              schema:
                type: object
                required: [ok, status, reason]
                properties:
                  ok: { type: boolean }
                  status: { type: [integer, "null"], description: The HTTP status the target answered, null when none. }
                  reason:
                    type: string
                    enum: [ok, timeout, refused, dns, tls, unreachable, unauthorized, not_found, rate_limited, server_error, bad_response, redirect, blocked, secret_unreadable]
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
        "429":
          description: More than five Tests in a minute from this admin
