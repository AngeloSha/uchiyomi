      summary: "Find a title across enabled sources in order: returns {source, sourceId, title, ...}."
      operationId: getApiSourcesFind
      description: >-
        `sources` is a comma-separated scope: unscoped this is one outbound request per registered source.
        Since v0.42.0 an adult source is neither asked nor returned while the 18+ reveal is off, and naming
        it in `sources` does not bring it back — the scope only narrows the fan-out, it never widens it.
      parameters:
