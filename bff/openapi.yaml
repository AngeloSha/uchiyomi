        - images
      summary: A remote cover proxied same-origin; a value that is not a URL gets a placeholder rather than an error.
      operationId: getImgSourcesCover
      description: >-
        `u` is fetched through the SSRF guard (private, loopback, link-local and blocked addresses refused at
        every redirect hop, four at most); an unfetchable value answers the placeholder image, uncached, and a
        genuine upstream failure 502. The one URL fetched without the guard is the extension engine's own
        thumbnail, `<SUWAYOMI_URL>/api/v1/manga/<id>/thumbnail`; since v0.37.0 that exemption is one path
        shape, not one origin -- the URL on the wire is rebuilt from the configured engine base plus the
        numeric id and fetched only if it round-trips to exactly the origin and path the caller named -- and a
        redirect from it is refused.
      parameters:
        - name: u
          in: query
          required: false
          schema:
            type: string
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: w
          in: query
          required: false
          schema:
            type: integer
      security:
        - imgCookie: []
        - bearer: []
        - opdsBasic: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /img/sources/preview:
    get:
      tags:
        - images
      summary: One page of a previewed chapter, by the chapter's number and the page's index.
      operationId: getImgSourcesPreview
      description: >-
        Since v0.47.0 (#91). The chapter is named by its number in GET /api/sources/preview's listing and the
        page by its index -- never a URL or a chapter id from the caller. The page is fetched by the server
        through the same guard as /img/sources/cover (an extension's page only from the engine's own origin),
        one at a time per source, and served as the original bytes with `cache-control: private, no-store`,
        only when they are an image (JPEG, PNG, WebP, GIF or AVIF) and at most 15 MB. Refused for an account
        with an age limit or without the download permission, and for a disabled source or one in a cooldown;
        any fetch failure is a flat 502.
      parameters:
        - { name: source, in: query, required: true, schema: { type: string } }
        - { name: sourceId, in: query, required: true, schema: { type: string } }
        - { name: number, in: query, required: true, schema: { type: number } }
        - { name: i, in: query, required: true, description: The page index, from 0., schema: { type: integer, minimum: 0 } }
      security:
        - imgCookie: []
        - bearer: []
        - opdsBasic: []
      responses:
        "200":
          description: The page's bytes.
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: an age limit, no download permission, or a disabled source"
        "404":
          description: No such chapter in the listing, or no such page
        "429":
          description: The source is in a cooldown
        "502":
          description: The page could not be fetched, or was not an image
