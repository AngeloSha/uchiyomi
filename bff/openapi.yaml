  /api/admin/series/{id}/delete-files:
    post:
      tags:
        - admin
      summary: Delete a hidden series' files from disk (irreversible); the rows stay, marked deleted from the server.
      operationId: postApiAdminSeriesIdDeleteFiles
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Only ever
        after the hide, and against the typed title, because it walks every root the series occupies, the
        read library included. Every row stays (read_progress.book_id is ON DELETE RESTRICT); since v0.37.0
        each row whose file was actually removed is marked pruned with `pruned_reason = 'deleted'` -- the
        tombstone chapters/delete and the cleanup leave -- so a restore lists those chapters as pruned
        ("Deleted from the server", where chapters/refetch brings one back onto the same row), the updater
        keeps counting them as held, and `files` counts real unlinks rather than rows (a second call reports
        0). A row whose file is already absent is reconciled only when the root is provably mounted --
        stat(root) works, at least one chapter file of any series is present under it (a present folder is
        not proof), and no more than 90 % of what was looked at is absent, the verify task's own rule; up to
        200 other series' live rows on the root are stat'ed when none of this series' own is present. Under
        that proof a live row with no file is marked `pruned_reason = 'deleted'` and a `'missing'` tombstone
        becomes `'deleted'`; on an unproven root every row is left as it was (an unmounted share leaves
        live rows, which Forget refuses on). `files` still counts unlinks only, so a series whose folder was
        removed by hand answers `files: 0` and its Removed row then offers Forget (`live_books` 0). Delete
        files on a merge survivor also removes the folders of the rows merged into it, and every folder is
        resolved on every root before anything is unlinked. Refuses rather than half-applies.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: string
                  description: The series' title, compared trimmed and NFC-normalised on both sides.
      security:
        - bearer: []
      responses:
        "200":
          description: "{ ok: true, files, bytes } -- files actually unlinked this call (0 for a series whose files were removed by hand; its absent rows are marked when the root is provably mounted)."
        "400":
          description: "bad_request, or confirm_mismatch when `confirm` is not the series' title."
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
        "409":
          description: "refused { message, fix }: not hidden yet, no chapter rows on any root, a folder that resolves outside the library, or a root that is not writable (PUID/PGID unset; fix names it)."
  /api/admin/series/{id}/forget:
    post:
      tags:
        - admin
      summary: "Forget a removed series for good: erase its rows and everyone's reading history on it (irreversible; since v0.38.0)."
      operationId: postApiAdminSeriesIdForget
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. The third
        step after Remove and Delete files, and the only call that hard-deletes a series row. In one
        transaction it erases the series' chapter rows and, for every member, their reading progress,
        reading events, bookmarks, notes, ratings, favourites, collection entries, tracker floors and
        links, plus the series' overrides, art, sources, listing and failure ledger -- so stats, streaks,
        the leaderboard and Wrapped change retroactively, and the AniList/MAL/Kitsu floor for it is gone.
        Rows this series absorbed by merge are forgotten with it (leaving them would flip them live). History
        on chapters that moved to a merge survivor is re-pointed to the survivor first, never erased; if a
        progress row or bookmark on another series' chapter is still filed here after that, the whole
        transaction rolls back (409 `stranded`). Refuses, rather than half-applies, while the series is still
        in the library (Remove first), while any chapter row still claims a file (Delete files first, which
        on a provably mounted root also marks rows whose files were removed by hand), while a root cannot be
        stat'ed at all (mount it first), or while the folder still holds chapters under any root (an empty
        folder does not count: the scanner never turns one into a series). A 'missing' tombstone from the
        verify task does not refuse: nothing in Uchiyomi marks a chapter row whose file it cannot see, so an
        unmounted share leaves every row live and the live-row refusal is what stops it, whereas 'missing'
        means verify proved the root was mounted and the file was not on it. There is no Put back. Audit:
        `series.forget` { id, title, folder, books, absorbed, absorbedIds, users, rowsByTable }.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: string
                  description: The series' title, compared trimmed and NFC-normalised on both sides (a macOS-written NFD title is confirmed by an NFC keyboard).
      security:
        - bearer: []
      responses:
        "200":
          description: "{ ok: true, books, absorbed, users } -- chapter rows erased, absorbed series rows that went with it, and distinct members who lose history (progress, reading events, bookmarks, notes, favourites, ratings, collection entries, or a tracker floor erased rather than carried to a merge survivor; opening the series page, the NEW-badge counter, does not count)."
        "400":
          description: "bad_request for a body without `confirm`; confirm_mismatch { message: 'Type the series title exactly to confirm.' } when it is not the title."
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found
        "409":
          description: "refused { message, fix }, one of: live -- still in the library (fix: Content -> Library -> Remove, then Delete files, then Forget); live_books -- N chapter row(s) still claim(s) a file on disk (fix: Delete files, then Forget); missing_files -- a root is not there right now, so nothing can be checked against it (fix: Mount the library and delete the files first); folder_present -- the folder still holds chapters under a root (fix: Delete files first, or remove the folder by hand and rescan); or stranded -- history from an older merge (nothing was changed; fix: report it)."
  /api/admin/series/{id}/chapters/delete:
    post:
      tags:
        - admin
      summary: Delete chosen chapters' files from the download directory, keeping their rows as tombstones.
      operationId: postApiAdminSeriesIdChaptersDelete
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Touches
        DL_ROOT only: a chapter the scanner found in the read library is skipped (`not_owned`), on the same
        footing as the read-chapter cleanup, and so is one somebody has a bookmark in (`bookmarked`) -- a
        bookmark names a page inside the file. A chapter whose file AND folder are missing is skipped
        (`unlink_failed`) rather than marked: that is the download volume not being mounted. The row survives
        with `pruned` set so reading progress and the updater's have-set do; the cover moves to the lowest
        live chapter. No typed confirmation -- the client confirms with the count.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookIds]
              properties:
                bookIds:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, applied, bytes, skipped]
                properties:
                  ok:
