                required: [checkedAt, prefs, global, effective, groups]
                properties:
                  checkedAt:
                    type: [string, "null"]
                    format: date-time
                    description: When the series' sources were last listed; null for a series never checked.
                  prefs:
                    description: The series' own preferences, or null when it has none.
                    oneOf:
                      - $ref: "#/components/schemas/ScanlatorPrefs"
                      - type: "null"
                  global:
                    $ref: "#/components/schemas/ScanlatorPrefs"
                  effective:
                    type: object
                    description: The merge the updater runs this series with.
                    required: [priority, blocked, patienceDays]
                    properties:
                      priority: { type: array, items: { type: string } }
                      blocked: { type: array, items: { type: string } }
                      patienceDays: { type: integer }
                  groups:
                    type: array
                    description: >-
                      Sorted by onDisk + listed descending, then by name. Each entry is a GroupStat (the same
                      figures GET /api/series/{id}/groups answers, from the same persisted copies and live
                      files) plus `listed`, kept equal to `releases`. A name in the preferences that nothing
                      lists or holds is a row of zeros.
                    items:
                      allOf:
                        - $ref: "#/components/schemas/GroupStat"
                        - type: object
                          required: [listed]
                          properties:
                            listed: { type: integer, description: Kept for clients written against the v0.31.0 shape; equals releases. }
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
  /api/admin/series/{id}/sources:
    post:
      tags:
        - admin
      summary: Follow another source for a series, from a candidate a fill scan found followable.
      operationId: postApiAdminSeriesIdSources
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. The
        candidate has to come from a plan POST /api/sources/fill/scan answered for this series, and the plan
        has to have found it followable: at least 90% of the chapter numbers already held were listed there
        and the verdict was ok or nothing_to_fill. A bare (source, id) pair is not accepted: the plan is the
        only place the "same series?" judgement is made. The series' own source is refused, since following
        it would list every chapter twice. Following a source again updates its series id and coverage.
        Once followed, the updater merges that source's chapter list with the primary's on every check.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId, source, sourceSeriesId]
              properties:
                planId:
                  type: string
                  description: From the fill scan.
                source:
                  type: string
                  description: A candidate's source id in that plan.
                sourceSeriesId:
                  type: string
                  description: That candidate's series id on the source.
      security:
        - bearer: []
      responses:
        "200":
          description: Followed. The series' full source list, primary first.
          content:
            application/json:
              schema:
                type: object
                required: [ok, sources]
                properties:
                  ok: { type: boolean }
                  sources:
                    type: array
                    items:
                      $ref: "#/components/schemas/SeriesSource"
        "400":
          description: >-
            bad_request (malformed body, or the plan is for another series); not_in_plan (that source and
            id were not among the plan's candidates); not_followable (the plan refused it, with reason and
            coverage in the body).
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
        "409":
          description: >-
            plan_stale (the plan expired or was never issued: scan again); is_primary (that is the series'
            own source); source_unavailable (the adapter is not loaded or is disabled).
