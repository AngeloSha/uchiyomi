# Uchiyomi API -- OpenAPI 3.1.
#
# Served at /api/docs (Swagger UI) and /api/docs/json. Kept honest by bff/test/openapiCoverage.test.ts, which
# compares every registered route against this file in both directions, and docs/api.md against both.
# Generated once from the route table and then hand-maintained: add the operation here when you add the route.
openapi: 3.1.0
info:
  title: Uchiyomi API
  version: 0.31.0
  description: "Everything the web app does, it does over this API. Session JWTs are for the browser; scripts
    use a personal API token (Profile -> Account -> API tokens), sent as `Authorization: Bearer uy_...`.
    Scopes: read (every token; GET plus the library search POST, which is a query), write (anything that changes data), admin (the /api/admin surface, which also
    needs an admin account). /img/* takes the yomi_img cookie, an API token as a Bearer, or the OPDS token
    over HTTP Basic -- so a third-party client needs ONE credential for the JSON and the pictures alike;
    /opds/* takes the OPDS token over HTTP Basic only. List endpoints answer { content: [...] };
    errors answer a non-2xx status with { error, message }. The prose guide with worked examples is
    docs/api.md."
servers:
  - url: /
    description: This server
tags:
  - name: health
    description: Liveness and readiness
  - name: auth
    description: Authentication, sessions, two-factor, single sign-on, first-run setup
  - name: library
    description: "Reading: home, series, chapters, pages, progress"
  - name: sources
    description: "Sources: find, browse and add series"
  - name: personal
    description: "Per-account data: favourites, collections, notes, tokens, trackers"
  - name: downloads
    description: Offline downloads
  - name: images
    description: Image server (cookie or OPDS Basic auth)
  - name: opds
    description: OPDS catalogue for external readers (HTTP Basic)
  - name: admin
    description: Administration (admin account and admin scope)
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A session JWT from POST /auth/login, or a personal API token (uy_...). Admin routes need the
        admin scope and an admin account.
    opdsBasic:
      type: http
      scheme: basic
      description: HTTP Basic where the password is the OPDS token from POST /api/opds/token.
    imgCookie:
      type: apiKey
      in: cookie
      name: yomi_img
      description: Set at login so <img> tags can authenticate.
  schemas:
    ScanlatorPrefs:
      type: object
      description: >-
        Release preferences: which scanlation group to take when a source lists a chapter more than once,
        which never to take, and how long to hold a new chapter for a ranked group before the best available
        copy is taken instead. Stored server-wide on the settings row and, optionally, per series. When both
        exist they merge: blocked is the union, a per-series priority replaces the global list, and a null
        per-series patienceDays inherits the global one (2 when that is null too). Names are compared
        case-insensitively with punctuation and spaces ignored, so "Asura Scans" and "asurascans" are one
        group. On write every field is optional: a missing list is empty and a missing patienceDays is
        null (inherit); responses always carry all three.
      properties:
        priority:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 80 }
          description: Groups to take first, best first. A chapter only waits for one of these when the list is non-empty.
        blocked:
          type: array
          maxItems: 200
          items: { type: string, minLength: 1, maxLength: 80 }
          description: >-
            Groups never to take. A joint release is dropped only when every group on it is blocked, and a
            copy that names no group is never blocked.
        patienceDays:
          type: [integer, "null"]
          minimum: 0
          maximum: 30
          description: Days to hold a new chapter for a ranked group; 0 takes the best copy at once; null inherits.
    SeriesSource:
      type: object
      description: One place a series' chapters come from. The primary is the pair the series was added with; the rest were followed later.
      required: [sourceId, name, sourceSeriesId, primary, checkedAt, chapters, registered]
      properties:
        sourceId: { type: string, description: The adapter id. }
        name: { type: string, description: The adapter's display name, or the id when the adapter is not loaded. }
        sourceSeriesId: { type: string, description: The series' id on that source. }
        primary: { type: boolean }
        checkedAt: { type: [string, "null"], format: date-time, description: When the updater last listed it. }
        chapters: { type: [integer, "null"], description: "For a follower, the distinct chapter numbers it listed then; for the primary, the merged count across every followed source after the release preferences (the same figure as the series' source.chapters)." }
        registered: { type: boolean, description: Whether the adapter is loaded right now; a follower whose extension was removed keeps its row so it can still be unfollowed. }
paths:
  /livez:
    get:
      tags:
        - health
      summary: Is the process alive? Unconditional {ok:true}; what the container healthcheck polls.
      operationId: getLivez
      security: []
      responses:
        "200":
          description: OK
  /healthz:
    get:
      tags:
        - health
      summary: Is the database reachable? Runs SELECT 1; 503 when Postgres is down.
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: OK
        "503":
          description: Database unreachable
  /api/setup/status:
    get:
      tags:
        - auth
      summary: Whether first-run setup has been completed.
      operationId: getApiSetupStatus
      security: []
      responses:
        "200":
          description: OK
  /api/setup:
    post:
      tags:
        - auth
      summary: Create the first admin account (only while no account exists).
      operationId: postApiSetup
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                displayName:
                  type: string
      security: []
      responses:
        "200":
          description: OK
        "400":
          description: Malformed body or parameter
        "409":
          description: "Conflict: already exists, already running, or duplicate"
  /auth/config:
    get:
      tags:
        - auth
      summary: Login options the client should offer (registration open, OIDC configured).
      operationId: getAuthConfig
      security: []
      responses:
        "200":
          description: OK
  /auth/login:
    post:
      tags:
        - auth
      summary: Log in with username and password (and a TOTP code when enabled); returns a short-lived JWT and sets
        the refresh cookie.
      operationId: postAuthLogin
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                totp:
                  type: string
      security: []
      responses:
        "200":
          description: OK
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
        "429":
          description: Too many attempts
  /auth/register:
    post:
      tags:
        - auth
      summary: Create an account, when registration is open.
      operationId: postAuthRegister
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                displayName:
                  type: string
      security: []
      responses:
        "200":
          description: OK
        "400":
          description: Malformed body or parameter
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "409":
          description: "Conflict: already exists, already running, or duplicate"
  /auth/refresh:
    post:
      tags:
        - auth
      summary: Exchange the rotating refresh cookie for a new JWT.
      operationId: postAuthRefresh
      security: []
      responses:
        "200":
          description: >-
            A new access token, the signed-in user, and when the refresh token itself expires.
            The installed app persists `refreshExpiresAt` so it can honour the same expiry offline
            that this server would enforce online -- it cannot derive it, because REFRESH_TTL_DAYS is
            an operator setting and the cookie is httpOnly.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresIn, user, refreshExpiresAt]
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer, description: Access-token lifetime in seconds }
                  user: { type: object, description: The same payload /auth/me returns }
                  refreshExpiresAt:
                    type: integer
                    format: int64
                    description: >-
                      Refresh-token expiry, ms since the epoch. On the stale-rotation race this is the
                      existing row's real expiry, not a fresh one -- rotating nothing must not extend it.
        "401":
          description: Not authenticated
        "403":
          description: The account has been disabled; every session was revoked
  /auth/logout:
    post:
      tags:
        - auth
      summary: End this session and clear its cookies.
      operationId: postAuthLogout
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /auth/logout-all:
    post:
      tags:
        - auth
      summary: Revoke every session of the calling account.
      operationId: postAuthLogoutAll
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /auth/me:
    get:
      tags:
        - auth
      summary: "The calling account: id, username, role, permissions."
      operationId: getAuthMe
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /auth/password:
    post:
      tags:
        - auth
      summary: Change the calling account's password.
      operationId: postAuthPassword
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                current:
                  type: string
                next:
                  type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
  /auth/sessions:
    get:
      tags:
        - auth
      summary: Active sessions of the calling account.
      operationId: getAuthSessions
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /auth/sessions/{id}:
    delete:
      tags:
        - auth
      summary: Revoke one session.
      operationId: deleteAuthSessionsId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "404":
          description: Not found, or not visible to this account
  /auth/totp/setup:
    post:
      tags:
        - auth
      summary: "Start two-factor enrolment: returns the secret and QR payload."
      operationId: postAuthTotpSetup
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /auth/totp/enable:
    post:
      tags:
        - auth
      summary: Confirm two-factor with a first code; returns recovery codes once.
      operationId: postAuthTotpEnable
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
  /auth/totp/disable:
    post:
      tags:
        - auth
      summary: Turn two-factor off (requires a current code).
      operationId: postAuthTotpDisable
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
  /auth/oidc/start:
    get:
      tags:
        - auth
      summary: "Begin single sign-on: redirects to the identity provider."
      operationId: getAuthOidcStart
      security: []
      responses:
        "302":
          description: Redirect
  /auth/oidc/callback:
    get:
      tags:
        - auth
      summary: "Single sign-on return leg: finishes login and redirects into the app."
      operationId: getAuthOidcCallback
      security: []
      responses:
        "302":
          description: Redirect
  /api/libraries:
    get:
      tags:
        - library
      summary: The libraries the caller may see; adult:true marks an 18+ one the client can reveal.
      operationId: getApiLibraries
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/genres:
    get:
      tags:
        - library
      summary: Every genre in the caller's visible library.
      operationId: getApiGenres
      parameters:
        - name: adult
          in: query
          required: false
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/genres/overview:
    get:
      tags:
        - library
      summary: Genres with series counts and cover ids for tiles.
      operationId: getApiGenresOverview
      parameters:
        - name: covers
          in: query
          required: false
          schema:
            type: integer
        - name: adult
          in: query
          required: false
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/trending:
    get:
      tags:
        - library
      summary: What the household is reading most right now.
      operationId: getApiTrending
      parameters:
        - name: adult
          in: query
          required: false
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/leaderboard:
    get:
      tags:
        - library
      summary: Members ranked by reading this period.
      operationId: getApiLeaderboard
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/random:
    get:
      tags:
        - library
      summary: One random visible series id (hero art fallback).
      operationId: getApiRandom
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/foryou:
    get:
      tags:
        - library
      summary: Recommendations built from the caller's history.
      operationId: getApiForyou
      parameters:
        - name: adult
          in: query
          required: false
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/featured:
    get:
      tags:
        - library
      summary: The featured rail.
      operationId: getApiFeatured
      parameters:
        - name: adult
          in: query
          required: false
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/refresh:
    post:
      tags:
        - library
      summary: Ask the server to refresh its cached home data.
      operationId: postApiRefresh
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/home:
    get:
      tags:
        - library
      summary: "Everything the home screen is built from: on-deck books with progress, rails, updates."
      operationId: getApiHome
      parameters:
        - name: adult
          in: query
          required: false
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/series/search:
    post:
      tags:
        - library
      summary: "Search and page the library: the grid, the search page, browse-by-genre and the command palette all
        use this."
      description: "A query, not a mutation: it is a POST only because the filter tree travels in a body, so a
        read-scoped API token may call it (the one non-GET a read token can use)."
      operationId: postApiSeriesSearch
      parameters:
        - name: adult
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                page:
                  type: integer
                size:
                  type: integer
                sort:
                  description: >-
                    `field,dir`. Fields: `updated` (last chapter added), `added` (series created), `title`,
                    `author`, `unread` (your unread count), `favorites` (your starred series first, then by
                    unread -- what "popular" means for a personal library), `random`. The per-user ones need
                    a signed-in caller and fall back to title order without one.
                  type: string
                condition:
                  type: object
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
  /api/series/{id}:
    get:
      tags:
        - library
      summary: One series with its metadata.
      operationId: getApiSeriesId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: >-
            The series. Only the fields added in v0.31.0 are described here; the rest of the shape follows
            Komga's series DTO (id, name, metadata, booksCount, ...).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  sources:
                    type: array
                    description: Where the chapters come from, primary first, then followed sources in the order they were added. Present for every viewer.
                    items:
                      $ref: "#/components/schemas/SeriesSource"
                  scanlatorPrefs:
                    description: >-
                      Admins only. The series' own release preferences, or null when it has none and the
                      server-wide ones apply.
                    oneOf:
                      - $ref: "#/components/schemas/ScanlatorPrefs"
                      - type: "null"
        "401":
          description: Not authenticated
        "404":
          description: Not found, or not visible to this account
  /api/updates:
    get:
      tags:
        - library
      summary: Recently added chapters, newest first.
      operationId: getApiUpdates
      parameters:
        - name: adult
          in: query
          required: false
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/updates/seen:
    post:
      tags:
        - library
      summary: Mark the updates feed as seen.
      operationId: postApiUpdatesSeen
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/series/{id}/color:
    get:
      tags:
        - library
      summary: The series' dominant cover colour for ambient theming.
      operationId: getApiSeriesIdColor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "404":
          description: Not found, or not visible to this account
  /api/series/{id}/similar:
    get:
      tags:
        - library
      summary: Series like this one.
      operationId: getApiSeriesIdSimilar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "404":
          description: Not found, or not visible to this account
  /api/series/{id}/books:
    get:
      tags:
        - library
      summary: The chapters of a series, in reading order, with the caller's progress.
      operationId: getApiSeriesIdBooks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: "{ content: [Book] }; each Book carries the provenance fields described on GET /api/books/{id}."
        "401":
          description: Not authenticated
        "404":
          description: Not found, or not visible to this account
  /api/books/{id}:
    get:
      tags:
        - library
      summary: One chapter with its page count and progress.
      operationId: getApiBooksId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: >-
            The chapter. Only the fields added in v0.31.0 are described here; the rest of the shape follows
            Komga's book DTO (id, seriesId, number, media, metadata, readProgress, ...). The same object is
            what every other route that returns a chapter answers with (the series' chapter list, next,
            the home shelves).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  scanlator:
                    type: [string, "null"]
                    description: >-
                      The group that released the file on disk, as the source showed it (a joint release
                      reads "A & B"). Null for a chapter the scanner found rather than the downloader wrote,
                      which includes everything downloaded before v0.31.0.
                  sourceId:
                    type: [string, "null"]
                    description: The adapter the file was downloaded from; null when the scanner found it.
        "401":
          description: Not authenticated
        "404":
          description: Not found, or not visible to this account
  /api/books/{id}/pages:
    get:
      tags:
        - library
      summary: The page list of a chapter (names and cached dimensions).
      operationId: getApiBooksIdPages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "404":
          description: Not found, or not visible to this account
  /api/books/{id}/pages/{n}/junk:
    put:
      tags:
        - library
      summary: Mark or un-mark one page as a repeated page the reader should skip.
      description: >-
        A person's decision outranks the automatic detection in both directions and is never recomputed
        away. `true` always skips (useful for a one-off advert, which by definition never repeats and so can
        never be detected), `false` never skips, `null` hands the page back to the heuristic.
      operationId: putApiBooksIdPagesNJunk
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: n
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                junk:
                  type: boolean
                  nullable: true
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: Page number is not a page of this chapter
        "401":
          description: Not authenticated
        "404":
          description: No such chapter, or one the caller may not see
  /api/offline/plan:
    get:
      tags:
        - library
      summary: What the client should keep offline for this account.
      operationId: getApiOfflinePlan
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/books/{id}/next:
    get:
      tags:
        - library
      summary: The next and previous chapter of this one.
      operationId: getApiBooksIdNext
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "404":
          description: Not found, or not visible to this account
  /api/books/{id}/progress:
    put:
      tags:
        - library
      summary: Record reading progress. silent:true writes exactly what you say (even unread) and stays out of
        history and streaks; otherwise a write can only move forward.
      operationId: putApiBooksIdProgress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                completed:
                  type: boolean
                silent:
                  type: boolean
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
        "404":
          description: Not found, or not visible to this account
  /api/sources:
    get:
      tags:
        - sources
