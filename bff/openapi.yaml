        `backup`, `mangadex`, `paste` or `tracker`, and `tracker` names the service (`anilist`, `myanimelist`,
        `kitsu`) for a tracker batch, null otherwise; `skippedNovels` (integer: the novels a tracker read
        dropped, 0 for the other origins) and `truncated` (boolean: the intake kept 500 of a longer list, or
        the tracker read hit its cap) are the intake's own answer kept on the row, so a later view of the
        batch still shows them. `stale` means what it means on GET
        /api/admin/import/batches/{id}: the batch reads `resolving` while nobody in this process is resolving
        it (a restart mid-pass), so the list can say "interrupted" rather than "matching" for it. The
        candidate rows are not included — a batch can carry 500 of them; GET /api/admin/import/batches/{id}
        has them. Every admin sees every batch. A batch stays
        listed until the daily sweep removes it: seven days after it last changed once `done`, thirty days for
        one still `resolving`, `review` or `importing` (every review action moves that deadline).
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
    post:
      tags:
        - admin
      summary: Start a reviewable import — parse a backup/MangaDex list/paste, or read a tracker list, and match each title in the background.
      operationId: postApiAdminImportBatches
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Unlike
        POST /api/admin/import, nothing is added yet: each title gets matched against the user's sources in
        the background (GET the batch to watch progress), and only rows accepted via PATCH
        /api/admin/import/candidates/{cid} or left on their auto match are added once
        /api/admin/import/batches/{id}/run is called. One batch resolves at a time server-wide, and the
        guard is taken before the request is parsed, so two simultaneous POSTs start one batch. A row's
        `confidence` is `same_source` only when the backup entry's own Mihon source is installed here (a
        Suwayomi extension) and a hit's extension-relative path equals the url the backup stored — Mihon's
        identity for a manga — else `exact`/`contains`/`fuzzy` from the title alone; a title with no confident
        hit anywhere stays `unresolved`, never the first search result. Answers `{batchId, total, truncated,
        skippedNovels}`.


        The fourth intake, `origin: 'tracker'`, reads the requesting admin's OWN connected AniList /
        MyAnimeList / Kitsu account (the connection GET /api/trackers shows for them; never another member's)
        for the lists named in `statuses` (Reading + Plan to read when omitted). Up to 501 entries are read;
        the batch keeps 500 and reports `truncated` when the read hit the cap. Light novels are dropped and
        counted as `skippedNovels` (a novel resolves to its manga adaptation on every source, and would link
        the novel entry to the manga); both figures are stored on the batch row and come back as
        `skippedNovels` and `truncated` on every batch GET. Entries are deduped by their id on the service
        and by the normalised form of every name they go by. Each row carries `tracker`, `external_id`,
        `alt_titles` (romaji and synonyms, at most three; an abbreviation whose normalised form is shorter
        than five characters -- "AoT", "SnK", "MHA" -- is never one, since such a term contains-matches
        almost any title) and `progress` (chapters read there); the search title is the English one. The
        resolve pass searches the search title on EVERY source first, then the first alt title on every
        source, and so on, so an exact hit for the title on a later source beats a weaker hit for an
        alternate on an earlier one; a row matched under an alternate records it as `matched_via`. A
        tracker row whose title the library already holds (under the search title or any alt; `matched_via`
        names the alt when one did) is LINKED at intake — `series_trackers` for the requesting admin,
        `tracker_progress` set to the entry's `progress` with `pushed_at` NULL — and starts as `decision:
        skip`, `status: already`, counted under the batch's `already`; the row then reads `linked: true` on
        GET. A series that is deleted (`deleted_at`) or merged into another never counts as held, for any
        intake: such a title resolves, and /run puts the same series back. Errors: **404** `not_connected`
        when the admin has no enabled connection to that tracker; **422** `token_expired` when the
        connection's `expires_at` has passed — the service is not called, the connection stays enabled, and
        its `last_error` reads `the access token has expired -- reconnect to resume syncing`, the sentence a
        push leaves; **422** `tracker_rejected` when the service refused the saved token — the connection
        is disabled with the same sentence a rejected progress push leaves on it (422 rather than 401,
        because clients retry a 401 after a session refresh and that retry would read `not_connected`), or,
        without disabling, when the stored token could not be unsealed; **502** `tracker_unavailable` when
        the service did not answer (nothing changed; a 400 or a 403 from the service is this, never a
        disable — only a 401, or AniList's "Invalid token" 400, is a verdict on the token).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dataUrl:
                  type: string
                  description: A .tachibk/.proto.gz backup as a data URL (no multipart plugin; mirrors the art upload).
                mangadexList:
                  type: string
                  description: A public MangaDex list URL or id.
                titles:
                  type: array
                  items:
                    type: string
                  description: Pasted titles, one per entry. Exactly one of dataUrl/mangadexList/titles/origin:'tracker' must be given.
                origin:
                  type: string
                  enum: [tracker]
                  description: Names the tracker intake; `tracker` says which service.
                tracker:
                  type: string
                  enum: [anilist, myanimelist, kitsu]
                  description: Which connected tracker to read the requesting admin's own list from.
                statuses:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: string
                    enum: [reading, plan_to_read, completed, on_hold, dropped]
                  description: Which of the person's lists to bring over. Defaults to reading + plan_to_read.
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: "Bad request: no titles found, none of dataUrl/mangadexList/titles/tracker given, or a tracker intake without `tracker`"
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: "Not found: `not_connected` — no enabled connection to that tracker for the requesting admin"
        "409":
          description: "Conflict: another batch is already resolving"
        "422":
          description: "Unprocessable: the file/list could not be parsed, or a gzipped file inflates past 256 MB (no real backup does); `token_expired` when the connection's token has lapsed (not called, not disabled); `tracker_rejected` when the tracker refused the saved token (the connection is disabled)"
        "502":
          description: "Bad gateway: `tracker_unavailable` — the tracker did not answer; nothing changed"
  /api/admin/import/batches/{id}:
    get:
      tags:
        - admin
      summary: A batch's state and every candidate row.
      operationId: getApiAdminImportBatchesId
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. A batch
        that reads `resolving` while nobody in this process is resolving it (a restart mid-pass) comes back
        with `stale: true` — call /resume. One that reads `importing` while no add loop here is running it
        was stranded by a restart mid-run and is handed back on this call: `review` (the rows never reached
        have no status and are still ready, so /run again imports just those) or `done` when every row had
        been processed and only the final write was lost — persisted, not just reported. A `review` batch a
        run has been through that has nothing left waiting (every remaining row skipped) is closed to `done`
        on this call too, the same rule PATCH .../candidates/{cid} applies after a skip; a batch nothing was
        ever imported through (every title already owned) stays `review`. A malformed id is 404. The batch
        carries `tracker` (the service a tracker batch was read from, else null) and the intake's own
        `skippedNovels` (integer) and `truncated` (boolean), stored on the row so a reload or a later visit
        still shows them. Each item carries, besides
        its match columns, `tracker`, `external_id`, `alt_titles` (string[]), `matched_via` (the alt title
        the match was found under, null when the search title found it), `progress` (chapters read on the
        tracker) and `linked` — true when a `series_trackers` row carries this entry's id on that service,
        i.e. the series was linked at intake (a title already owned) or at /run (an added one); read live,
        not remembered, so a row whose link did not happen never claims it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found
    delete:
      tags:
        - admin
      summary: Discard a batch (and every candidate row, cascading).
      operationId: deleteApiAdminImportBatchesId
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. A resolve
        or add loop still running for the batch stops before its next row (the row in flight finishes; its
        writes then hit nothing), and the one-batch-at-a-time guard is released at once. Nothing is written
        as `cancelled`: the batch is gone. Idempotent for an id that no longer exists; a malformed id is 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: "Not found: the id is not a uuid"
  /api/admin/import/batches/{id}/resume:
    post:
      tags:
        - admin
      summary: Resume matching for a batch left stuck 'resolving' by a server restart.
      operationId: postApiAdminImportBatchesIdResume
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Takes the
        one-batch-at-a-time guard before looking the batch up, the way POST /api/admin/import/batches does,
        so a /resume and a POST at the same instant start one resolve loop and the other answers 409 `busy`.
        Resuming a batch this process is already resolving answers 200 (idempotent).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found
        "409":
          description: "Conflict: not in the resolving state, or another batch is resolving"
  /api/admin/import/batches/{id}/run:
    post:
      tags:
        - admin
      summary: "Import selected: add matched, not-yet-imported rows. Never downloads a chapter."
      operationId: postApiAdminImportBatchesIdRun
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict.
        Adds every eligible row (decision `auto`/`manual`, has a match, not already run) named in
        `candidateIds`, or every eligible row in the batch if `candidateIds` is omitted. A skipped or
        still-unresolved id in `candidateIds` is silently left out rather than erroring the request. Every
        add uses the "nothing yet" path — the series is created and followed, no chapter is fetched — so a
        bulk import is a catalogue move, not a bulk download; chapters arrive through auto-update or a
        manual fetch afterwards. Safe to call more than once on the same batch: a row already imported by an
        earlier call is never re-added, which is how a "second import try" for rows found by hand later
        works. The batch returns to `review` (not `done`) while anything importable is still waiting. The
        state flip to `importing` is one conditional UPDATE, so two simultaneous calls import once and the
        other answers 409 busy. Each row's `status` afterwards is `added`, `already` (the library has the
        title — the same folder, or the same title from another source, which the up-front `in_library`
        check misses when the backup spells it differently) or the add's error code (`no_title`, `no_chapters`,
        `disabled`, `blocked`, `undownloadable`, `disk_full`, `bad_request`, `error`); `already` counts
        under `already`, an error code under `failed`. A tracker row that ends `added` or `already` is
        linked to its tracker entry (`series_trackers`, `linked_by` = the account whose list was read, the
        batch's `user_id` -- batches are shared between admins, and whoever calls this, the link and the
        floor are the owner's; the caller is only in the `import.batch.run` audit row, whose `detail`
        carries `owner`) and the owner's `tracker_progress` for it is set to the entry's `progress` with
        `pushed_at` NULL -- set, not raised: every read of the list replaces the floor with the tracker's
        current number and clears the stamp, so re-reading the list is how a downward correction on the
        tracker reaches this app. A push goes out once the local count exceeds the floor (equal to an
        unstamped floor is skipped quietly; equal to a stamped one, a number this app sent, still pushes);
        the row then reads `linked: true` on GET.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                autoUpdate:
                  type: boolean
                candidateIds:
                  type: array
                  maxItems: 500
                  items:
                    type: string
                    format: uuid
                  description: >-
                    Which candidate rows to import. Omit to import every eligible row in the batch. An entry
                    that is not a uuid, or more than 500 of them, is 400 bad_request (a batch never holds more
                    rows than that).
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: "Bad request: nothing selected is ready to import, or a candidateIds entry is not a uuid"
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found
        "409":
          description: "Conflict: still resolving, or already importing"
  /api/admin/import/candidates/{cid}:
    patch:
      tags:
        - admin
      summary: Accept, override or skip one row of a batch under review.
      operationId: patchApiAdminImportCandidatesCid
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. A
        `manual` pick clears the row's `matched_via` (a hand-picked match was found by nobody's alternate);
        `auto` restores the resolve pass's suggestion and leaves `matched_via` as it is, so an auto → manual
        → auto detour loses the note; `skip` on the last open row of a batch a run has been through closes
        the batch.
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [decision, source, sourceId, title]
                  properties:
                    decision:
                      type: string
                      enum: [manual]
                    source:
                      type: string
                    sourceId:
                      type: string
                    title:
                      type: string
                    coverUrl:
                      type: string
                - type: object
                  required: [decision]
                  properties:
                    decision:
                      type: string
                      enum: [skip]
                - type: object
                  required: [decision]
                  properties:
                    decision:
                      type: string
                      enum: [auto]
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found
        "409":
          description: "Conflict: decision:'auto' requested but the resolve pass found no match for this row"
