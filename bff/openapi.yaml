                    description: When the series' sources were last listed; null for a series never checked.
                  prefs:
                    description: The series' own preferences, or null when it has none.
                    oneOf:
                      - $ref: "#/components/schemas/ScanlatorPrefs"
                      - type: "null"
                  global:
                    $ref: "#/components/schemas/ScanlatorPrefs"
                  effective:
                    type: object
