  /api/admin/series/{id}:
    patch:
      tags:
        - admin
      summary: Change a series' settings (auto-update, its own scanlation-group preferences).
      operationId: patchApiAdminSeriesId
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. The body
        names at least one field and no others; each named field is written on its own, so a body naming
        one leaves the other alone. Answers { ok: true }, with autoUpdate echoed when it was sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                autoUpdate:
                  type: boolean
                  description: Whether the scheduled updater keeps checking this series.
                scanlatorPrefs:
                  description: >-
                    The series' own release preferences, replaced whole; null clears them so the server-wide
                    ones apply again. The priority given here replaces the global list for this series, the
                    blocked list is added to it, and a null patienceDays inherits.
                  oneOf:
                    - $ref: "#/components/schemas/ScanlatorPrefs"
                    - type: "null"
                sourcePrefs:
                  description: >-
                    The series' own source order, which replaces the server-wide one for this series rather
                    than merging with it; null or an empty priority clears it. Same rules as sourcePrefs on
                    PATCH /api/admin/settings.
                  oneOf:
                    - $ref: "#/components/schemas/SourceOrder"
                    - type: "null"
                borrowNames:
                  description: >-
                    Chapter-name borrowing for this series (since v0.47.0, #85): true or false overrides the
                    server setting, null follows it. Switching it on asks for names now; switching it off
                    clears the ones borrowed for this series.
                  type: [boolean, "null"]
                lang:
                  description: >-
                    Since v0.52.0. The language the series is in, as a BCP-47 code (400 `bad_lang` for anything
                    that is not one language); null to infer it again from its main source. 409 `edition_lang` for
                    null on a language edition, which always states its language, and `edition_exists` for a
                    language another edition of its work holds. Sources in another language are never followed
                    for it automatically.
                  type: [string, "null"]
                chapterFloor:
                  description: >-
                    Since v0.52.0, "Mark caught up": `caught_up` sets the series' chapter floor just above the
                    newest chapter its sources list or the library holds (max + 0.001, as a `none` add floors), so
                    the back catalogue is not fetched and every later release is; 409 `nothing_listed` when there
                    is no chapter to be above. A number, or null for no floor, sets it as given: the answer's
                    `chapterFloor.previous` is what an Undo sends back.
                  oneOf:
                    - type: string
                      enum: [caught_up]
                    - type: number
                      minimum: 0
                    - type: "null"
                hideNotices:
                  description: >-
                    Notice chapters for this series: true hides every chapter numbered with a fraction that has 3
                    pages or fewer (100.5, as `hideNoticeTypes` describes) everywhere and does not download one its
                    sources list as that short, false shows them, null follows its type's switch (`hideNoticeTypes`
                    on PATCH /api/admin/settings). Applied on the next request; nothing is deleted.
                  type: [boolean, "null"]
      security:
        - bearer: []
      responses:
        "200":
          description: >-
            { ok: true }, with `autoUpdate` echoed when it was sent, `lang` when it was, and for `chapterFloor`
            `{floor, previous}`: the floor now and the one it replaced. With `hideNotices`: `hideNotices` as stored,
            `hideNoticesEffective` (whether its notice chapters are hidden now) and `hiddenNotices` (how many).
        "400":
          description: Malformed body, an unknown field, or a body naming nothing to change
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
        "409":
          description: "`edition_lang`, `edition_exists` (see `lang`) or `nothing_listed` (see `chapterFloor`)"
    delete:
      tags:
        - admin
      summary: Soft-delete a series (files stay; restorable).
      operationId: deleteApiAdminSeriesId
      description: Requires an admin account and a token carrying the admin scope. Scopes only ever restrict.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
  /api/admin/series/bulk/hide:
    post:
