      description: >-
        Since v0.47.0 (#82). The account that started the job may, and any admin; anyone else gets 403 --
        since v0.49.0 only for a job GET /api/sources/jobs hands them, and 404 for one it does not, exactly as
        for no job at all, so the answer never says that a download is running for a title they cannot see.
        The job checks between chapters, so a file is never left half-written: what already landed stays,
        and the card ends `done` with `cancelled: true` and a `reason` saying how far it got. A re-fetch
