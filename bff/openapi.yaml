  /api/admin/series/{id}/merge:
    post:
      tags:
        - admin
      summary: Merge this series into another one (the body names the survivor).
      operationId: postApiAdminSeriesIdMerge
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Merges
        {id} INTO the series named by `into`: every chapter and progress row moves to the survivor, nothing is
        de-duplicated and no chapter row is deleted, so no reading progress can be lost; the absorbed row
        stays, pointed at the survivor, and a merge is one-way (400 `merged` for a source or target that is
        itself merged, 400 `deleted` for a hidden one, 400 `same_series` for itself). Since v0.37.0 merging is
        transitive: anything the absorbed series had itself absorbed earlier is re-pointed at the new
        survivor in the same transaction, so a title folded in two merges ago still files its folder's
        chapters under the final survivor on the scan and reads "already in your library" in the batch
        importer instead of being re-added via another source. Since v0.52.0 two language editions of one work
        are refused with 409 `same_work` (their chapters are two languages); the absorbed row leaves its work, and
        a work left with one edition dissolves. Since v0.55.0 the absorbed series' main source becomes a source the
        survivor follows when it still works (usable, or only cooling down), is in the survivor's language, is not
        the survivor's own main source, and fits under the follower cap (two), unless the survivor is numbered by
        posting order; the answer's `carried` names it, or is null.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
