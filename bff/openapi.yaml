  /api/admin/series/{id}/chapters/delete:
    post:
      tags:
        - admin
      summary: Delete chosen chapters' files from the download directory, keeping their rows as tombstones.
      operationId: postApiAdminSeriesIdChaptersDelete
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Touches
        DL_ROOT only: a chapter the scanner found in the read library is skipped (`not_owned`), on the same
        footing as the read-chapter cleanup, and so is one somebody has a bookmark in (`bookmarked`) -- a
        bookmark names a page inside the file. A chapter whose file AND folder are missing is skipped
        (`unlink_failed`) rather than marked: that is the download volume not being mounted. The row survives
        with `pruned` set so reading progress and the updater's have-set do; the cover moves to the lowest
        live chapter. No typed confirmation -- the client confirms with the count.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookIds]
              properties:
                bookIds:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, applied, bytes, skipped]
                properties:
                  ok:
                    type: boolean
                  applied:
                    type: integer
                    description: Chapters whose file is gone and whose row is now a tombstone.
                  bytes:
                    type: integer
                  skipped:
                    type: array
                    items:
                      type: object
                      required: [id, reason]
                      properties:
                        id:
                          type: string
                        reason:
                          type: string
                          enum: [not_found, not_owned, already_pruned, bookmarked, outside_root, unlink_failed]
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
        "409":
          description: "`refused`: the download directory is not writable; `message` and `fix` say what to do"
  /api/admin/series/{id}/chapters/refetch:
    post:
      tags:
        - admin
      summary: Download chosen chapters again, as the copy the release rules choose now, onto the same rows.
      operationId: postApiAdminSeriesIdChaptersRefetch
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Eligible
        only for a file this server downloaded (`not_owned` otherwise) at exactly the path the downloader
        writes, `Chapter <n>.cbz` (`not_ours` otherwise): only that path lands back on the same row, which is
        what keeps reading progress attached. The listing is refreshed first (a check with no downloads),
        so the copy is the one the release rules choose now; a source that does not answer leaves the last
        listing standing, and a listing row from a source the series no longer follows is `source_unavailable`.
        The old file is set aside until the new one lands and put back if the download fails. A chapter the
        cleanup deleted (`pruned`) is eligible: this is how it comes back.
        `picks` replaces a row's file with ONE named copy (`{bookId, source, sourceId}` from GET
        /api/series/{id}/versions) instead of the rules' choice: the row's number selects the listing row,
        the pick the copy in it (`not_listed` when none matches). A pick ignores the group rules including
        the blocklist -- an explicit choice. At least one of `bookIds` / `picks`, at most 300 combined; a row
        named in both is fetched as its pick, and a second pick for the same row is skipped as `duplicate`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookIds:
                  type: array
                  maxItems: 300
                  items:
                    type: string
                picks:
                  type: array
                  maxItems: 300
                  items:
                    type: object
                    required: [bookId, source, sourceId]
                    properties:
                      bookId: { type: string }
                      source: { type: string, minLength: 1, maxLength: 200 }
                      sourceId: { type: string, minLength: 1, maxLength: 200 }
      security:
        - bearer: []
      responses:
        "200":
          description: Started. Progress is on GET /api/sources/jobs under `folder`.
          content:
            application/json:
              schema:
                type: object
                required: [ok, started, folder, total, skipped]
                properties:
                  ok:
                    type: boolean
                  started:
                    type: boolean
                  folder:
                    type: string
                  total:
                    type: integer
                  skipped:
                    type: array
                    items:
                      type: object
                      required: [id, reason]
                      properties:
                        id:
                          type: string
                        reason:
                          type: string
                          enum: [not_found, not_owned, not_ours, not_listed, blocked_group, source_unavailable, cooldown, duplicate]
                        source:
                          type: string
                          description: "On a `duplicate` entry: the adapter of the pick that was ignored."
                        sourceId:
                          type: string
                          description: "On a `duplicate` entry: the chapter id of the pick that was ignored."
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
        "409":
          description: "`nothing_to_fetch` (every chapter was skipped; `skipped` says why), `busy` (a download for the series is running), or `refused` (the download directory is not writable)"
