        "502":
          description: "`unreachable`: the extension server did not answer; or `extension_error`: it answered with the extension's own exception, whose first line is in `message`. Since v0.49.1 every refusal of this route and its POST carries `messageSaid` (Said, `pref.*`; the exception's line is `params.error`) beside `message`."
