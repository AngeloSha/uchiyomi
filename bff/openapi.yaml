      tags:
        - images
      summary: "The automatic banner made from a series' own pages (since v0.51.0)."
      operationId: getImgSeriesIdHero
      description: >-
        For a series with no banner of its own (AniList's or an admin's): four crops of its pages, taken from
        different chapters, side by side. Gated as the series' cover is, then 404 for a series that may not have one
        -- a banner of its own, 18+ by any rule (its rating or an admin's, an 18+ library, one of the admin's 18+
        genres, an adult source), its AniList lookup not done yet, or a last try that made none (left alone for a
        week) -- and 404 when a try made now makes none, so a client keeps its usual art. Made in the background (a
        paced daily pass, and soon after the series' backdrop is asked for), by Shuffle, or here when the image cache
        misses, and kept in that cache; one is made at a time server-wide, under a time limit. The series payload's
        `autoHero` says when to ask -- once it is made -- with the seed for `v`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: ar
          in: query
          required: false
          description: "`wide` (1920x640, four side by side; the default) or `tall` (1080x1440, two by two, for a portrait hero)."
          schema:
            type: string
            enum: [wide, tall]
        - name: v
          in: query
          required: false
          description: The seed from `autoHero`, as a cache-buster only; the stored seed's banner is served.
          schema:
            type: integer
      security:
        - imgCookie: []
        - bearer: []
        - opdsBasic: []
      responses:
        "200":
          description: The banner.
          content:
            image/jpeg: {}
        "401":
