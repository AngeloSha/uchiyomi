      operationId: postApiSeriesSearch
      parameters:
        - name: adult
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                page:
                  type: integer
                size:
                  type: integer
                sort:
                  type: string
                condition:
                  type: object
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
  /api/series/{id}:
