          description: "Forbidden: token scope, account permission or age limit"
  /api/admin/import/batches:
    get:
      tags:
        - admin
      summary: Every import batch, newest first, with its counts — the "Open imports" list.
      operationId: getApiAdminImportBatches
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Up to 50
        batches in every state, newest first, as `{content: [{id, origin, tracker, state, total, resolved,
        added, already, failed, skippedNovels, truncated, created_at, updated_at, stale}]}` — `origin` is
        `backup`, `mangadex`, `paste` or `tracker`, and `tracker` names the service (`anilist`, `myanimelist`,
        `kitsu`) for a tracker batch, null otherwise; `skippedNovels` (integer: the novels a tracker read
        dropped, 0 for the other origins) and `truncated` (boolean: the intake kept the first 500 titles not
        already in the library and more remained -- since v0.51.0 the titles already owned ride along as
        skipped rows and do not count -- or the tracker read hit its cap) are the intake's own answer kept on
        the row, so a later view of the
        batch still shows them. `stale` means what it means on GET
        /api/admin/import/batches/{id}: the batch reads `resolving` while nobody in this process is resolving
        it (a restart mid-pass), so the list can say "interrupted" rather than "matching" for it. The
        candidate rows are not included — a batch can carry 500 of them; GET /api/admin/import/batches/{id}
        has them. Every admin sees every batch. A batch stays
        listed until the daily sweep removes it: seven days after it last changed once `done`, thirty days for
        one still `resolving`, `review` or `importing` (every review action moves that deadline).
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
    post:
      tags:
        - admin
      summary: Start a reviewable import — parse a backup/MangaDex list/paste, or read a tracker list, and match each title in the background.
      operationId: postApiAdminImportBatches
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Unlike
        POST /api/admin/import, nothing is added yet: each title gets matched against the user's sources in
        the background (GET the batch to watch progress), and only rows accepted via PATCH
        /api/admin/import/candidates/{cid} or left on their auto match are added once
        /api/admin/import/batches/{id}/run is called. One batch resolves at a time server-wide, and the
        guard is taken before the request is parsed, so two simultaneous POSTs start one batch. A row's
        `confidence` is `same_source` only when the backup entry's own Mihon source is installed here (a
        Suwayomi extension) and a hit's extension-relative path equals the url the backup stored — Mihon's
        identity for a manga — else `exact`/`contains`/`fuzzy` from the title alone; a title with no confident
        hit anywhere stays `unresolved`, never the first search result. A batch searches at most 500 titles:
        since v0.51.0 the titles the library already holds are kept as skipped rows and do not count toward
        them, so `total` can be more than 500, and `truncated` says more titles not owned remained, which
        importing the same list again picks up once these are in. Answers `{batchId, total, truncated,
        skippedNovels}`.


        The fourth intake, `origin: 'tracker'`, reads the requesting admin's OWN connected AniList /
        MyAnimeList / Kitsu account (the connection GET /api/trackers shows for them; never another member's)
        for the lists named in `statuses` (Reading + Plan to read when omitted). Up to 501 entries are read;
        the batch keeps 500 and reports `truncated` when the read hit the cap. Light novels are dropped and
        counted as `skippedNovels` (a novel resolves to its manga adaptation on every source, and would link
        the novel entry to the manga); both figures are stored on the batch row and come back as
        `skippedNovels` and `truncated` on every batch GET. Entries are deduped by their id on the service
        and by the normalised form of every name they go by. Each row carries `tracker`, `external_id`,
        `alt_titles` (romaji and synonyms, at most three; an abbreviation whose normalised form is shorter
        than five characters -- "AoT", "SnK", "MHA" -- is never one, since such a term contains-matches
        almost any title) and `progress` (chapters read there); the search title is the English one. The
        resolve pass searches the search title on EVERY source first, then the first alt title on every
        source, and so on, so an exact hit for the title on a later source beats a weaker hit for an
        alternate on an earlier one; a row matched under an alternate records it as `matched_via`. A
        tracker row whose title the library already holds (under the search title or any alt; `matched_via`
        names the alt when one did) is LINKED at intake — `series_trackers` for the requesting admin,
        `tracker_progress` set to the entry's `progress` with `pushed_at` NULL — and starts as `decision:
        skip`, `status: already`, counted under the batch's `already`; the row then reads `linked: true` on
        GET. A series that is deleted (`deleted_at`) or merged into another never counts as held, for any
        intake: such a title resolves, and /run puts the same series back. Errors: **404** `not_connected`
        when the admin has no enabled connection to that tracker; **422** `token_expired` when the
        connection's `expires_at` has passed — the service is not called, the connection stays enabled, and
        its `last_error` reads `the access token has expired -- reconnect to resume syncing`, the sentence a
        push leaves; **422** `tracker_rejected` when the service refused the saved token — the connection
        is disabled with the same sentence a rejected progress push leaves on it (422 rather than 401,
        because clients retry a 401 after a session refresh and that retry would read `not_connected`), or,
        without disabling, when the stored token could not be unsealed; **502** `tracker_unavailable` when
        the service did not answer (nothing changed; a 400 or a 403 from the service is this, never a
        disable — only a 401, or AniList's "Invalid token" 400, is a verdict on the token).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dataUrl:
                  type: string
                  description: A .tachibk/.proto.gz backup as a data URL (no multipart plugin; mirrors the art upload).
                mangadexList:
                  type: string
                  description: A public MangaDex list URL or id.
                titles:
                  type: array
                  items:
                    type: string
                  description: Pasted titles, one per entry. Exactly one of dataUrl/mangadexList/titles/origin:'tracker' must be given.
                origin:
                  type: string
                  enum: [tracker]
                  description: Names the tracker intake; `tracker` says which service.
                tracker:
                  type: string
                  enum: [anilist, myanimelist, kitsu]
                  description: Which connected tracker to read the requesting admin's own list from.
                statuses:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: string
                    enum: [reading, plan_to_read, completed, on_hold, dropped]
                  description: Which of the person's lists to bring over. Defaults to reading + plan_to_read.
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: "Bad request: no titles found, none of dataUrl/mangadexList/titles/tracker given, or a tracker intake without `tracker`"
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: "Not found: `not_connected` — no enabled connection to that tracker for the requesting admin"
        "409":
          description: "Conflict: another batch is already resolving"
        "422":
          description: "Unprocessable: the file/list could not be parsed, or a gzipped file inflates past 256 MB (no real backup does); `token_expired` when the connection's token has lapsed (not called, not disabled); `tracker_rejected` when the tracker refused the saved token (the connection is disabled)"
        "502":
          description: "Bad gateway: `tracker_unavailable` — the tracker did not answer; nothing changed"
  /api/admin/import/batches/{id}:
    get:
      tags:
        - admin
      summary: A batch's state and every candidate row.
      operationId: getApiAdminImportBatchesId
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. A batch
        that reads `resolving` while nobody in this process is resolving it (a restart mid-pass) comes back
        with `stale: true` — call /resume. One that reads `importing` while no add loop here is running it
        was stranded by a restart mid-run and is handed back on this call: `review` (the rows never reached
        have no status and are still ready, so /run again imports just those) or `done` when every row had
        been processed and only the final write was lost — persisted, not just reported. A `review` batch a
        run has been through that has nothing left waiting (every remaining row skipped) is closed to `done`
        on this call too, the same rule PATCH .../candidates/{cid} applies after a skip; a batch nothing was
        ever imported through (every title already owned) stays `review`. A malformed id is 404. The batch
        carries `tracker` (the service a tracker batch was read from, else null) and the intake's own
        `skippedNovels` (integer) and `truncated` (boolean), stored on the row so a reload or a later visit
        still shows them. Each item carries, besides
        its match columns, `tracker`, `external_id`, `alt_titles` (string[]), `matched_via` (the alt title
        the match was found under, null when the search title found it), `progress` (chapters read on the
        tracker) and `linked` — true when a `series_trackers` row carries this entry's id on that service,
        i.e. the series was linked at intake (a title already owned) or at /run (an added one); read live,
        not remembered, so a row whose link did not happen never claims it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found
    delete:
      tags:
        - admin
      summary: Discard a batch (and every candidate row, cascading).
      operationId: deleteApiAdminImportBatchesId
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. A resolve
        or add loop still running for the batch stops before its next row (the row in flight finishes; its
        writes then hit nothing), and the one-batch-at-a-time guard is released at once. Nothing is written
        as `cancelled`: the batch is gone. Idempotent for an id that no longer exists; a malformed id is 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: "Not found: the id is not a uuid"
  /api/admin/import/batches/{id}/resume:
    post:
      tags:
        - admin
      summary: Resume matching for a batch left stuck 'resolving' by a server restart.
      operationId: postApiAdminImportBatchesIdResume
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Takes the
        one-batch-at-a-time guard before looking the batch up, the way POST /api/admin/import/batches does,
        so a /resume and a POST at the same instant start one resolve loop and the other answers 409 `busy`.
        Resuming a batch this process is already resolving answers 200 (idempotent).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found
        "409":
          description: "Conflict: not in the resolving state, or another batch is resolving"
  /api/admin/import/batches/{id}/run:
    post:
      tags:
        - admin
      summary: "Import selected: add matched, not-yet-imported rows. Never downloads a chapter."
      operationId: postApiAdminImportBatchesIdRun
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict.
        Adds every eligible row (decision `auto`/`manual`, has a match, not already run) named in
        `candidateIds`, or every eligible row in the batch if `candidateIds` is omitted. A skipped or
        still-unresolved id in `candidateIds` is silently left out rather than erroring the request. Every
        add uses the "nothing yet" path — the series is created and followed, no chapter is fetched — so a
        bulk import is a catalogue move, not a bulk download; chapters arrive through auto-update or a
        manual fetch afterwards. Safe to call more than once on the same batch: a row already imported by an
        earlier call is never re-added, which is how a "second import try" for rows found by hand later
        works. The batch returns to `review` (not `done`) while anything importable is still waiting. The
        state flip to `importing` is one conditional UPDATE, so two simultaneous calls import once and the
        other answers 409 busy. Each row's `status` afterwards is `added`, `already` (the library has the
        title — the same folder, or the same title from another source, which the up-front `in_library`
        check misses when the backup spells it differently) or the add's error code (`no_title`, `no_chapters`,
        `disabled`, `blocked`, `undownloadable`, `disk_full`, `bad_request`, `error`); `already` counts
        under `already`, an error code under `failed`. A tracker row that ends `added` or `already` is
        linked to its tracker entry (`series_trackers`, `linked_by` = the account whose list was read, the
        batch's `user_id` -- batches are shared between admins, and whoever calls this, the link and the
        floor are the owner's; the caller is only in the `import.batch.run` audit row, whose `detail`
        carries `owner`) and the owner's `tracker_progress` for it is set to the entry's `progress` with
        `pushed_at` NULL -- set, not raised: every read of the list replaces the floor with the tracker's
        current number and clears the stamp, so re-reading the list is how a downward correction on the
        tracker reaches this app. A push goes out once the local count exceeds the floor (equal to an
        unstamped floor is skipped quietly; equal to a stamped one, a number this app sent, still pushes);
        the row then reads `linked: true` on GET.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                autoUpdate:
                  type: boolean
                candidateIds:
                  type: array
                  maxItems: 500
                  items:
                    type: string
                    format: uuid
                  description: >-
                    Which candidate rows to import. Omit to import every eligible row in the batch. An entry
                    that is not a uuid, or more than 500 of them, is 400 bad_request (a batch never holds more
                    rows than that).
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: "Bad request: nothing selected is ready to import, or a candidateIds entry is not a uuid"
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found
        "409":
          description: "Conflict: still resolving, or already importing"
  /api/admin/import/candidates/{cid}:
    patch:
      tags:
        - admin
      summary: Accept, override or skip one row of a batch under review.
      operationId: patchApiAdminImportCandidatesCid
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. A
        `manual` pick clears the row's `matched_via` (a hand-picked match was found by nobody's alternate);
        `auto` restores the resolve pass's suggestion and leaves `matched_via` as it is, so an auto → manual
        → auto detour loses the note; `skip` on the last open row of a batch a run has been through closes
        the batch.
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [decision, source, sourceId, title]
                  properties:
                    decision:
                      type: string
                      enum: [manual]
                    source:
                      type: string
                    sourceId:
                      type: string
                    title:
                      type: string
                    coverUrl:
                      type: string
                - type: object
                  required: [decision]
                  properties:
                    decision:
                      type: string
                      enum: [skip]
                - type: object
                  required: [decision]
                  properties:
                    decision:
                      type: string
                      enum: [auto]
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found
        "409":
          description: "Conflict: decision:'auto' requested but the resolve pass found no match for this row"
  /api/admin/sources:
    get:
      tags:
        - admin
      summary: Every source with its stored health, cooldown, the last live verdict (`live`), its open, confirmed
        failures per stage (`failing`; since v0.55.1 never a rate limit, which is a cooldown) and one line per stage
        (`evidence`); `testMs` is how long one Test may take.
      operationId: getApiAdminSources
      description: Requires an admin account and a token carrying the admin scope. Scopes only ever restrict.
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/admin/sources/check:
    get:
      tags:
        - admin
      summary: "Where the current or last source check is: {running, by, startedAt, finishedAt, total, done, current,
        result, error}."
      operationId: getApiAdminSourcesCheck
      description: Requires an admin account and a token carrying the admin scope. Scopes only ever restrict.
        `result` is the finished sweep's answer (verdicts, needsAttention, inconclusive, notified), kept in memory
        until the next run starts. Since v0.49.1 a verdict with a `fix` carries `fixSaid` (Said, a `fix.*` code) beside
        it; its `reason` is its `code`'s sentence.
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
    post:
      tags:
        - admin
      summary: "Start the source watchdog now, in the background: probe and smoke-test every source, follow verified
        moves. Answers 202 with the progress; 409 while running."
      operationId: postApiAdminSourcesCheck
      description: Requires an admin account and a token carrying the admin scope. Scopes only ever restrict.
        Read the progress and the result with GET on the same path. Each verdict carries state (pass, fail,
        inconclusive), stage and kind; needsAttention is every confirmed live failure except a rate limit, plus
        moved sites, and admins are pushed once per new or changed failure.
      security:
        - bearer: []
      responses:
        "202":
          description: Started
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "409":
          description: "Conflict: already exists, already running, or duplicate"
  /api/admin/sources/find:
    get:
      tags:
        - admin
      summary: "Find other sources: whether a run is going, the running (or else the newest) run in full, and the kept runs (since v0.49.1)."
      operationId: getApiAdminSourcesFind
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. {running, run,
        recent}: `run` is the running run, else the newest one, with every series' result; `recent` the kept runs
        (the newest 20), newest first, without results. A run still `running` after a restart reads `interrupted`,
        with every series it never reached in `results` as `not_tried`.
        A series the viewer may not list (the 18+ hide, above all) keeps its entry in `results` without its
        `title`, and is left out of `current`. Since v0.52.0 `?runId=` reads that kept run in full as `run` instead
        (an earlier search reopened -- a review-first run's matches can still be decided), and answers 404
        `not_found` when no kept run has that id.
      parameters:
        - name: runId
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
      security:
        - bearer: []
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                type: object
                required: [running, run, recent]
                properties:
                  running: { type: boolean }
                  run:
                    oneOf:
                      - $ref: "#/components/schemas/FindRun"
                      - type: "null"
                  recent:
                    type: array
                    items:
                      $ref: "#/components/schemas/FindRunSummary"
        "400":
          description: "`bad_request`: `runId` is empty or longer than 64 characters."
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: "`not_found` (since v0.52.0): no kept run has the `runId` asked for."
    post:
      tags:
        - admin
      summary: "Find other sources: search other sources for many series at once, and follow the ones that are them, in the background (since v0.49.1)."
      operationId: postApiAdminSourcesFind
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Body
        `{seriesIds}` (the series named, up to 500, in the order given; a hidden, merged or unknown id is dropped) or
        `{sourceId}` (every series whose MAIN source is that id -- the "this source is down" case Health's
        `find_sources` action sends; the series that follow nothing first). One run at a time, in the background:
        1.5 s between the series that searched, waiting while a sweep, a library repair or the daily source check
        runs, stopping at once on POST .../find/stop, Cancel on its card, or a shutdown. Per series: skipped when
        numbered by posting order or already following two sources; otherwise searched on the sources the series
        may reach (an adult source only for an adult series) in scan order -- never its main source, never one it
        already follows, never one disabled or cooling down (read per series) -- under its title and up to three of
        its other names (an other name matched exactly), stopping once its free follower slots are filled or three
        sources carried the title, within a wall of 90 s. Each candidate is judged as the add's auto-follow judges
        one (title, then the numbering both ways unless an exact main title on ten or more numbers) and followed
        under the follower cap, with this admin as its author. The searches report nothing to source health: a
        source that fails one is neither put in a cooldown nor marked failing. When the run ends, every series that
        gained a source gets a listing refresh, 1.5 s apart, in the background (nothing is downloaded: the sweep
        takes the new chapters from there), and the Health summary is refreshed. Audited as `source.find` {runId,
        scope, status, total, done, followed, series} when it ends, and each follow as `series.follow_source` with
        `via: find_sources`. While it runs, GET /api/sources/jobs carries its card (kind `find_sources`) to admins.
        The idea is @TIGamingTV's (PR #119).
        `review: true` (since v0.51.0, #132, @TIGamingTV's idea from PR #133): review first -- the same run, which
        follows nothing and keeps each series' candidates as `proposals` in its result (POST
        .../find/{runId}/follow or .../dismiss decides each); audited with `review` and `proposed` (series with any).
        `mode: replace` (since v0.54.0, with `sourceId` only): Replace -- move every series of that source off it, the
        series that follow other sources first. Per series: its best working follower (usable, then cooling down;
        in its language and the admin's reach; ranked by how lately it answered, how much of the series it lists, the
        source order, how far ahead it is, the follow order) becomes its main source at once, with no search and no
        pacing (as POST /api/admin/series/{id}/main-source does, the replaced source dropped from it); a series with
        none is searched for as above -- its dead followers not counting against the cap, and dropped only as far as a
        follow needs the room -- and the first source it follows becomes its main source. Since v0.55.1 that search
        asks only a source that can update the series (standing usable or cooling), and the first source followed
        that can still update it is promoted (none can: the series stays, `why: no_answer`); a Replace run Fix
        everything starts never promotes onto, nor searches, a source that run is replacing too (such a follower is
        `skipped` as `failing`). A series numbered by posting order, waiting for a renumber, moved off the source,
        or with a run inside it for 30 s is left alone and says so. `turnOff: true` (Replace only, never with `review`): when the run ends done with no series left
        on the source, it is switched off and dropped from every series' followers with their listing rows (audited
        `source.retire`). Review first proposes instead: POST .../find/{runId}/promote applies one. Each switch is
        audited as `series.main_source` with `via: replace` and the run's id; `source.find` adds `mode`, `promoted`,
        `left` and `turnedOff`. Find and Replace share the one run at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  properties:
                    seriesIds: { type: array, maxItems: 500, items: { type: string } }
                    review: { type: boolean }
                - type: object
                  additionalProperties: false
                  required: [sourceId]
                  properties:
                    sourceId: { type: string }
                    review: { type: boolean }
                    mode: { type: string, enum: [follow, replace], description: "Since v0.54.0: `replace` moves every series of the source off it." }
                    turnOff: { type: boolean, description: "Since v0.54.0, Replace only and never with review: switch the source off once no series is left on it." }
      security:
        - bearer: []
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema:
                type: object
                required: [runId, total]
                properties:
                  runId: { type: string, format: uuid }
                  total: { type: integer, minimum: 1, description: The series it will ask about. }
        "400":
          description: "`bad_request` (a malformed body, both scopes at once, Replace without `sourceId`, or `turnOff` outside Replace or with `review`) or `empty_scope` (nothing named is a series this admin may see)"
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "409":
          description: "`busy`: a run is already going; `runId` names it. Since v0.55.0 also `autofix_running`: Health's Fix everything is running, and finds and replaces sources itself."
  /api/admin/sources/find/stop:
    post:
      tags:
        - admin
      summary: "Stop the running Find other sources run at once (since v0.49.1)."
      operationId: postApiAdminSourcesFindStop
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. The series in
        flight keeps what it already followed and is otherwise `not_tried`, as is every series not reached; the run
        ends `stopped`. `stopped` is false when no run was going. Audited as `source.find.stop`.
      security:
        - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [stopped]
                properties:
                  stopped: { type: boolean }
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/admin/sources/find/{runId}/follow:
    post:
      tags:
        - admin
      summary: "Follow one proposal of a review-first Find other sources run (since v0.51.0)."
      operationId: postApiAdminSourcesFindRunIdFollow
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Body {seriesId,
        sourceId}; what is followed (the source's series id, its title, the coverage) is the run's own record, never
        the request's. Checked again first: the series is one this admin may see and not numbered by posting order,
        the source is loaded, switched on, not the series' main source and one it may reach (an adult source only
        for an adult series), and the series does not follow that source already (a stale proposal never re-points
        one). Then written as every follow is, under the follower cap, with this admin as its author; the proposal
        reads `followed` and the series' `followed` gains it, and its listing is refreshed in the background.
        Audited as `series.follow_source` with `via: find_review`, the run's id and the proposal's `verdict`.
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [seriesId, sourceId]
              properties:
                seriesId: { type: string }
                sourceId: { type: string }
      security:
        - bearer: []
      responses:
        "200":
          description: The series' result as it now reads.
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/FindResult"
        "400":
          description: "`bad_request`: a malformed body"
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: "`not_found`: no such run, proposal or series, or a series this admin may not see"
        "409":
          description: "`decided` (with `state`): followed or dismissed already; `posting_order`; `source_unavailable`; `language_differs` (since v0.52.0: the source is in another language than the series, with `edition: {of, lang}`, the add route's edition to add instead, plus `existing: {id, lang}` when the work already holds an edition that may follow the source -- the follow belongs there); `already_followed`; `full` (the series follows two other sources)"
  /api/admin/sources/find/{runId}/promote:
    post:
      tags:
        - admin
      summary: "Make one proposal of a Replace review the series' main source (since v0.54.0)."
      operationId: postApiAdminSourcesFindRunIdPromote
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Body {seriesId,
        sourceId}; what is promoted is the run's own record. A follower's proposal is switched to as POST
        /api/admin/series/{id}/main-source switches (the replaced source dropped); a search's is checked again as a
        follow is, followed under the cap -- dead followers making room -- and then switched to. The proposal reads
        `promoted`, and the series' result carries `promoted` (and, for a search's, `followed` gains it). Audited as
        `series.main_source` with `via: review` (and the follow as `series.follow_source` with `via: replace_review`).
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [seriesId, sourceId]
              properties:
                seriesId: { type: string }
                sourceId: { type: string }
      security:
        - bearer: []
      responses:
        "200":
          description: The series' result as it now reads.
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/FindResult"
        "400":
          description: "`bad_request`: a malformed body"
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: "`not_found`: no such Replace review, proposal or series, or a series this admin may not see"
        "409":
          description: "`decided` (with `state`); a follow's refusals: `posting_order`, `source_unavailable`, `language_differs` (with `edition`), `full`; a switch's: `moved` (the series is no longer on the replaced source), `busy`, `renumber_pending`, `not_followed`, `is_main`. With `messageSaid` (Said, as the main-source route's) where the refusal has a code."
  /api/admin/sources/{id}/replace-preview:
    get:
      tags:
        - admin
      summary: "What a Replace run over this source would do, before it starts (since v0.54.0)."
      operationId: getApiAdminSourcesIdReplacePreview
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. The numbers the
        Replace dialog says before Start, counted as the run decides them: `main` (the series whose main source it
        is), `withBackup` (of those, the ones a working follower takes over at once), `toSearch` (the ones it searches
        for), `postingOrder` (numbered by posting order: left alone), and `busy` (a Find or Replace run is going, and
        Start would answer 409).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      security:
        - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [main, withBackup, toSearch, postingOrder, busy]
                properties:
                  main: { type: integer, minimum: 0 }
                  withBackup: { type: integer, minimum: 0 }
                  toSearch: { type: integer, minimum: 0 }
                  postingOrder: { type: integer, minimum: 0 }
                  busy: { type: boolean }
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/admin/sources/find/{runId}/dismiss:
    post:
      tags:
        - admin
      summary: "Dismiss one proposal of a review-first Find other sources run (since v0.51.0)."
      operationId: postApiAdminSourcesFindRunIdDismiss
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Body {seriesId,
        sourceId}. The proposal reads `dismissed`, for good: a follow of it is then refused as `decided`.
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [seriesId, sourceId]
              properties:
                seriesId: { type: string }
                sourceId: { type: string }
      security:
        - bearer: []
      responses:
        "200":
          description: The series' result as it now reads.
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/FindResult"
        "400":
          description: "`bad_request`: a malformed body"
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: "`not_found`: no such run, proposal or series, or a series this admin may not see"
        "409":
          description: "`decided` (with `state`): followed or dismissed already"
  /api/admin/sources/overview:
    get:
      tags:
        - admin
      summary: "Every source the server knows, of every kind, in one answer (since v0.54.0)."
      operationId: getApiAdminSourcesOverview
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. The one Sources
        section's list: every source loaded, every extension source the engine ever registered (switched on, off, or not
        loaded now), every source a series still names, and every source Health lists. Each row's `state`, `stage`,
        `cooldown` and `offBy` are Source health's own (GET /api/admin/health, check `sources`); `ok` when Health has
        nothing to say about it. `standing` is lib/sourceStanding.ts's (SeriesSource.standing). `main` counts the series
        whose main source it is, `followed` the series that follow it without it being their main source, and
        `withBackup`, of `main`, the series a working follower would take over -- the Replace preview's own count.
        `offline`: a confirmed failure that is the site's own offline notice. `overLimit` (since v0.55.1): `{limit}` on
        a source the extension engine's source limit left out. `attention` is what the section leads
        with: `replace` (off or failing, and some series' main source -- Health's replace_source rule), `failingUnused`
        (Health's `unused` group: a finding on a source no series uses) and `updates` (installed extensions with an
        update waiting: the engine asked briefly and kept 30 s, else the last extension check's). Ordered: the
        sources in `attention` first, then by main + followed, most first, then by name; switched-off sources last.
        The extension engine's own state stays GET /api/admin/extensions/status's.
      security:
        - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sources, attention]
                properties:
                  sources:
                    type: array
                    items:
                      type: object
                      required: [id, name, kind, lang, standing, offBy, state, stage, cooldown, offline, main, followed, withBackup, lastTestedAt, icon]
                      properties:
                        id: { type: string, description: "'sw:<id>' for an extension source, 'mangadex' or 'mangadex-<code>', a site's slug, a pack's or a built-in's id." }
                        name: { type: string }
                        kind: { type: string, enum: [builtin, mangadex, site, extension, pack] }
                        lang: { type: [string, "null"], description: "What it declares ('all' for an extension in every language); null when it declares none." }
                        pkgName: { type: [string, "null"], description: Extension sources only. }
                        standing:
                          $ref: "#/components/schemas/SourceStanding"
                        offBy: { type: [string, "null"], enum: [admin, extension, language, null], description: "Where it was switched off: under Sources, in its extension, or by hiding its language." }
                        state: { type: string, enum: [blocked, failing, slow, empty, inconclusive, untested, off, slowed, ok] }
                        stage: { type: [string, "null"], enum: [search, chapters, pages, images, null] }
                        cooldown:
                          oneOf:
                            - type: object
                              required: [status, until]
                              properties:
                                status: { type: string }
                                until: { type: [string, "null"], format: date-time }
                            - type: "null"
                        offline: { type: boolean }
                        main: { type: integer, minimum: 0 }
                        followed: { type: integer, minimum: 0 }
                        withBackup: { type: integer, minimum: 0 }
                        lastTestedAt: { type: [string, "null"], format: date-time, description: The last deliberate live check (Test or the daily check). }
                        icon: { type: boolean, description: "GET /img/sources/icon/{id} serves an extension's logo." }
                        address: { type: string, description: A site added by address only. }
                        overLimit:
                          type: object
                          required: [limit]
                          properties:
                            limit: { type: integer, minimum: 1, description: SUWAYOMI_MAX_SOURCES. }
                          description: >-
                            Since v0.55.1, only on an extension's source the last registration left out because
                            SUWAYOMI_MAX_SOURCES was full: switched on, offered by the engine, and not loaded. Not broken,
                            and nothing Replace fixes -- Health's frozen-series row for its series offers `free_slot` by the
                            same record.
                  attention:
                    type: object
                    required: [replace, failingUnused, updates]
                    properties:
                      replace: { type: array, items: { type: string } }
                      failingUnused: { type: array, items: { type: string } }
                      updates: { type: integer, minimum: 0 }
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/admin/sources/{id}/retire:
    post:
      tags:
        - admin
      summary: "Retire a source no series has as its main source: turn it off, or remove it (since v0.54.0)."
      operationId: postApiAdminSourcesIdRetire
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Refused (409
        `in_use`) while the source is some series' main source: Replace it first (POST /api/admin/sources/find {sourceId,
        mode: replace}). Otherwise every series' follow of it is dropped with its listing rows, and then `how: off` (the
        default) switches it off (as POST .../{id}/disable does), and `how: remove` takes a site added by address out of
        the site list and the registry (`done: removed`), switches an extension's source off in its extension, which
        unloads it (`done: switched_off`; the extension stays installed -- one package carries every language), and
        turns anything else -- MangaDex, a built-in, a source pack's -- off, saying so (`done: turned_off`). Audited as
        `source.retire` {source, how, done, followsDropped}.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                how: { type: string, enum: [off, remove], description: "`off` when left out." }
      security:
        - bearer: []
      responses:
        "200":
          description: Retired.
          content:
            application/json:
              schema:
                type: object
                required: [ok, done, followsDropped]
                properties:
                  ok: { type: boolean }
                  done: { type: string, enum: [turned_off, removed, switched_off] }
                  followsDropped: { type: integer, minimum: 0, description: Series that followed it and no longer do. }
        "400":
          description: "`bad_request`: a `how` it does not know"
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "409":
          description: "`in_use` with `main` (how many series have it as their main source) and `message`/`messageSaid` (Said, retire.inUse)"
  /api/admin/sources/{id}/test:
    post:
      tags:
        - admin
      summary: Probe one source right now, ignoring its cooldown, and diagnose it; records the verdict as evidence and
        never changes the cooldown.
      operationId: postApiAdminSourcesIdTest
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Answers
        {ok, timedOut, checks, probe, diagnosis, canClear}. `probe` is always present: {httpStatus?, finalUrl?,
        transport?, looksHtml?, adapterOk, needsSolver}. For a source with a homepage the homepage is fetched
        first and `httpStatus` is its status (0 when a request was made and no HTTP answer came back); an
        extension source has no homepage to ask, so that step is skipped and `httpStatus` is absent, not 0
        (since v0.37.0). A live `adapterOk: true` outranks the stored error, so a passing extension source no
        longer carries an old Cloudflare verdict. `diagnosis` is {code, reason, fix, actor, silent, needsProbe}: the `fix` for a
        stored "Cloudflare bypass currently disabled" (code `cf_challenge`) names the engine's own switch by
        the shipped compose names (uchiyomi-suwayomi, http://uchiyomi-flaresolverr:8191), never the
        development stack's; and since v0.37.0 this route reads the source's slow streak, so `code` can be
        `too_slow` ("This source answers, but more slowly than it is given.") here as well as from Discover's
        health view, with a `fix` naming the configured SOURCE_LATEST_TIMEOUT_MS budget in seconds. Since
        v0.49.0 the answer adds {state, stage, ms, recorded}; the verdict is recorded in source_health.live_* and
        the per-stage evidence Health reads (never status, consecutive, blocked_until or checked_at); `code` is
        never `ok` when `ok` is false, and can be `extension_error` (the engine answered with the extension's own
        error) or `unnumbered`. Since v0.49.1 `diagnosis` adds `fixSaid` (Said: the fix's own `fix.*` code, with
        the stage, host, transport error or budget that fills it); `reason` is always its `code`'s sentence.
        error) or `unnumbered`. Since v0.49.1 it can be `site_offline`: the site answered with its own offline or
        maintenance notice (a small page whose title says so, with none of the engine's own markup), and the
        failing check's `kind` says `site_offline` too.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
