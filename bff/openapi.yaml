  /api/admin/settings:
    get:
      tags:
        - admin
      summary: Server settings, plus extensions_configured (whether an extension engine exists).
      operationId: getApiAdminSettings
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. The row
        includes scanlator_prefs, the server-wide release preferences (ScanlatorPrefs; the default is no
        priority, nothing blocked, two days of patience).
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
    patch:
      tags:
        - admin
      summary: "Change server settings: name, open registration, update interval, extension check interval and
        its kill switch, the update check, the opt-in install count, the opt-in read-chapter cleanup, and the
        server-wide scanlation-group preferences."
      operationId: patchApiAdminSettings
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Answers
        the same row GET does, so a client can replace what it holds.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                serverName:
                  type: string
                allowRegistration:
                  type: boolean
                updaterHours:
                  type: integer
                extensionHours:
                  type: integer
                extensionAutoUpdate:
                  type: boolean
                updateCheck:
                  description: Ask GitHub whether a newer release exists. Sends nothing about this install.
                  type: boolean
                installPing:
                  description: >-
                    Opt in to the anonymous install count. Turning it on mints a per-install secret; turning
                    it off destroys it and asks the collector to forget the current month's id.
                  type: boolean
                scanlatorPrefs:
                  description: >-
                    The server-wide release preferences, replaced whole. Blocks made here apply to every
                    series; the priority applies to a series that has no ranking of its own.
                  $ref: "#/components/schemas/ScanlatorPrefs"
                cleanupRead:
                  description: >-
                    Opt in to deleting the file of a chapter that everyone who started it has finished, once
                    it has been finished for cleanupReadDays. Off by default. Only chapters under the
                    download directory are ever touched; a chapter anyone is partway through is never
                    touched; the chapter and everyone's reading progress survive the file.
                  type: boolean
                cleanupReadDays:
                  description: >-
                    Days to wait after the last reader finishes, counted from the newest progress update on
                    the chapter. 0 means the next run deletes it; it is a grace period, not the off switch
                    (that is cleanupRead).
                  type: integer
                  minimum: 0
                  maximum: 3650
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
