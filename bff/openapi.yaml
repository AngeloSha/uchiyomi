  /api/series/{id}/color:
    get:
      tags:
        - library
      summary: The series' dominant cover colour for ambient theming.
      operationId: getApiSeriesIdColor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "404":
          description: Not found, or not visible to this account
  /api/series/{id}/similar:
    get:
      tags:
        - library
      summary: Series like this one.
      operationId: getApiSeriesIdSimilar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "404":
          description: Not found, or not visible to this account
  /api/series/{id}/books:
    get:
      tags:
