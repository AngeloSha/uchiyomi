  /api/sources/jobs:
    get:
      tags:
        - sources
      summary: Downloads in progress and failed ones (a failed job is never swept; it carries a reason).
      operationId: getApiSourcesJobs
      description: >-
        One card per series folder: `{folder, title, total, done, status, reason?, finishedAt?}`. An add
        that named `alsoFollow` candidates carries `autoFollow` on its card as well -- `{done, results}`
        with `done: false` and no results while the other sources are being asked, then one entry per
        candidate in the order given: `{source, name, theirTitle, followed, coverage, why}` where `why`
        is one of `followed`, `numbering_differs` (it lists under 90% of the primary's numbers or, when the
        judgement is two-way -- a containing title, or a primary listing fewer than ten -- the primary lists
        under 90% of its numbers; `coverage` is then the lower of the two shares), `title_differs` (its own
        title is not this series'), `unreachable` (threw or timed out), `too_few_listed` (the primary lists
        under three numbers, nothing asked), `not_tried` (the 90-second wall ran out first, or the judgement
        itself failed before any source was asked -- every candidate then reads so, never an empty list),
        `cap` (the series already follows two sources) or `unavailable` (the primary itself, disabled, in a
        cooldown, not loaded, or outside the caller's age cap). A nothing-yet add with candidates gets a
        card with `total: 0` and `status: done` purely to carry this. Results survive the dialog closing:
        the card lives a few minutes after the judgement ends, and cannot be dismissed (DELETE answers 409
        `running`) until `autoFollow.done`.
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/sources/jobs/{folder}:
    delete:
      tags:
        - sources
      summary: Dismiss a stopped job; 409 while it is still running, or while its auto-follow judgement runs.
      operationId: deleteApiSourcesJobsFolder
      description: >-
        Only a job that has stopped: 409 `running` while `status` is `downloading`, and likewise while the
        card's `autoFollow.done` is false -- a nothing-yet carrier card is `done` from birth, and dropping it
        mid-judgement would let the follows land with the report they belong to gone, while the dialog polled
        for a card that no longer existed.
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
        "409":
          description: "Conflict: `running` -- the download is still going, or the auto-follow judgement has not finished"
