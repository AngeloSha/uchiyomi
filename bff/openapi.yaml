                    description: >-
                      Sorted by onDisk + listed descending, then by name. Each entry is a GroupStat (the same
                      figures GET /api/series/{id}/groups answers, from the same persisted copies and live
                      files) plus `listed`, kept equal to `releases`. A name in the preferences that nothing
                      lists or holds is a row of zeros.
                    items:
                      allOf:
                        - $ref: "#/components/schemas/GroupStat"
