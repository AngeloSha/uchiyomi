        stamp, after which it is an open finding again and the next repair will look at it. The nightly
        writes the same stamp itself, but only with proof: every source that has the chapter answered, none
        of them silent or in a cooldown. The stamp is cleared automatically whenever the file changes
        underneath it, because the proof was about bytes that are no longer there.
