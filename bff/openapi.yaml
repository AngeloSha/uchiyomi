      summary: A series as one source describes it, before adding, with who scanlates it.
      operationId: getApiSourcesDetail
      description: >-
        `count`, `first` and `last` describe one copy per chapter number under the server-wide release
        preferences (what the add would land). `groups` is the who-scanlates-this panel built from the same
        chapter list (no second source call), with `onDisk` 0 since nothing is on disk yet; `versions` is how
        many numbers the source lists in more than one copy. `numbering` (v0.49.0, #116) is the detector's word
        on the listing: { verdict (strong, hint, none), applied (posting_order when the add will number the
        posts 1..K in posting order, else source), ordered, posts, numbers, biggest { number, posts }, examples,
        alt { count, first, last } (the other reading, for the dialog's switch), extSourceId? }; `count`,
        `first` and `last` follow `applied`. Since v0.49.1, when the source and id are some series' main source,
        the other names its description lists are kept for that series (GET /api/admin/series/{id}/alt-titles).
        This route deliberately does NOT honour the 18+ reveal (v0.42.0), and neither does POST
        /api/sources/add: both are explicit acts on a source and a series the caller just named, and the
        reveal governs what appears unasked. The age cap does apply and answers 403 by id.
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: id
          in: query
          required: false
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [source, sourceId, title, summary, coverUrl, genres, status, count, first, last, groups, versions]
                properties:
                  source: { type: string }
                  sourceId: { type: string }
                  title: { type: string }
                  summary: { type: string, description: "Plain text: HTML and Markdown (MangaDex describes in Markdown) are stripped, link text kept." }
                  coverUrl: { type: [string, "null"] }
                  genres: { type: array, items: { type: string } }
                  status: { type: string }
                  count: { type: integer, description: Chapter numbers, one copy each, under the server-wide preferences. }
                  first: { type: [number, "null"] }
                  last: { type: [number, "null"] }
                  groups:
                    type: array
                    items:
                      $ref: "#/components/schemas/GroupStat"
                  versions: { type: integer, description: Numbers the source lists in more than one copy. }
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
  /api/sources/archive:
    get:
      tags:
        - sources
      summary: The slow archive's queue (#117), as this account may see it.
      operationId: getApiSourcesArchive
      description: >-
        Since v0.49.0. The same object GET /api/sources/jobs carries as `archive`, for a surface that wants the
        archive alone: rows limited to the series this account can browse. Requires canDownload.
      security:
        - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveView"
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
    post:
      tags:
        - sources
      summary: Queue series to be fetched slowly -- a chapter at a time, paced per source, over nights or days (#117).
      operationId: postApiSourcesArchive
      description: >-
        Since v0.49.0. Admins, and members with canDownload, for series they may see, and only when every source
        the series follows is inside their age limit. Each id answers for itself: `queued`; `already` (queued or
        paused already); `nothing` (the listing leaves nothing to fetch below the boundary: everything listed is
        here, capped, held or blocked); `unrouted` (no source is installed for it); `denied` (a source it follows
        is outside this account's age limit); `not_found` (no such series, or one this account may not see --
        with no title). The archive owns the listed numbers below a boundary -- the series' floor, else a hair
        above the newest listed number; a series with no listing yet is queued, and its first turn reads one --
        and the nightly sweep keeps the new releases above it; chapter_floor itself is never changed while it runs.
        Nothing is followed or searched for. A finished archive queued again starts over. Audited as
        `download.archive`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seriesIds]
              properties:
                seriesIds:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string, minLength: 1, maxLength: 200 }
      security:
        - bearer: []
      responses:
        "200":
          description: One outcome per distinct id, in the order given.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, outcome]
                      properties:
                        id: { type: string }
                        title: { type: string, description: Absent for not_found. }
                        outcome: { type: string, enum: [queued, already, nothing, unrouted, denied, not_found] }
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/sources/archive/{seriesId}/pause:
    post:
      tags:
        - sources
      summary: Pause one series' slow archive; a chapter in flight finishes. Its boundary stays.
      operationId: postApiSourcesArchiveSeriesIdPause
      description: >-
        Since v0.49.0. The account that queued it, or an admin; anyone else who can see the series gets 403, and
        one who cannot gets 404, as for no archive at all. 409 `done` on a finished archive.
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
