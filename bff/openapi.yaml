  /api/admin/series/{id}/numbering:
    get:
      tags:
        - admin
      summary: "The plan a numbering change would carry out on one series, changing nothing (#116)."
      operationId: getApiAdminSeriesIdNumbering
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. From a fresh,
        bounded listing of the series' numbering source. `mode` defaults to the change waiting for review, else
        the other numbering. The plan lists every file's move { bookId, from, to, fromFile, file, via (rename,
        row, override, none), how (id, pick, stored, name, date, listing), title }, the books no post matched
        (`parked`), the numbers two books would share (`collisions`), whether it could be applied unattended
        (`clean`, with `reasons`), and the floor it moves to; `tracker` says a tracker is linked.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [posting_order, source, remap]
      security:
        - bearer: []
      responses:
        "200":
          description: "OK: { mode, plan, tracker, numbering }"
        "400":
          description: Unknown mode
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
        "502":
          description: "The source did not answer, so there is no plan (unreachable). Since v0.49.1 with `messageSaid` (Said, renumber.unreachable) beside `message`."
    post:
      tags:
        - admin
      summary: "Choose how one series is numbered: by posting order, by the source, or automatically (#116)."
      operationId: postApiAdminSeriesIdNumbering
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. `auto` hands the
        series back to the detector. `posting_order` and `source` without `confirm` answer `needs_confirm` with
        the plan and change nothing; with it they rename the files in place (book ids, reading progress,
        bookmarks and notes are kept) and answer `applied`. Choosing the numbering the series already has
        (Keep the source's numbers on a series waiting for review) renames nothing and answers `unchanged`.
        `remap` confirms the remap an extension setting queued. `pending` means the change could not be applied
        yet, and the series stays held: the source did not answer; the apply was refused (`error` says why -- a
        file already at a target name, or another check inside the series -- and `plan.reasons` carries `busy`
        when a download started meanwhile); or it took longer than a minute and carries on (`running: true`).
        A manual choice is never undone by the detector. Since v0.49.1 a refused apply carries `errorSaid` (Said:
        renumber.onDisk or renumber.leavesRoot with the `file`, or renumber.checking) beside `error`, and a 409
        `busy` carries `messageSaid` -- renumber.downloading (a download is writing into the folder) or
        renumber.checking (another run is inside the series) -- which tells the two apart without reading English.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [auto, source, posting_order, remap] }
                confirm: { type: boolean }
      security:
        - bearer: []
      responses:
        "200":
          description: "OK: { state (applied, pending, needs_confirm, unchanged), plan?, tracker?, error?, running?, numbering }"
        "400":
          description: Malformed body
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
        "409":
          description: "busy (with `confirm`): chapters are being fetched for this series, or a check is inside it -- the sweep, Check now, a listing refresh, Fill -- and would fetch into the old numbers after the renames; try again when that ends. `message` says which."
  /api/admin/series/{id}/alt-titles:
    get:
      tags:
        - admin
      summary: "The other names a series goes by (since v0.49.1)."
      operationId: getApiAdminSeriesIdAltTitles
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Where they come
        from: an admin (POST below), a tracker import's synonyms when the import added the series, and the series'
        main source's own description -- "Alternative Titles:"-style lines, Latin script only, each name's key at
        least five characters, at most twenty -- read when the series is added and whenever that source's details
        are read again. A name removed here (DELETE below) stays removed however often the source lists it, until an
        admin types it again. Every search for another source -- Find other sources, the add's auto-follow, the
        nightly hunt, borrowed chapter names and Find missing chapters -- asks under the title and up to three of
        these, and an other name matches EXACTLY, never by containment, and is then measured by the numbering both
        ways. A merge carries the names to the survivor; Forget erases them. The idea and the parsing are
        @TIGamingTV's (PR #119).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: The names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AltTitles"
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
    post:
      tags:
        - admin
      summary: "Add an other name to a series by hand (since v0.49.1)."
      operationId: postApiAdminSeriesIdAltTitles
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Answers the
        whole list, as GET does. Refused before anything is written: 400 `non_latin` (letters that are not Latin
        script normalise to nothing and could never be compared), 400 `too_short` (a key under five letters or
        digits is a word, not an identity), 409 `exists` (the series already goes by it: a stored name with the same
        key, or its own title). A name removed earlier comes back this way, as an admin's name. Audited as
        `series.alt_title.add`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 200, description: Trimmed. }
      security:
        - bearer: []
      responses:
        "200":
          description: The names, with the new one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AltTitles"
        "400":
          description: "`bad_request`, `non_latin` or `too_short`"
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
        "409":
          description: "`exists`: the series already goes by that name"
