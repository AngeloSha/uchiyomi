      summary: How many pages one previewed chapter has.
      operationId: getApiSourcesPreviewPages
      description: >-
        Since v0.47.0 (#91). The chapter is named by its number in GET /api/sources/preview's listing; a number
        that listing does not have is 404 `not_listed`, and the source is never asked for it. The pages are
