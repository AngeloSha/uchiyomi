  /api/admin/settings:
    get:
      tags:
        - admin
      summary: Server settings, plus extensions_configured (whether an extension engine exists) and mangadex_available.
      operationId: getApiAdminSettings
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. The row
        includes scanlator_prefs, the server-wide release preferences (ScanlatorPrefs; the default is no
        priority, nothing blocked, two days of patience), backup_hour, the local hour (0-23) of the nightly
        backup, and auto_follow_on_failure, the on-by-default bounded source hunt after an ordinary scheduled
        chapter failure. The hunt never runs for interactive Add/Fetch or after a 403/429 refusal.
      security:
        - bearer: []
      responses:
        "200":
          description: >-
            The settings row. Only the read-chapter cleanup fields, backup_hour and
            auto_follow_on_failure are described here; the rest are the snake_case columns PATCH sets
            (server_name, allow_registration, updater_hours, ...).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  nightlyMode:
                    type: string
                    enum: [repair, autofix]
                    description: Since v0.55.0, what the nightly runs (PATCH nightlyMode); `repair` unless set.
                  hideNoticeShortOnly:
                    type: boolean
                    description: Since v0.55.3 (#147), the notice switches' rule (PATCH hideNoticeShortOnly); true unless set off.
                  cleanup_read:
                    type: boolean
                    description: Whether the opt-in read-chapter cleanup is on. Off by default.
                  cleanup_read_days:
                    type: integer
                    minimum: 0
                    maximum: 3650
                    description: >-
                      Days after the last reader finishes before the file goes. 0 deletes at the next run.
                  cleanup_read_due:
                    type: [integer, "null"]
                    description: >-
                      How many chapters the cleanup would delete if it ran now, at the current day setting,
                      whether or not it is switched on -- so the number can be seen before consenting. Memoised
                      for half a minute; null when it could not be counted.
                  backup_hour:
                    type: integer
                    minimum: 0
                    maximum: 23
                    description: Local hour of the nightly backup. Default 3.
                  auto_follow_on_failure:
                    type: boolean
                    description: >-
                      Whether a scheduled sweep may find and follow another matching source after an
                      ordinary failed chapter. On by default; bounded to one hunt per series per day.
                  repair_enabled:
                    type: boolean
                    description: >-
                      Whether the nightly library repair runs on its own. On by default. Off stops the
                      schedule only: Run now and the Health page's chips still work, because nothing the
                      repair does is destructive (it never deletes, merges or renumbers anything).
                  adult_genres:
                    type: array
                    items:
                      type: string
                    description: The 18+ filter's genres, lowercased. See adultGenres on PATCH.
                  adult_sources:
                    type: array
                    items:
                      type: string
                    description: The source ids the 18+ filter treats as adult. See adultSources on PATCH.
                  source_prefs:
                    $ref: "#/components/schemas/SourceOrder"
                  group_upgrade:
                    type: boolean
                    description: Whether the nightly repair swaps chapters for a preferred group's copy. See groupUpgrade on PATCH.
                  borrow_names:
                    type: boolean
                    description: Whether the nightly repair borrows chapter names from another source. See borrowNames on PATCH.
                  archive_paused: { type: boolean, description: "The slow archive (#117) is paused server-wide. See archivePaused on PATCH." }
                  archive_per_hour: { type: integer, minimum: 1, maximum: 30 }
                  archive_window_from: { type: [integer, "null"], minimum: 0, maximum: 23 }
                  archive_window_to: { type: [integer, "null"], minimum: 0, maximum: 23 }
                  archive_min_free_gb: { type: integer, minimum: 1, maximum: 2000 }
                  archive_free_gb:
                    type: [number, "null"]
                    description: GiB free under the download root now, one decimal, what archive_min_free_gb is set against; null when it cannot be measured.
                  mangadex_langs:
                    type: array
                    items:
                      type: string
                    description: >-
                      Since v0.52.0 (#123): the MangaDex languages besides English that are on, as app codes in
                      mangadex_available's order. Each is a source of its own, `mangadex-<code>` named
                      "MangaDex (ES-419)". See mangadexLangs on PATCH. Empty by default.
                  mangadex_available:
                    type: array
                    items:
                      type: string
                    description: >-
                      Computed: every language MangaDex is offered in, as app codes (BCP-47: es-419, pt-BR,
                      zh-Hans, zh-Hant, fil, ...), English first. English is always on.
                  unstated_lang:
                    type: string
                    description: >-
                      Since v0.52.0: the language of sources and series that do not say which they are in
                      (most added sites). English by default. See unstatedLang on PATCH.
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
    patch:
      tags:
        - admin
      summary: "Change server settings: name, open registration, update interval, backup hour, extension check
        interval and its kill switch, the update check, the opt-in install count, the opt-in read-chapter
        cleanup, the bounded failed-chapter source hunt, the server-wide scanlation-group preferences, and what
        the 18+ switch hides besides 18+ libraries."
      operationId: patchApiAdminSettings
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Answers
        the same row GET does, so a client can replace what it holds.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                serverName:
                  type: string
                allowRegistration:
                  type: boolean
                updaterHours:
                  type: integer
                extensionHours:
                  type: integer
                extensionAutoUpdate:
                  type: boolean
                updateCheck:
                  description: Ask GitHub whether a newer release exists. Sends nothing about this install.
                  type: boolean
                installPing:
                  description: >-
                    Opt in to the anonymous install count. Turning it on mints a per-install secret; turning
                    it off destroys it and asks the collector to forget the current month's id.
                  type: boolean
                scanlatorPrefs:
                  description: >-
                    The server-wide release preferences, replaced whole. Blocks made here apply to every
                    series; the priority applies to a series that has no ranking of its own.
                  $ref: "#/components/schemas/ScanlatorPrefs"
                cleanupRead:
                  description: >-
                    Opt in to deleting the file of a chapter that everyone who started it has finished, once
                    it has been finished for cleanupReadDays. Off by default. Only chapters under the
                    download directory are ever touched; a chapter anyone is partway through is never
                    touched; the chapter and everyone's reading progress survive the file.
                  type: boolean
                cleanupReadDays:
                  description: >-
                    Days to wait after the last reader finishes, counted from the newest progress update on
                    the chapter. 0 means the next run deletes it; it is a grace period, not the off switch
                    (that is cleanupRead).
                  type: integer
                  minimum: 0
                  maximum: 3650
                backupHour:
                  type: integer
                  minimum: 0
                  maximum: 23
                  description: >-
                    Local hour of the nightly backup. The pending timer is re-armed at once, so the change
                    applies to the next run rather than the one after.
                autoFollowOnFailure:
                  type: boolean
                  description: >-
                    Allow the scheduled sweep to search for and follow a matching source after an ordinary
                    chapter failure. Does not affect interactive requests or refusals.
                repairEnabled:
                  type: boolean
                  description: >-
                    Run the library repair nightly (REPAIR_HOURS, default 24h). On by default. Switching it
                    off stops the schedule only -- POST /api/admin/tasks/repair/run and the Health page's
                    chips are unaffected, because nothing it does deletes, merges or renumbers anything.
                nightlyMode:
                  type: string
                  enum: [repair, autofix]
                  description: >-
                    Since v0.55.0, what the nightly runs: `repair`, the safe repair above (the default, as before),
                    or `autofix`, Health's Fix everything (POST /api/admin/health/autofix), as if an admin had pressed
                    it, with nobody's name on it. repairEnabled still switches the nightly off entirely. Read every
                    tick, so a change applies to the next run without a restart. GET answers it as `nightlyMode`.
                komgaGhostChapters:
                  description: >-
                    List the chapters this server does not hold on the Komga-compatible API: the ones the
                    sources listed but the sweep never fetched, and the tombstones whose files the read
                    cleanup deleted. Off by default. They report media.status READY so the extension does
                    not filter them out, carry a page count of 0 and a size of "not downloaded", and cannot
                    be opened. Their numbers count towards the chapter total the trackers read, which is
                    what the setting is for -- maxNumberSort only: they are not counted in booksCount or
                    booksUnreadCount, so a fully read series still reports COMPLETED -- and they never
                    affect lastReadContinuousNumberSort. Nothing outside /api/v1 and /api/v2 changes.
                  type: boolean
                adultGenres:
                  description: >-
                    Genres the "Show 18+" switch hides besides 18+ libraries, replaced whole. While a request
                    does not carry adult=1, every listing leaves out a series whose genres (an admin genre
                    override wins over the scanned list) include one of these, unless the series is exempted
                    (adultExempt on PUT /api/admin/series/{id}/meta). Surfacing only: by-id routes, links,
                    downloads and progress are unaffected, and the permission is still the member's age
                    limit. Stored lowercased and trimmed; a name with a character outside letters, digits,
                    space and ' - + / & ( ) . ! : is dropped, not stored. Empty by default.
                  type: array
                  maxItems: 60
                  items:
                    type: string
                    minLength: 1
                    maxLength: 60
                adultSources:
                  description: >-
                    Source ids to treat as adult on top of the ones whose extension declares itself NSFW,
                    replaced whole. While a request does not carry adult=1 they drop out of the routes that
                    list sources or fan out over them (GET /api/sources, search-all, latest, popular). By-id
                    routes are unaffected. Same normalisation as adultGenres. Empty by default.
                  type: array
                  maxItems: 200
                  items:
                    type: string
                    minLength: 1
                    maxLength: 120
                sourcePrefs:
                  description: >-
                    The server-wide source order, replaced whole. When a series follows more than one
                    source, a chapter the server does not have yet is taken from the highest-ranked source
                    that lists it, after the scanlation group preferences; sources the order does not name
                    keep the follow order behind the ones it does. Chapters already downloaded are never
                    replaced because of it. Ids are kept as given (trimmed, de-duplicated, anything outside
                    letters, digits and _ . : - dropped), whether or not the source is loaded right now.
                    Empty by default, which is the follow order.
                  $ref: "#/components/schemas/SourceOrder"
                groupUpgrade:
                  type: boolean
                  description: >-
                    Group upgrades (since v0.47.0, #81), the nightly repair's sixth step: a chapter held from
                    one scanlation group is replaced once a group the release preferences rank higher has
                    released it on a source the series follows. Off by default. Only files the server
                    downloaded itself (the download root and the downloader's own file name), never with a
                    copy whose page list is shorter than the file on disk, never a partial copy, never a
                    chapter someone picked a copy for by hand, and at most REPAIR_GROUPS_MAX (10) a night; a
                    chapter whose upgrade failed is left for a week. Each swap is audited as
                    `book.group_upgraded`.
                borrowNames:
                  description: >-
                    Chapter names borrowed from another source (since v0.47.0, #85), the nightly repair's
                    seventh step. Off by default. A donor must pass the same identity and numbering
                    judgement an automatic follow must pass, must be in the series' own language, and names
                    are matched by exact number; only `lib_books.chapter_name` is written, marked with the
                    donor, so the chapter's own source replaces it the moment it supplies one. Switching
                    this off clears exactly the names it wrote for every series that follows this setting
                    (a series switched on for itself keeps its own).
                  type: boolean
                archivePaused:
                  type: boolean
                  description: >-
                    Pause the slow archive (#117) for every series. A chapter in flight finishes. Queued series keep
                    their place and their boundary, so the sweep still leaves their back catalogue to it.
                archivePerHour:
                  type: integer
                  minimum: 1
                  maximum: 30
                  description: >-
                    Chapters an hour the slow archive takes from each source. Default 4: breaks are jittered and
                    now and then long, pages one at a time with a random 1.5-4 s between them
                    (ARCHIVE_PAGE_GAP_MS), at most three sources at once (ARCHIVE_MAX_SOURCES).
                archiveWindowFrom:
                  type: [integer, "null"]
                  minimum: 0
                  maximum: 23
                  description: >-
                    The local hour the slow archive may start at, with archiveWindowTo the hour it stops; a window
                    may cross midnight (22 to 6). Both are sent together, set or both null (any time, the
                    default); one alone is refused.
                archiveWindowTo:
                  type: [integer, "null"]
                  minimum: 0
                  maximum: 23
                archiveMinFreeGb:
                  type: integer
                  minimum: 1
                  maximum: 2000
                  description: The slow archive waits while less than this many GB are free under the download root. Default 20.
                mangadexLangs:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                  description: >-
                    Since v0.52.0 (#123): the MangaDex languages besides English to switch on, replaced whole, as
                    app codes from mangadex_available (MangaDex's own es-la, pt-br, zh and zh-hk are read as es-419,
                    pt-BR, zh-Hans and zh-Hant). Applied at once, with no restart: each language turned on is
                    registered as a source of its own (`mangadex-es-419`, "MangaDex (ES-419)") whose search, Popular,
                    Newest and chapters are in that language only; each turned off is unregistered, and its series
                    keep their chapters and read as frozen in Health until it is back. Every MangaDex source shares
                    one rate limit. English is always on and is refused here (400 english_always_on), as is a code
                    MangaDex is not offered in (400 unknown_language); either refusal writes nothing. A change is
                    audited as `settings.mangadex_langs` {from, to}.
                unstatedLang:
                  type: string
                  description: >-
                    Since v0.52.0: the language of sources and series that do not say which they are in -- most
                    added sites declare none. A source is followed for a series automatically only when both are
                    in the same language, so a server whose sites are in Spanish sets es here. Any one language
                    (BCP-47, normalised: pt-br is pt-BR); "all", "other" or an empty string is refused (400
                    unknown_language). Applied at once.
                hideNoticeTypes:
                  type: array
                  maxItems: 6
                  items:
                    type: string
                    enum: [manga, manhwa, manhua, webtoon, comic, unknown]
                  description: >-
                    Notice chapters: the series types whose notice chapters are hidden, replaced whole. A notice is
                    a chapter numbered with a fraction (100.5 -- the notices many sources post after their latest
                    chapter) whose page count is known and is 3 or fewer: a saved chapter's own counted pages, else
                    what its sources list. A longer one is a chapter in parts and stays, and so does one nobody has
                    counted yet, and a file holding a range of chapters (`numberEnd`) is never one. Empty, the
                    default, is off. A hidden chapter is left out of every chapter list,
                    count, badge and feed, the reader's next and previous, OPDS, the Komga-compatible API and what
                    the trackers are told, and the sweep and the slow archive do not download one its sources list
                    as that short. Nothing is deleted: taking a type off the list shows its chapters again on the
                    next request, and the next check fetches those never downloaded. A series' own switch
                    (`hideNotices` on PATCH /api/admin/series/{id}) outranks its type's; its type is `seriesType`
                    on GET /api/series/{id}. Read back as `hide_notice_types`.
                hideNoticeShortOnly:
                  type: boolean
                  description: >-
                    Since v0.55.3 (#147, "Only hide short ones (3 pages or fewer)"): the rule the notice switches
                    hide by. true, the default, is the page rule `hideNoticeTypes` describes. false makes every
                    chapter numbered with a fraction a notice, of the types and the series switched on -- real chapters
                    a site split into parts (12.1, 12.2) included, whatever their pages, and the sweep then downloads no
                    fractional chapter of a series that hides them. A file holding a range of chapters is never a
                    notice either way. Applies on the next request. Read back as `hideNoticeShortOnly`.
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: >-
            Malformed body or parameter; or, with `error`, a language refused: unknown_language (mangadexLangs
            or unstatedLang), english_always_on (mangadexLangs). Nothing is written.
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/admin/tasks:
    get:
      tags:
        - admin
      summary: Scheduled tasks with last run, last result and whether one is running.
      operationId: getApiAdminTasks
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Since
        v0.37.0 the list always carries `verify` ("Verify chapter files", schedule "on demand · after a
        database-only restore") with `lastRun` (epoch ms or null) and `lastResult` {ok, checked, missing,
        readLibraryMissing, unmounted: string[], roots, ms, stopped?: 'shutdown'} or null -- it never runs by
        itself, so it is listed even when it never has. Its run is detached (see the run route), so this
        entry is where the counts appear: `checked` is rows whose file was looked for under roots that were
        not skipped (both roots), `missing` the download-root rows marked this run, `readLibraryMissing` the
        read-library rows whose file is gone (counted, never marked), `unmounted` the roots left alone (a
        bare path: no file at all under it; "<root> (95 % of 20 chapter files missing)": the 90 % rule).
        Both are persisted in server_settings (verify_last_run / verify_last_result) and survive a restart;
        a run that threw stores a null result rather than an older healthy one.
        Since v0.41.0 the list also always carries `repair` ("Repair library"), the nightly library repair,
        with `schedule` "every {REPAIR_HOURS}h · never during a chapter sweep" or "switched off · on demand"
        when repair_enabled is false, `running`, and `lastRun`/`lastResult` (persisted in
        server_settings.repair_last_run / repair_last_result, memory winning once this process has run it).
        Its result is {ok, ms, only?, counted, uncounted, short: {looked, replaced, confirmed, left},
        gaps: {series, followed, fetched, unfillable, sweep}, failures: {reset, retried?}, solver: {reset,
        unblocked, expired}, skipped?: 'disabled', stopped?: 'shutdown' | 'disk', stepMs?, skips?, run?}.
        Since v0.49.0 `lastRun`/`lastResult` are the last FULL run (no `only`: the nightly, or Run now here) --
        a one-row Health fix no longer replaces them or moves the nightly's schedule -- and the repair entry
        adds `lastOrigin` ('nightly' | 'manual' | null), `startedAt` and `run` (the running run's id, or null),
        `nextAt` (when the nightly is armed for) and `latestOther` {id, kind, target, finishedAt, status,
        result} (the newest scoped run, from GET /api/admin/tasks/repair/runs). Every entry also carries
        `scheduleKey` (the schedule sentence with {placeholders}, a locale key on the web) and `scheduleVars`
        (their values); `schedule` stays the English sentence.
        Since v0.55.4 the list always carries `rescan` ("Rescan everything", schedule "on demand"): `running`
        while its preview or Apply runs, and `lastRun`/`lastResult` the last APPLY's (see POST
        /api/admin/tasks/rescan/apply), persisted in server_settings.rescan_last_run / rescan_last_result.
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/admin/tasks/repair/status:
    get:
      tags:
        - admin
      summary: The library repair, live -- what it is on, its limits and estimates, the last runs and the next nightly.
      operationId: getApiAdminTasksRepairStatus
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Since
        v0.49.0. Polled by the Health page every 2 s while a run is going; it reads memory and a memoised digest
        of repair_runs, so it costs no query that grows with the library. Answers {running, sweepRunning,
        enabled (repair_enabled), nextAt (epoch ms of the armed nightly, or null outside owned mode), run, last,
        recent, lastFull, limits, estimates, stepTypicalMs}. `run` is null or the running run: {id, startedAt,
        origin: 'nightly' | 'manual', mine, kind ('full' | 'fix_short' | 'fill' | 'retry' |
        'steps:<a+b...>[:now]'), only, target {seriesId?, bookId?, sourceId?, now?, number?, label?}, steps,
        step, stepIndex, stepStartedAt, stepMs, planned {step: n}, current {kind: series | chapter | source |
        solver | files, seriesId?, bookId?, title?, number?, sourceId?, phase, done?, of?} | null, counts (the
        live result so far), budget {left, of} (searches the run has left), shortReserve {left, of} | null,
        skips[], cancelRequested}. Who started it is never sent, only `mine`; a series title (current.title,
        target.label, a skip's target.title) is dropped when this viewer may not list that series (the 18+
        hide), as on GET /api/sources/jobs. `last` {id, finishedAt, status, kind} is the newest finished run of
        any kind -- how a page that pressed a one-row fix learns that ITS run (the id the run route answered)
        ended, even one that took 5 ms; `recent` the five newest finished runs {id, finishedAt, status, kind,
        target}; `lastFull` {id, at, ms, origin, result} the newest full run. `limits` is every bound the
        running process uses (env overrides applied): shortMax, gapsMax, groupsMax, namesMax, countMax,
        directionsMax, huntBudget, shortHuntMax, gapChapters, retrySeries, shortCopies, failuresMax, retryCap,
        paceMs, pageListMs, listingRefreshMs, listTimeoutMs, huntWallMs, huntMaxSources, solverBudgetMs,
        expiredBlockHours, repairHours. `estimates` maps a run kind to {typicalMs (median of its last five
        finished runs, or null), runs, worstMs (the sum of the waits the code bounds -- page lists, listings,
        searches -- or null when a planned step has no such bound), downloads (the most chapters it can
        download, stated as a count, never folded into the time)}, for the Health chips' kinds, every kind in
        the history, and up to ten more named in `kinds`. Statuses: running | done | stopped | failed |
        skipped | interrupted (a run whose process died; closed when the next run starts).
      parameters:
        - name: kinds
          in: query
          required: false
          description: Comma-separated run kinds to estimate as well, e.g. steps:failures+gaps+short+solver:now (at most ten).
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/admin/tasks/repair/runs:
    get:
      tags:
        - admin
      summary: Every kept library repair run, newest first, or one by id.
      operationId: getApiAdminTasksRepairRuns
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Since
        v0.49.0. Every run is kept in repair_runs -- the nightly and every Health press -- pruned to at least
        the newest 50 rows and everything from the last 90 days. Answers {content: [{id, startedAt, finishedAt,
        origin: 'nightly' | 'manual', username (who pressed it; null for the nightly or a deleted account),
        mine, kind, only, target, status, ms, stepMs, result (the run's RepairResult, with skips[]), notes
        {replaced[], confirmed[], followed[], upgraded[]}}]}. A series title in target.label or a skip is
        dropped when this viewer may not list that series. `notes` names series by title alone, with no id to
        hold each one to the 18+ hide, so it is null unless the request carries ?adult=1. A Fix everything run
        (kind `autofix`, since v0.55.0) keeps `result` {phaseIndex, summary, log}, held to the 18+ hide line by
        line as GET /api/admin/health/autofix holds it (AutofixRun).
      parameters:
        - name: limit
          in: query
          required: false
          description: How many, 1 to 50 (default 20).
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: id
          in: query
          required: false
          description: One run, by the id POST /api/admin/tasks/repair/run answered with.
          schema:
            type: string
            format: uuid
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/admin/tasks/rescan/status:
    get:
      tags:
        - admin
      summary: Rescan everything, live -- the preview's phase and progress, and the plan it ended with.
      operationId: getApiAdminTasksRescanStatus
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Since
        v0.55.4 (discussion #150). The preview is started by POST /api/admin/tasks/rescan/run, detached: it scans
        the library, then looks for every live chapter row's own file under the library folder and the download
        folder -- never a hidden or merged series', nor one in the middle of a renumber -- and keeps a plan in
        memory. Answers {running: 'preview' | 'apply' | null, phase: 'scan' | 'look' | 'pair' | 'numbers' (a
        preview) | 'mark' | 'renumber' (an Apply) | null, done, of (rows or files of the phase, null while scanning
        or reading names), startedAt, error: 'failed' |
        'stopped' | null (how the last preview or Apply ended when it did not end well), plan, last (the last
        Apply's result, below, this process's or the one server_settings kept), lastRun (epoch ms or null)}.
        `plan` is null or {id (uuid), at, scannedAt (epoch ms), ms,
        stale (older than 30 minutes), applied, looked (rows whose file was looked for, under folders that were
        not refused), unchecked (rows whose file could not be checked at all -- a permission or an I/O error,
        never "not there" -- left alone), unmounted [{root, missing?, of?}] (a folder with no file present
        behind any of its rows, or more than 90 % of them gone: looks unmounted, and nothing under it is
        planned), gone (rows in your own library folder whose file is gone), moved (gone rows whose file is
        another live row's now, by fingerprint: renamed or moved, kept), downloads (rows in the download
        folder whose file is gone: Verify chapter files' to mark, counted only), emptied (series with every
        live chapter's file gone), goneSeries, emptiedList [{seriesId, chapters, title}], movedList [{seriesId,
        title, file, to: {seriesId, title, file}}], numbers, numbersTotal}. The lists hold at most 200 entries
        each and name only series this viewer may list (the 18+ hide, as on the repair status); the counts are
        always whole. `numbers` is the opt-in, every series (by title, at most 1000) whose chapter numbers the
        file-name rules of v0.55.2 would change -- each row still read by an older rule, read again with rule 2
        against its stored number and range: [{seriesId, title, chapters (rows whose number or range changes),
        readers (users who finished one of them), overrides (rows that would change but carry a number set by
        hand: they keep it), tracked (linked to a tracker), up / down (of the changed chapters someone finished,
        how many a tracker would be told higher, or lower -- which the tracker floor refuses), examples [{file,
        from, to}] (at most 3, numbers as text: "2" -> "5", "1" -> "1–7")}]. A series numbered by posting order,
        or in the middle of a renumber, is never listed; a row Verify marked 'missing' is never read again.
        `last` is null or {ok, plan (the preview it applied), marked, back, changed, moved, downloads, emptied,
        unmounted [{root}], renumbered {series, chapters}, ms, stopped?: 'shutdown'}.
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/admin/tasks/rescan/apply:
    post:
      tags:
        - admin
      summary: Apply a Rescan everything preview -- mark the chapters whose files are gone from your own folder.
      operationId: postApiAdminTasksRescanApply
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Since
        v0.55.4 (discussion #150). Detached like the preview, because it stats every planned file again: answers
        {ok: true, started: true}, or {ok: false, error} when it may not start -- `busy` (a preview or an Apply is
        running), `no_plan`, `stale` (a newer preview replaced it, or it is older than 30 minutes), `applied`
        (each plan is applied once), `not_in_plan` (a series in `renumber` the preview did not list), or the job
        it would run beside: `sweep_running`, `autofix_running`,
        `repair_running`, `verify_running`, `cleanup_running`, `scan_running`. With every library scan held off,
        each planned row is asked again -- the same id at the same file, still live, its series neither hidden,
        merged nor being renumbered, its file still not there, and no live row with its fingerprint -- and the
        library folder must still hold a file the preview saw; then it is marked pruned with `pruned_reason =
        'deleted'` (held: the sweep never fetches it back), and the cover and books_count of every series it
        touched are recomputed. It never erases a row, touches a file on disk, marks a row in the download folder
        (Verify chapter files' to mark), relabels a row already pruned, hides or forgets a series, or changes a
        tracker floor, read mark, favourite or rating. A file that comes back is picked up on the same row by the
        next scan. Then, in the same hold and in ONE transaction, the series in `renumber` (the opt-in) are read
        again by the v0.55.2 file-name rules: every row of theirs still read by an older rule gets name_rule 2 and
        its number and number_end by that rule -- but a row with a number set by hand, which keeps it, and a row
        Verify marked 'missing'; a series hidden, merged, put into posting order or being renumbered since the
        preview is left alone. Nothing is pushed to any tracker: the next chapter a reader finishes sends its
        number as usual. The result lands on the status route's `last` and on GET /api/admin/tasks as the
        `rescan` entry's lastResult, persisted in server_settings.rescan_last_run / rescan_last_result. Audit:
        `library.rescan` {plan, marked, back, changed, moved, downloads, emptied, unmounted, ms}, and
        `library.rescan_numbers` {plan, series, chapters, ids} when the opt-in renumbered something.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan:
                  type: string
                  format: uuid
                  description: The id of the preview the admin saw (the status route's plan.id).
                renumber:
                  type: array
                  maxItems: 10000
                  description: >-
                    The opt-in: the series to read again by the newer file-name rules, each one the preview listed
                    in plan.numbers. Omitted or empty renumbers nothing.
                  items:
                    type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: The body is not {plan} with a uuid, and `renumber` series ids if any.
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/admin/tasks/{id}/run:
    post:
      tags:
        - admin
      summary: Start a scheduled task now (scan, update, backup, fingerprint, pagehash, cleanup, extensions, verify, repair, rescan).
        {ok:false,error:busy} while it runs, {ok:false,error:not_enabled} for a task that is switched off,
        {ok:false,error:sweep_running} for `repair` while a chapter sweep is going, and
        {ok:false,error:repair_running} for `update` while a library repair is going.
      operationId: postApiAdminTasksIdRun
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. `scan` is
        awaited and answers with its result; the others, `verify` included, start in the background and
        answer {ok: true, started: true} ({ok: false, error: 'busy'} while one runs). `verify` (since v0.37.0,
        "Verify chapter files") is detached because one stat per row over a network share is minutes on a
        large library and a request that long dies at the reverse proxy while the walk goes on; its counts
        land on GET /api/admin/tasks as the `verify` entry's `lastResult`, persisted across restarts. It stats
        every un-pruned chapter row under both roots but marks ONLY rows under the download folder
        (/library-dl) as pruned with `pruned_reason = 'missing'` -- the one reason the updater does not count
        as held, so the next sweep (and Fetch newest) download them again onto the same rows; a read-library
        row whose file is gone is counted in `readLibraryMissing` and never marked, because a re-fetch could
        not land on that row. Per root it applies the read-chapter cleanup's whole-batch rule: a root where no
        checked row's FILE is present (an empty folder is not proof of a mount), or that cannot be read, is a
        volume that is not mounted (or an empty disk, which looks the same from inside the container), so it
        marks nothing there and names the bare root in `unmounted`; and a root with more than 90 % of its
        checked files missing is refused the same way, named as "<root> (N % of M chapter files missing)".
        Rows are never deleted; a row the cleanup already marked keeps its reason. Never runs at boot or on a
        schedule. Audit: `task.run` {task: 'verify'} at the press and `library.verify` {checked, missing,
        readLibraryMissing, unmounted, ms} when the walk ends.
        `repair` (since v0.41.0) is the only task that takes a body, and it is also detached. With no body it
        runs all eight steps over the whole library; `only` narrows it to named steps, and the three targets
        each belong to exactly one step -- `seriesId` to `gaps` ("Fill now" on one series), `bookId` to
        `short` ("Fix" on one chapter), `sourceId` to `failures` ("Retry now" on one source) -- so a target
        sent without `only: ["<its step>"]` is refused with 400 rather than quietly widened into a full run.
        A run somebody asked for ignores the repair_enabled switch (nothing it does is destructive); the
        nightly honours it and reports skipped: 'disabled'. It never runs beside a chapter sweep: while one
        is running the answer is {ok:false,error:'sweep_running'}, and while another repair is running it is
        {ok:false,error:'busy'}; the other direction is named too -- pressing `update` (Check for new
        chapters) while a repair runs answers {ok:false,error:'repair_running'} rather than a shared `busy`,
        which would say the sweep is still running when it is not. Counts land on GET /api/admin/tasks as the `repair` entry's `lastResult`.
        Since v0.49.0 the answer is {ok: true, started: true, run} with the run's id (uuid): every run is kept
        in repair_runs, only a full run (no `only`) is the Tasks entry's `lastResult`, and a scoped run's
        progress and end are read from GET /api/admin/tasks/repair/status (`run`, then `last`/`recent`) and
        its record from GET /api/admin/tasks/repair/runs?id=. `seriesId` with `only: ["gaps"]` (Fill now) looks
        at the series even while its automatic updates are off, and fetches gap chapters a followed source
        already lists (at most 20), not only after following a new one. The result may carry `skips`
        [{step, target?, why: folder_busy | not_eligible | no_gaps | source_cooling_down | source_off |
        solver_down | no_searches_left, until?, detail?}] saying what was passed over and why. `scan` (awaited)
        stamps the Tasks entry's lastRun like POST /api/refresh does.
        Audit: `task.run` {task:'repair'} at the press, `library.repair` {only?, seriesId?, bookId?,
        sourceId?, summary, stopped?, replaced[], confirmed[], followed[]} when the run ends (userId null for
        the nightly), plus `book.short_fixed` per replaced chapter and `series.follow_source` per followed
        source.
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            The task. `cleanup` is the opt-in read-chapter cleanup and answers not_enabled while cleanup_read
            is off; its run is subject to the same consent and the same vetoes as the hourly one. `verify` is
            the repair for a database restored without its chapter files. `repair` is the nightly library
            repair and is the only one that takes a body. `rescan` (since v0.55.4, "Rescan everything") starts
            a preview -- a scan, then a look for every live chapter's own file -- and changes nothing; its
            progress and plan are on GET /api/admin/tasks/rescan/status.
          schema:
            type: string
            enum: [scan, update, backup, fingerprint, pagehash, cleanup, extensions, verify, repair, rescan]
      requestBody:
        required: false
        description: Only `repair` reads a body; every other task ignores it.
        content:
          application/json:
            schema:
              type: object
              properties:
                only:
                  type: array
                  minItems: 1
                  maxItems: 8
                  description: >-
                    Which steps to run, each at most once. Omitted means all eight, in this order. `groups`
                    and `names` (since v0.47.0) do nothing unless group upgrades, or chapter-name borrowing,
                    are switched on (groupUpgrade and borrowNames on PATCH /api/admin/settings).
                    `directions` (since v0.48.0) asks MangaDex and AniList which way series with no known
                    reading direction read, at most REPAIR_DIRECTIONS_MAX (500) series per service.
                  items:
                    type: string
                    enum: [solver, count, failures, short, gaps, groups, names, directions]
                seriesId:
                  type: string
                  description: >-
                    One series to search another source for. Only with only: ["gaps"]; the 24-hour re-check
                    cooldown is ignored for it.
                bookId:
                  type: string
                  description: >-
                    One short chapter to replace if a longer copy exists. Only with only: ["short"].
                sourceId:
                  type: string
                  description: >-
                    One source whose failed chapters to reset and re-check regardless of their age. Only
                    with only: ["failures"].
                now:
                  type: boolean
                  description: >-
                    Since v0.48.3: the whole library, now. Only with no target, and only where the `failures` step
                    runs (400 otherwise). That step then resets EVERY source's failed chapters whatever their age
                    and re-checks up to 10 series from the sources that can be asked now (never one cooling down or
                    switched off, and never with a search). Health's Fix all issues sends it, and since v0.49.0 so
                    does the Fix all on its "Chapters that would not download" card.
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
