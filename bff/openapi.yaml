  # ---- Komga-compatible API (routes/komgaCompat.ts, since v0.38.0) ------------------------------------------
  # Every operation below takes komgaApiKey, komgaBearer, komgaBasic or komgaSession and nothing else; no
  # credential is 401 with `WWW-Authenticate: Basic realm="Uchiyomi"` (what makes the extension send Basic), a
  # presented credential that does not resolve is 401 even beside a valid cookie, the eleventh failed
  # credential from one address in five minutes is 429 with Retry-After, a read-only token on a PUT is 403,
  # and anything the token's account may not see is 404, never 403. JSON answers carry
  # `Cache-Control: no-store` because both clients send a max-age request directive against a disk cache.
  /api/v1/libraries:
    get:
      tags:
        - komga
      summary: The libraries this token may open (the extension's log-in probe and its Libraries filter).
      operationId: getApiV1Libraries
      description: >-
        The library grants and the age cap apply; an 18+ library is listed only to a token minted with
        `showAdult`, because the extension shows every library it is told about and has no reveal of its own.
        `root` is always empty and `unavailable` always false.
      security:
        - komgaApiKey: []
        - komgaBearer: []
        - komgaBasic: []
        - komgaSession: []
      responses:
        "200":
          description: An array of KomgaLibrary.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KomgaLibrary" }
        "401":
          description: Not authenticated
        "429":
          description: "too_many_requests { message } with Retry-After -- ten failed credentials from this client address in five minutes; a request with no credential or with only the cookie is never counted."
  /api/v1/series:
    get:
      tags:
        - komga
      summary: "Browse series: the extension's Popular (sort=metadata.titleSort,asc), Latest (sort=lastModifiedDate,desc) and search."
      operationId: getApiV1Series
      description: >-
        A Spring page of KomgaSeries over the series this token may browse (an 18+ library is left out unless
        the token has `showAdult`; the age cap and library grants apply). Filters arrive either comma-joined in
        one parameter (`library_id=a,b`) or repeated (`read_status=UNREAD&read_status=IN_PROGRESS`); both
        forms are accepted for every list parameter and flattened. `tag` filters genres and `publisher` the
        author field, since that is where the DTO presents them; `author` is `name,role` and the role is
        dropped. `status=ENDED` also matches Completed / Complete / Finished, ABANDONED matches Cancelled /
        Dropped, HIATUS matches On Hiatus / Paused. `relevance` and any unknown sort are title order; `unread`
        and `favourites` are not offered. `unpaged=true` answers the largest page (500). A filter the query
        cannot express is refused rather than widened.
      parameters:
        - { name: search, in: query, required: false, schema: { type: string }, description: Title search; empty means none. }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0 }, description: 0-based. }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500 }, description: Default 20. }
        - { name: unpaged, in: query, required: false, schema: { type: boolean } }
        - { name: sort, in: query, required: false, schema: { type: string }, description: "metadata.titleSort | name | createdDate | lastModifiedDate | relevance | random, then `,asc` or `,desc`." }
        - { name: library_id, in: query, required: false, schema: { type: string }, description: Comma-joined or repeated. }
        - { name: status, in: query, required: false, schema: { type: string }, description: "ENDED | ONGOING | ABANDONED | HIATUS, comma-joined or repeated." }
        - { name: genre, in: query, required: false, schema: { type: string }, description: Comma-joined or repeated. }
        - { name: tag, in: query, required: false, schema: { type: string }, description: Comma-joined or repeated; matched against genres. }
        - { name: publisher, in: query, required: false, schema: { type: string }, description: Comma-joined or repeated; matched against the author. }
        - { name: author, in: query, required: false, schema: { type: string }, description: "`name,role`, repeated; the role is ignored." }
        - { name: read_status, in: query, required: false, schema: { type: string }, description: "UNREAD | IN_PROGRESS | READ, repeated or comma-joined." }
        - { name: deleted, in: query, required: false, schema: { type: boolean }, description: Accepted and ignored; hidden series are never listed. }
      security:
        - komgaApiKey: []
        - komgaBearer: []
        - komgaBasic: []
        - komgaSession: []
      responses:
        "200":
          description: A KomgaPage whose content is KomgaSeries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KomgaPage"
        "400":
          description: "unsupported_filter { message } -- a filter the query cannot express."
        "401":
          description: Not authenticated
        "429":
          description: "too_many_requests { message } with Retry-After -- ten failed credentials from this client address in five minutes; a request with no credential or with only the cookie is never counted."
  /api/v1/series/latest:
