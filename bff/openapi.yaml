  /api/admin/series/{id}/scanlators:
    get:
      tags:
        - admin
      summary: The scanlation groups an admin can rank or block for one series, and where its preferences stand.
      operationId: getApiAdminSeriesIdScanlators
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Groups are
        gathered from the live files on disk (what each chapter was stamped with as it landed), from every
        copy in the listing the updater persisted at the last check -- primary and followed sources alike,
        never the sources themselves on a page open -- and from the names already in the effective
        preferences, so a blocked group that has vanished from the listing stays visible to be unblocked.
        `checkedAt` says how old the figures are.
