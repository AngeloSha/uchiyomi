  /api/admin/series/{id}/sources:
    post:
      tags:
        - admin
      summary: Follow another source for a series, from a candidate a fill scan found followable.
      operationId: postApiAdminSeriesIdSources
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. The
        candidate has to come from a plan POST /api/sources/fill/scan answered for this series, and the plan
        has to have found it followable: at least 90% of the chapter numbers already held were listed there
        and the verdict was ok or nothing_to_fill. A bare (source, id) pair is not accepted here. There are
        two ways into a follow -- this route, and `alsoFollow` on POST /api/sources/add (admins only as
        well) -- and both make the "same series?" judgement on the server: from a plan and the admin's own
        look here, from the add's own listing plus the candidate's title there, where the numbering must
        also agree both ways unless the title is exact on a listing of at least ten; neither takes a pair
        on trust. The series' own
        source is refused, since following it would list every chapter twice. Following a source again
        updates its series id and coverage, and a source the add-time path followed (`auto: true`) becomes
        the confirming admin's (`auto: false`). Once followed, the updater merges that source's chapter
        list with the primary's on every check.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId, source, sourceSeriesId]
              properties:
                planId:
                  type: string
                  description: From the fill scan.
                source:
                  type: string
                  description: A candidate's source id in that plan.
                sourceSeriesId:
                  type: string
                  description: That candidate's series id on the source.
      security:
        - bearer: []
      responses:
        "200":
          description: Followed. The series' full source list, primary first.
          content:
            application/json:
              schema:
                type: object
                required: [ok, sources]
                properties:
                  ok: { type: boolean }
                  sources:
                    type: array
                    items:
                      $ref: "#/components/schemas/SeriesSource"
        "400":
          description: >-
            bad_request (malformed body, or the plan is for another series); not_in_plan (that source and
            id were not among the plan's candidates); not_followable (the plan refused it, with reason and
            coverage in the body).
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
        "409":
          description: >-
            plan_stale (the plan expired or was never issued: scan again); is_primary (that is the series'
            own source -- since v0.54.0 also when it became the main source after the plan was made, by
            POST /api/admin/series/{id}/main-source); source_unavailable (the adapter is not loaded or is disabled); since v0.49.0 (#116)
            posting_order (the series is numbered by posting order, so a follower would never be merged); since
            v0.52.0 (#123) language_differs (the source is in another language than the series: the scan never
            offers one, so only a plan from before the series' language changed meets this. `message` and
            `messageSaid` (code `follow.languageDiffers`, params `theirs` and `ours`, language codes) name both,
            and `edition` is `{of, lang}`, the add route's edition to add instead. When the series' work already
            holds an edition that may follow the source, `edition` also carries `existing: {id, lang}`, that
            edition's series id and language, and the sentence is `follow.languageDiffersEdition` (params `theirs`,
            `ours` and `edition`): follow it on that edition instead).
  /api/admin/series/{id}/main-source:
    post:
      tags:
        - admin
      summary: Make a source the series follows its main source (since v0.54.0).
      operationId: postApiAdminSeriesIdMainSource
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Only a source the
        series already follows can be promoted: its follow is the "same series?" judgement already made, and the
        sweep already merges its chapters, so the switch changes which source wins a tie and the label, not which
        chapters arrive. The pair (`source_id`, `source_series_id`) moves under the series row's lock and the promoted
        row leaves the followers. The old main stays as the last follower (`old: kept`) when it still carries the
        series -- standing usable or cooling -- and the follower cap has room; otherwise it is dropped with its listing
        rows, and the chapters capped against it get their tries back for the new main. A series whose language was
        only inferred from its main source is pinned to it when the new main would say otherwise (`langPinned`).
        The series' last-check figures, folder, cover, reading direction and floor stay. Audited as
        `series.main_source` {id, title, from, fromRef, to, toRef, old, coverage, addedBy, langPinned?, via:
        manual}. The answer's `sources` is read before the listing refresh the switch starts (through the new main).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceId]
              additionalProperties: false
              properties:
                sourceId:
                  type: string
                  description: A source the series follows.
                old:
                  type: string
                  enum: [auto, keep, drop]
                  description: >-
                    What becomes of the old main: `auto` (the default) keeps it while it still carries the series;
                    `keep` and `drop` decide whatever its standing.
      security:
        - bearer: []
      responses:
        "200":
          description: Switched. The series' full source list, the new main first.
          content:
            application/json:
              schema:
                type: object
                required: [ok, from, to, old, sources]
                properties:
                  ok: { type: boolean }
                  from: { type: [string, "null"], description: The old main source. }
                  to: { type: string }
                  old: { type: string, enum: [kept, dropped] }
                  langPinned: { type: string, description: "The language the series was pinned to, when the switch would otherwise have changed it." }
                  sources:
                    type: array
                    items:
                      $ref: "#/components/schemas/SeriesSource"
        "400":
          description: bad_request (no sourceId, or an `old` it does not know).
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: not_found -- not a series this admin may see.
        "409":
          description: >-
            Refused, with `message` and `messageSaid` (Said): is_main (main.isMain); not_followed (main.notFollowed);
            posting_order (numbering.postingRefusal: the series takes its chapters from its numbering source alone);
            renumber_pending (main.renumberPending: a renumber waits for a review, or is being applied); busy
            (renumber.checking: a check, the sweep or a listing refresh is inside the series right now);
            source_unavailable (main.unavailable: not loaded, switched off, or beyond the admin's age reach);
            moved (main.moved: the main source changed meanwhile); language_differs (the follow route's refusal:
            follow.languageDiffers or follow.languageDiffersEdition, with `edition: {of, lang, existing?}`).
  /api/admin/series/{id}/sources/{sourceId}:
    delete:
      tags:
        - admin
      summary: Stop following a source for a series.
      operationId: deleteApiAdminSeriesIdSourcesSourceId
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Chapters
        already downloaded from it stay; the listing rows it carried are dropped at once, so nothing can be
        fetched through it before the next check. The primary cannot be removed this way; it is not a
