      summary: Probe one source right now, ignoring its cooldown, and diagnose it; writes no health.
      operationId: postApiAdminSourcesIdTest
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Answers
        {ok, timedOut, checks, probe, diagnosis, canClear}. `probe` is always present: {httpStatus?, finalUrl?,
        transport?, looksHtml?, adapterOk, needsSolver}. For a source with a homepage the homepage is fetched
        first and `httpStatus` is its status (0 when a request was made and no HTTP answer came back); an
        extension source has no homepage to ask, so that step is skipped and `httpStatus` is absent, not 0
        (since v0.37.0). A live `adapterOk: true` outranks the stored error, so a passing extension source no
        longer carries an old Cloudflare verdict. `diagnosis` is {code, reason, fix, actor, silent, needsProbe}: the `fix` for a
        stored "Cloudflare bypass currently disabled" (code `cf_challenge`) names the engine's own switch by
        the shipped compose names (uchiyomi-suwayomi, http://uchiyomi-flaresolverr:8191), never the
        development stack's; and since v0.37.0 this route reads the source's slow streak, so `code` can be
        `too_slow` ("This source answers, but more slowly than it is given.") here as well as from Discover's
        health view, with a `fix` naming the configured SOURCE_LATEST_TIMEOUT_MS budget in seconds.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
