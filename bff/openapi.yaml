  /api/sources:
    get:
      tags:
        - sources
      summary: Every source the caller can reach and may be shown, with health status and a one-sentence note.
      operationId: getApiSources
      description: >-
        Since v0.42.0 this list honours the 18+ reveal as well as the age cap: without `adult=1` a source
        whose extension declares itself adult is left out, the same way an 18+ library is left off every
        other listing. The age cap is unchanged and is the permission — a source above the caller's
        `max_age_rating` is absent whatever `adult` says, and every by-id route still answers 403 for it.
      parameters:
        - name: adult
          in: query
          required: false
          schema:
            type: string
          description: "`1` to include adult sources in the list. Absent means hidden."
      security:
        - bearer: []
      responses:
        "200":
          description: >-
            { content: [Source], hiddenAdult }. Only the fields added in v0.33.0 and v0.42.0 are described
            here; the rest of the shape is the registry entry (id, name, lang, latest, popular, used,
            status, blockedUntil, note). Since v0.49.1 `noteCode` is the diagnosis code whose sentence `note` is
            (a reason belongs to its code), so a client can say it in its reader's language; null with `note`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  hiddenAdult:
                    type: integer
                    description: >-
                      How many sources the caller may reach but is not being shown right now, i.e. the adult
                      ones `adult=1` would add back. 0 with `adult=1`, and 0 for an account capped below 18,
                      which never had those sources to hide and is deliberately not told the number. Discover
                      renders the "Show 18+" chip when this is above 0 (or when the reveal is already on, or
                      when the account holds an 18+ library), so an install with adult providers and no adult
                      shelf still has a way to ask for them back.
                  content:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        extension:
                          description: >-
                            For an extension source (`sw:` id): the installed extension package it came
                            out of, so one multi-language extension's variants can be shown as one
                            provider. `pkgName` is the APK package name as the engine reports it; when the
                            engine did not say, `pkgName` is null and `name` is the display name with its
                            trailing language tag (` (EN)`, ` (PT-BR)`, ` (ALL)`) stripped. Since v0.52.0
                            every MangaDex language (`mangadex`, `mangadex-es-419`, ...) carries
                            `{pkgName: "mangadex", name: "MangaDex"}`, so the family is one provider too.
                            Null for the other built-in, pack and custom-site sources.
                          oneOf:
                            - type: object
                              required: [pkgName, name]
                              properties:
                                pkgName:
                                  type: [string, "null"]
                                name:
                                  type: string
                            - type: "null"
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/sources/search:
    get:
      tags:
        - sources
      summary: Search one source.
      operationId: getApiSourcesSearch
      description: >-
        Since v0.42.0 an adult source answers `{ content: [] }` without being asked while the 18+ reveal is
        off — an empty page, deliberately not a 403, because the hide is a preference and the same account
        with `adult=1` gets the results. A source above the caller's age cap is still refused with 403.
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: adult
          in: query
          required: false
          schema:
            type: string
          description: "`1` to search an adult source. Absent means it answers empty."
      security:
        - bearer: []
      responses:
        "200":
          description: >-
            { content: [SourceSeries] }. Since v0.52.0 (#72) each item says what it is to the library in its source's language: `inLibrary` when a
            series holding the title is in that language (a source in every language owns it in any),
            `libraryLangs` the languages the library holds the title in, `librarySeriesId` the entry to open (the
            one in this language, else the first), and `lang` the language the source declares (null when it says
            nothing).
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/sources/fill/scan:
    post:
      tags:
        - sources
      summary: Find a series' missing chapters and which sources could supply them; answers with a short-lived planId.
      operationId: postApiSourcesFillScan
      description: >-
        Each candidate's count, first and last describe one copy per chapter number, chosen under the
        series' release preferences with patience off, so a fill of [n] lands one file. `following` lists
        the source ids the series already follows (see POST /api/admin/series/{id}/sources), on the
        too_few_chapters early answer as well.
        This route deliberately does NOT honour the 18+ reveal (v0.42.0): it is an explicit act on a series
        already in the library, and a series whose own source is adult has to stay fillable whatever the
        chip says. The age cap still applies — a source above it is never a candidate. Since v0.49.0 (#116) a
        series numbered by posting order is scanned on its own source alone, in the numbers the series keeps;
        every other source it follows is listed with `why: posting_order` and never asked, and no other source
        is searched. Since v0.49.1 each source is asked under the series' title, up to three of its other names
        (GET /api/admin/series/{id}/alt-titles) and then `altTitle`, one at a time until one finds it; a hit for an
        other name counts only when its title EQUALS that name (never by containment). Reading the series' own
        source here keeps the other names its description lists.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                seriesId:
                  type: string
                altTitle:
                  type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  following:
                    type: array
                    items: { type: string }
                    description: Source ids the updater already merges into this series, in the order they were followed.
                  done:
                    type: boolean
                    description: >-
                      v0.48.4. False while sources are still being asked; read the rest from
                      GET /api/sources/fill/scan/{id}. Always true on the too_few_chapters early answer.
                  scanId:
                    type: string
                  asking:
                    type: array
                    items:
                      type: object
                      properties:
                        source: { type: string }
                        name: { type: string }
                    description: The sources the scan is waiting for right now.
                  waiting:
                    type: integer
                    description: Sources that have not had a turn yet.
                  failed:
                    type: string
                    description: Present when the scan itself broke, rather than one source.
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
        "429":
          description: "busy: this person already has three scans asking the sources"
  /api/sources/fill/scan/{id}:
    get:
      tags:
        - sources
      summary: The rest of a Find missing chapters scan, as each source answers (v0.48.4).
      operationId: getApiSourcesFillScanById
      description: >-
        Same shape as the POST that started the scan. Read it until `done` is true; the dialog asks every two
        seconds. Answers only the person who started the scan.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope or account permission"
        "404":
          description: "scan_gone: not this person's scan, or a finished one that aged out with its plan"
  /api/sources/fill:
    post:
      tags:
        - sources
      summary: Fetch specific missing chapter numbers from a source quoted in a plan.
      operationId: postApiSourcesFill
      description: >-
        The plan (POST /api/sources/fill/scan) is the authorisation: only numbers it quoted for that source can be
        asked for, at most 300 at once. Since v0.49.0 (#116) a series waiting for its renumbering answers 409
        `renumber_pending`, and one numbered by posting order refuses a fill from any source but its own with 409
        `posting_order` -- another site's chapter numbers do not line up with its posts.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                planId:
                  type: string
                source:
                  type: string
                sourceSeriesId:
                  type: string
                numbers:
                  type: array
                  items:
                    type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
        "409":
          description: "`plan_stale` (scan again), `disabled` (the source is switched off), `busy` (a download for the series is running), or since v0.49.0 `renumber_pending` / `posting_order` (above)"
        "429":
          description: "`blocked`: the source is in a cooldown"
  /api/sources/fetch:
    post:
      tags:
        - sources
      summary: Fetch chapters the sources list but this server lacks, by number, from the last listing.
      operationId: postApiSourcesFetch
      description: >-
        The listing (GET /api/series/{id}/listing) is the authorisation: only a number the sources list can
        be asked for, and what is fetched is the copy the release rules choose now -- the listing is refreshed
        first (a check with no downloads); a source that does not answer leaves the last listing standing.
        A listing row from a source the series no longer follows is `source_unavailable`. A held number is
        fetched regardless of patience; a number only blocked groups released is refused (`blocked_group`)
        -- unblock the group and check again. A manual fetch resets the chapter's retry cap. Same permission
        as the fill: an account with `canDownload: false` is refused by the plugin, and a source outside the
        account's age cap answers 403. Progress is on GET /api/sources/jobs under `folder`.
        `picks` names specific copies instead (from GET /api/series/{id}/versions): a pick is authorised by a
        matching entry among the number's stored copies (`not_listed` otherwise; the skipped entry then
        carries `source` and `sourceId`), its source must be followed and available, and it IGNORES the group
        rules including the blocklist -- an explicit choice of one copy -- but never `already_here`. A number
        named in both lists is fetched as its pick; a second pick for the same number is skipped as
        `duplicate`. At least one of `numbers` / `picks`, at most 300 combined. `floored: true` (since
        v0.48.3) reads `numbers` as WHOLE chapters -- 12 takes every listed chapter from 12 up to 13, so 12 and
        12.5 -- which is what the fill scan's numbers are; a whole number nothing lists is `not_listed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seriesId]
              properties:
                seriesId:
                  type: string
                numbers:
                  type: array
                  maxItems: 300
                  items:
                    type: number
                    minimum: 0
                    maximum: 1000000
                picks:
                  type: array
                  maxItems: 300
                  items:
                    $ref: "#/components/schemas/Pick"
                floored:
                  type: boolean
                  description: Read `numbers` as whole chapter numbers (since v0.48.3).
      security:
        - bearer: []
      responses:
        "200":
          description: "Started. `skipped` lists the numbers that were not fetchable and why."
          content:
            application/json:
              schema:
                type: object
                required: [ok, started, folder, total, skipped]
                properties:
                  ok:
                    type: boolean
                  started:
                    type: boolean
                  folder:
                    type: string
                  total:
                    type: integer
                  skipped:
                    type: array
                    items:
                      $ref: "#/components/schemas/SkippedNumber"
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
        "409":
          description: "`nothing_to_fetch` (every number was skipped; `skipped` says why), `busy` (a download for the series is running -- since v0.37.0 that includes a bulk Fetch newest run being inside this series, for this series only and only while it is on it, and since v0.49.0 a slow-archive chapter in flight, which the message names) or, since v0.49.0 (#116), `renumber_pending` (the series waits for an admin to review its renumbering and nothing downloads until then; asked again after the listing refresh, which is where the detector first marks one)"
  /api/sources/search-all:
    get:
      tags:
        - sources
      summary: Search every enabled source at once, answering before the slow ones do.
      operationId: getApiSourcesSearchAll
      description: >-
        By default groups results by normalized title (one card, every provider that has it — what Discover
        uses). With `groupBy=source`, groups by provider instead (one rail per source, mirroring Mihon's
        global search) — used by the import review sheet's manual-search screen, where which specific source
        a pick comes from matters more than which other sources also carry the same title.
        Since v0.40.0 the answer does not wait for every source: it comes when every source the caller may
        reach has answered, or `wait` ms have passed (clamped to `SEARCH_FIRST_ANSWER_MS`, default 6000;
        absent means that maximum), or `SEARCH_GRACE_MS` (default 1500) after the first source with results
        — whichever is first. `sources` lists every source the caller may reach with its state (`ok`,
        `empty`, `timeout`, `failed`, `pending`, or `skipped` with `why` `disabled` / `cooldown` for a source
        that was not asked at all); `pending` counts the ones still being asked and `asked` the ones asked at
        all. While `pending` is above 0, repeat the same request with a short `wait` (`wait=0` reads what
        is there without waiting): the sources keep answering into a server-side entry, keyed by the
        normalised term and kept `SEARCH_TTL_MS` (default 300000), which is why the same search typed again
        by anyone answers at once. The entry is shared but every answer is filtered to the caller's own
        reachable sources, so an age-capped account neither starts nor sees an adult source another
        account's search asked. Each source is bounded at `SEARCH_SOURCE_MS` (default 20000; the solver
        budget for a source behind Cloudflare): a source that outruns it is recorded as slow, one that
        throws as failed, as the newest listing records them.
        Since v0.42.0 the same filtering covers the 18+ reveal: without `adult=1` an adult source is
        neither asked nor listed in `sources`, so no outbound query goes to it and nothing it answered for
        another account is read back here.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: adult
          in: query
          required: false
          schema:
            type: string
          description: "`1` to include adult sources in the fan-out. Absent means they are not asked."
        - name: source
          in: query
          required: false
          schema:
            type: string
          description: >-
            Ask only this source id (what Discover sends while it is filtered to one source). Narrows the
            fan-out within the sources the caller may be shown, never past them: an id outside that set
            (an adult source without `adult=1`, one above the account's age limit, an unknown id) asks
            nobody and answers the empty shape. Absent means every source.
        - name: groupBy
          in: query
          required: false
          schema:
            type: string
            enum: [source]
          description: Omit for the default title-grouped shape.
        - name: wait
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: >-
            The most milliseconds to hold the answer for, clamped to `SEARCH_FIRST_ANSWER_MS` (6000); absent
            means that maximum. `0` answers at once with whatever the entry already holds.
      security:
        - bearer: []
      responses:
        "200":
          description: >-
            `content` is the title-grouped list (or the per-source rails with `groupBy=source`), exactly as
            before v0.40.0; the three fields beside it are the search's progress. Since v0.52.0 a title-grouped
            card is `inLibrary` only when the library holds the title in EVERY provider's language, so a card
            with an English and a Spanish provider stays addable while only English is here; it carries
            `libraryLangs` and `librarySeriesId` when the title is held at all, and each of its `providers` its
            own `lang` (declared, or null) and `inLibrary`. A per-source rail's results say the same per item.
          content:
            application/json:
              schema:
                type: object
                required: [content, sources, pending, asked]
                properties:
                  content:
                    type: array
                    items: {}
                  sources:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchSourceLine"
                  pending:
                    type: integer
                    description: How many of the caller's sources are still being asked.
                  asked:
                    type: integer
                    description: How many of the caller's sources were asked at all (everything but the skipped).
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/sources/latest:
    get:
      tags:
        - sources
      summary: A source's newest titles, cached ten minutes per page.
      operationId: getApiSourcesLatest
      description: >-
        Since v0.42.0 an adult source answers `{ content: [] }` while the 18+ reveal is off, without being
        asked — the same answer a disabled source gives, and deliberately not a 403: the hide is a
        preference, the age cap is the permission and still answers 403 by id.
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: adult
          in: query
          required: false
          schema:
            type: string
          description: "`1` to browse an adult source. Absent means it answers empty."
      security:
        - bearer: []
      responses:
        "200":
          description: >-
            { content: [SourceSeries] }. Since v0.52.0 (#72) each item says what it is to the library in its source's language: `inLibrary` when a
            series holding the title is in that language (a source in every language owns it in any),
            `libraryLangs` the languages the library holds the title in, `librarySeriesId` the entry to open (the
            one in this language, else the first), and `lang` the language the source declares (null when it says
            nothing).
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/sources/popular:
    get:
      tags:
        - sources
      summary: A source's own popularity ranking, when it offers one.
      operationId: getApiSourcesPopular
      description: >-
        Every guard on GET /api/sources/latest applies identically, including the v0.42.0 18+ hide.
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: adult
          in: query
          required: false
          schema:
            type: string
          description: "`1` to browse an adult source. Absent means it answers empty."
      security:
        - bearer: []
      responses:
        "200":
          description: >-
            { content: [SourceSeries] }. Since v0.52.0 (#72) each item says what it is to the library in its source's language: `inLibrary` when a
            series holding the title is in that language (a source in every language owns it in any),
            `libraryLangs` the languages the library holds the title in, `librarySeriesId` the entry to open (the
            one in this language, else the first), and `lang` the language the source declares (null when it says
            nothing).
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/sources/jobs:
    get:
      tags:
        - sources
      summary: Downloads in progress and failed ones (a failed job is never swept; it carries a reason).
      operationId: getApiSourcesJobs
      description: >-
        One card per series folder: `{folder, title, total, done, status, origin, reason?, finishedAt?,
        seriesId?, switched?: [{number, from, to, why?}], partial?, left?, cover?}`. `seriesId` is the library
        id of the series this job is filling: the card's own, or since v0.49.0 the id of the series row that
        holds the folder, so a Fetch, fill or refetch card names its series too. An add that starts a download
        is answered before that row exists, so this is where "Open in library" gets the id from (it is absent
        until the first chapter has been scanned in, and for good on an add whose first chapter never landed).
        Since v0.49.0 every viewer gets the cards of the series they can browse (library access, age cap and
        the 18+ hide; before, cards were filtered only while the 18+ hide was on); a card whose folder is not
        a series yet goes to the account that started it and to admins, and the account that started a job
        keeps its card wherever the series lands -- without `seriesId` and `cover` when it is a series that
        account may not browse; a failed card (`status: error`) goes only to the account that started it and
        to admins; `origin` says what kind of job it is (`add`, `fetch`, `fill` or `refetch`); `left` on a
        failed `fetch` or `add` card lists the chapters it did not land (ascending, at most 300), which is what
        a Try again sends to POST /api/sources/fetch -- a fill's or a refetch's chapters are not ones that route
        can take again, so those cards carry none; and an add's card carries `cover: {source, url}`, its
        source's cover, for drawing before the series has a thumbnail of its own. `switched` records a chapter completed from a
        different followed source after its first copy failed; `why` is `rate_limited` when a 429 caused
        the switch and may be absent for an ordinary failure. `partial` counts chapters this job saved with
        repair placeholders. Both additions are absent when empty. An add
        that named `alsoFollow` candidates carries `autoFollow` on its card as well -- `{done, results}`
        with `done: false` and no results while the other sources are being asked, then one entry per
        candidate in the order given: `{source, name, theirTitle, followed, coverage, why}` where `why`
        is one of `followed`, `numbering_differs` (it lists under 90% of the primary's numbers or, when the
        judgement is two-way -- a containing title, or a primary listing fewer than ten -- the primary lists
        under 90% of its numbers; `coverage` is then the lower of the two shares), `title_differs` (its own
        title is not this series'), `unreachable` (threw or timed out), `too_few_listed` (the primary lists
        under three numbers, nothing asked), `not_tried` (the 90-second wall ran out first, or the judgement
        itself failed before any source was asked -- every candidate then reads so, never an empty list),
        `cap` (the series already follows two sources), `unavailable` (the primary itself, disabled, in a
        cooldown, not loaded, or outside the caller's age cap) or, since v0.52.0 (#123), `language_differs` (it
        is in another language than the series; nothing was asked). A nothing-yet add with candidates gets a
        card with `total: 0` and `status: done` purely to carry this. Results survive the dialog closing:
        the card lives a day after the judgement ends, and cannot be dismissed (DELETE answers 409
        `running`) until `autoFollow.done`. Since v0.47.0 (#82) a finished card stays listed for a day
        rather than five minutes, every card carries `startedAt` and `mine` (whether this account started
        it, which is who may cancel it besides an admin), a card whose Cancel was pressed carries
        `cancelRequested` until the chapter in flight is done and then ends `done` with `cancelled: true`
        and a `reason` saying how far it got; and `runs` lists the server's own runs -- the chapter sweep,
        the library repair, a bulk "Fetch newest" -- as one card each, to an admin, and a bulk run to the
        account that started it as well. Since v0.49.0 a repair's card also carries `repairKind` (full for a run of
        every step -- the nightly, Tasks -> Run now, Health's Fix all issues -- else fix_short, fill, retry or
        steps:...), `label` (the series title or source name a one-row Health press is about),
        `number` (the chapter's, for a one-chapter run) and `seriesId` (the series `label` names); `label`,
        `number` and `seriesId` are left out for a viewer who may not list that series (the 18+ hide), as
        `current` is.
        Since v0.48.1 the response also carries `activity: {active, recent}` -- every chapter the server is
        downloading or finished in the last day, whatever started it: `{id, seriesId, folder, title, number, source,
        origin: add|fetch|fill|check|sweep|repair|bulk|refetch|server|archive, status: queued|downloading|done|partial|failed,
        startedAt, finishedAt?, pages?, reason?, mine}`, limited to the series this viewer can browse (a folder that
        is not a series yet: its starter and admins). Since v0.49.0 `recent` survives a restart: every finished
        chapter is also written down, kept a week, and the last day of it (at most 500 entries) is read back when
        the server starts, with fresh `id`s. Also since v0.49.0 (#117) the response carries `archive`
        (ArchiveView): the slow archive's queue, its rows limited to the series this viewer can browse and
        filtered per request (never one viewer's answer replayed to another); its chapters are in `activity`
        with origin `archive`. Since v0.49.1 a `partial` chapter that is whole now reads `done`, and the slow
        archive's first chapter of a series the library holds nothing of is listed once the library holds it.
        Since v0.49.1 a `reason` comes with its codes (Said, beside the unchanged English): a card's `reasonSaid`
        (Said[], `job.*`, a source's name and a site's own error as parameters), a run's `reasonSaid` (Said,
        `run.*`), and an activity entry's `reasonSaid` (Said[], `activity.*`) where the server wrote the reason --
        a download's own error has none, and is shown as sent.
      security:
        - bearer: []
      responses:
        "200":
          description: Download job cards.
          content:
            application/json:
              schema:
                type: object
                required: [content]
                properties:
                  archive:
                    $ref: "#/components/schemas/ArchiveView"
                  content:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      required: [folder, title, total, done, status]
                      properties:
                        folder: { type: string }
                        title: { type: string }
                        total: { type: integer }
                        done: { type: integer }
                        status: { type: string }
                        reason: { type: string }
                        finishedAt: { type: integer }
                        origin:
                          type: string
                          enum: [add, fetch, fill, refetch]
                          description: >-
                            Since v0.49.0: what kind of job this is -- an add (and a nothing-yet add's carrier
                            card), a Fetch, a fill from "Find missing chapters", or an admin's Fetch again.
                        seriesId:
                          type: string
                          description: >-
                            The series this job is filling: the card's own, else the series row holding the
                            folder (since v0.49.0). Absent while an add's first chapter has not been scanned
                            in (it is answered before the row exists), and for good when it never lands; also
                            absent on a card shown to its starter in a series they may not browse.
                        switched:
                          type: array
                          items:
                            $ref: "#/components/schemas/DownloadSwitch"
                        partial:
                          type: integer
                          minimum: 0
                          description: Chapters in this job saved with repair placeholders.
                        startedAt: { type: integer }
                        mine:
                          type: boolean
                          description: This account started the job, so it may cancel it (an admin may cancel any).
                        cancelRequested:
                          type: boolean
                          description: Cancel was pressed; the job stops after the chapter in flight.
                        cancelled:
                          type: boolean
                          description: The job stopped because of a Cancel. It ends `done`, with `reason` saying how far it got.
                        left:
                          type: array
                          maxItems: 300
                          items: { type: number }
                          description: >-
                            Since v0.49.0, on a failed `fetch` or `add` job: the chapters it did not land,
                            ascending -- what a Try again sends to POST /api/sources/fetch as `numbers`. Empty when
                            every chapter landed and the library scan is what failed; absent on a fill or a
                            refetch, whose chapters that route cannot take again.
                        cover:
                          type: object
                          required: [source, url]
                          properties:
                            source: { type: string }
                            url: { type: string }
                          description: >-
                            Since v0.49.0, on an add's card: the cover its source gave, for GET
                            /img/sources/cover, until the series has a thumbnail of its own.
                  runs:
                    type: array
                    description: >-
                      The server's own runs, one card each: `sweep` (checking every series for new chapters),
                      `repair` (the library repair; `done`/`total` count its steps and `step` names the one it
                      is on), `newest` (a bulk "Fetch newest") and, since v0.49.1, `find_sources` (Find other
                      sources: `done`/`total` count series, `followed` the sources it followed, and it downloads
                      nothing). An admin sees every run, the account that started a bulk run sees that one (never a
                      find_sources run, which is an admin's alone); nobody else sees any. A finished run stays listed for a
                      day. `current` is the series it is inside, left out when this viewer may not list that
                      series (since v0.49.0 for every viewer, not only under the 18+ hide).
                    items:
                      type: object
                      additionalProperties: false
                      required: [kind, startedAt, status, done, total, fetched, failed, mine]
                      properties:
                        kind: { type: string, enum: [sweep, repair, newest, find_sources] }
                        startedAt: { type: integer }
                        finishedAt: { type: integer }
                        status: { type: string, enum: [running, done, cancelled, error] }
                        done: { type: integer, minimum: 0 }
                        total: { type: integer, minimum: 0 }
                        fetched: { type: integer, minimum: 0, description: Chapters it saved. }
                        failed: { type: integer, minimum: 0, description: Chapters that would not save. }
                        current:
                          type: object
                          properties:
                            id: { type: string }
                            title: { type: string }
                        step: { type: string }
                        cancelRequested: { type: boolean }
                        reason: { type: string }
                        mine: { type: boolean }
                        repairKind: { type: string, description: "Since v0.49.0, a repair: which run it is -- full (every step: the nightly, Tasks -> Run now, Health's Fix all issues), fix_short, fill, retry, or steps:<a+b...>[:now]." }
                        label: { type: string, description: "Since v0.49.0, a repair: the series title or source name a one-row Health fix is about. Left out, with number and seriesId, for a viewer who may not list that series, and whenever current is." }
                        number: { type: number, description: Since v0.49.0, a repair about one chapter -- its number. }
                        seriesId: { type: string, description: "Since v0.49.0, a repair: the series `label` names, when it names one." }
                        followed: { type: integer, minimum: 0, description: "Since v0.49.1, a find_sources run: the sources it has followed so far, across its series." }
                        waiting: { type: string, enum: [sweep, repair, check], description: "Since v0.49.1, a find_sources run: what it waits on before its next series while it waits -- a chapter sweep, a library repair or the daily source check (GET /api/admin/sources/find's run.waiting). Absent otherwise; `current` is then still the series it did last." }
                        mode: { type: string, enum: [replace], description: "Since v0.54.0, a find_sources run in replace mode." }
                        promoted: { type: integer, minimum: 0, description: "Since v0.54.0, a Replace run: the series it has moved to another main source so far." }
                        left: { type: integer, minimum: 0, description: "Since v0.54.0, a Replace run: the series still on the source it replaces, read again after each series." }
                        turnedOff: { type: boolean, description: "Since v0.54.0, a Replace run that has ended: whether that source is switched off." }
                        sourceId: { type: string, description: "Since v0.54.0, a find_sources run over one source's series (a Replace run always): that source, as the run's summary names it (GET /api/admin/sources/find)." }
                        sourceName: { type: string, description: "Since v0.54.0, with sourceId: that source's display name, or its id when it is not loaded." }
                        downloads: { type: boolean, enum: [false], description: "Since v0.49.0: a run that cannot download a chapter (a solver reset, a page count, names, directions, or a reset of failed chapters that names no source and is not `now`). It stays a server task but does not turn the Library ring. Absent: it may download." }
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/sources/preview:
    get:
      tags:
        - sources
      summary: The chapters of a series on a source, for reading one before adding it.
      operationId: getApiSourcesPreview
      description: >-
        Since v0.47.0 (#91). The add dialog's own listing of that series (cached ten minutes, one copy per
        number, as an add would take it), named by NUMBER: no chapter id and no URL is returned, and the page
        routes take nothing else. Nothing is written. Refused (403 `age_limited`) for an account with an age
        limit, 403 `disabled` for a disabled source, 429 `cooldown` for one in a cooldown, and 502
        `unreadable` when the source lists nothing readable; the messages are generic, never the site's own.
      parameters:
        - { name: source, in: query, required: true, schema: { type: string } }
        - { name: sourceId, in: query, required: true, description: The series' id on the source, as search returned it., schema: { type: string } }
      security:
        - bearer: []
      responses:
        "200":
          description: The chapters.
          content:
            application/json:
              schema:
                type: object
                required: [title, content]
                properties:
                  title: { type: string }
                  content:
                    type: array
                    items:
                      type: object
                      required: [number]
                      properties:
                        number: { type: number }
                        title: { type: [string, "null"] }
                        scanlator: { type: [string, "null"] }
        "400":
          description: No source, or no series named
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission, an age limit, or a disabled source"
        "429":
          description: The source is in a cooldown
        "502":
          description: The source lists nothing readable
  /api/sources/preview/pages:
    get:
      tags:
