  /api/admin/extensions/refresh:
    post:
      tags:
        - admin
      summary: Re-read the extension repositories now.
      operationId: postApiAdminExtensionsRefresh
      description: Requires an admin account and a token carrying the admin scope. Scopes only ever restrict.
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "502":
          description: The extension engine did not answer
  /api/admin/extensions/solver:
    post:
      tags:
        - admin
      summary: Point the extension engine's own Cloudflare helper at the solver Uchiyomi uses (FLARESOLVERR_URL),
        and switch it on.
      operationId: postApiAdminExtensionsSolver
      description: "Requires an admin account and a token carrying the admin scope. Scopes only ever restrict.
        Sets the engine's flareSolverrEnabled and flareSolverrUrl; nothing restarts. Only on request, never by
        itself. Answers `{ok, enabled, wiring}`. Audited as `extension.solver` with the solver's host, never its
        address."

      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: "`not_configured` (no extension engine), `no_solver` (Uchiyomi has no FLARESOLVERR_URL to
            share) or `unsupported` (the engine has no such setting)"
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "502":
          description: The extension engine did not answer
  /api/admin/extensions/catalog/{pkgName}:
    post:
      tags:
        - admin
      summary: Install, update or uninstall an extension, or turn an installed one's sources on; its sources are
        enabled or removed to match, except sources in a hidden language, which stay off.
      operationId: postApiAdminExtensionsCatalogPkgname
      description: "Requires an admin account and a token carrying the admin scope. Scopes only ever restrict.
        The 200 body carries `sources` (how many the extension provides), `on` (switched on now) and `hidden`
        (left off because their language is hidden; see /api/admin/extensions/sources/bulk). `enable` (v0.53.0)
        asks the engine for nothing but the extension's sources and switches them on as an install would, never
        switching one off: for an extension installed in the engine's own page, which shows as installed with
        every source off. It answers 409 `no_sources` when the extension is not installed or provides no source,
        and is audited as `extension.enable`."

      parameters:
        - name: pkgName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [install, uninstall, update, enable]
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: Not found, or not visible to this account
        "409":
          description: "`enable` on an extension that is not installed, or provides no source (`no_sources`)"
        "502":
          description: The extension engine did not answer, or refused the change
  /api/admin/extensions/repos:
    get:
      tags:
        - admin
      summary: The configured extension repositories.
      operationId: getApiAdminExtensionsRepos
      description: Requires an admin account and a token carrying the admin scope. Scopes only ever restrict.
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "502":
          description: The extension engine did not answer
    post:
      tags:
        - admin
      summary: Add an extension repository by index URL.
      operationId: postApiAdminExtensionsRepos
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict.
        `url` may be the index address, an add-repo link (`mihon://add-repo?url=…`, `tachiyomi://add-repo?url=…`
        or a web `…/add-repo?url=…`, unwrapped), or an address without `https://` (added). A repository is kept
        only if it yields extensions (after one retry at the alternative index address); the answer is
        {ok, url, corrected, added, total, error?} where `added` is what THIS repository contributed.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: "`bad_url` (not an http(s) repository address) or `github_page` (a GitHub repository page: paste its index.min.json link)"
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "409":
          description: "`exists`: that repository is already added (compared without case, scheme, trailing slash or index file name)"
        "422":
          description: "`empty`: the repository yielded no extensions and was removed again (`removed: false` if that failed); `reason` carries the engine's error"
        "502":
          description: "`unreachable` (the engine's repository list could not be read; nothing was written) or `engine_refused` (the engine refused the write; `reason`)"
    delete:
      tags:
        - admin
      summary: Remove an extension repository.
      operationId: deleteApiAdminExtensionsRepos
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict.
        Removes every spelling of that repository from the engine and from the copy the scheduled extension
        check restores; {ok, removed}.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "502":
          description: "`unreachable` (the list could not be read; nothing was written) or `engine_refused`"
  /api/admin/health:
    get:
      tags:
        - admin
      summary: "Library health checks: chapter gaps, short chapters, duplicates, failing sources, frozen series, the
        solver, the library scan, downloads missing from the library, the extension engine."
      operationId: getApiAdminHealth
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict.
        {generatedAt, checks: [{id, title, status: 'ok'|'warn'|'problem', summary, note?, items}]}. A check's
        status is 'ok' exactly when none of its items is a finding: an item flagged `info` is listed for
        reference and never decides the verdict.
        Since v0.41.0 an item may also carry what can be DONE about it: `actions` (in the order they are
        shown), one or more of fix_short, confirm_short, delete, fill, retry, test, unblock, disable, merge,
        solver_reset; the id the action needs (`bookId` for a short chapter, `bookIds` for impossible chapter
        numbers, `seriesId`/`seriesIds`, `sourceId`, `keep` for the copy a duplicate pair should keep);
        `number`/`numbers` for the chapters it is about (gaps carry at most 100, impossible numbers at most
        20); and `fixed` {at, what} when something has already been decided or found -- a chapter confirmed
        short at the source, or a gap the nightly repair has already searched for -- which is what greys the
        row. fix_short, fill, retry and solver_reset are POST /api/admin/tasks/repair/run with the matching
        `only` and target; confirm_short is POST /api/admin/books/{id}/confirm-short (and `confirmed: false`
        withdraws it, which is what a row carrying `fixed` offers); delete is POST
        /api/admin/series/{id}/chapters/delete; merge is POST /api/admin/series/{id}/merge; test, unblock and
        disable are the existing POST /api/admin/sources/{id}/... routes.
        Since v0.50.0 the `saved-twice` check lists series where two sources' splits of one chapter are both on
        disk, the later group arriving after the earlier one (`warn` while it finds any); each item carries
        `bookIds` and `numbers` for the later files only (at most 20) and the `delete` action. Nothing is deleted
        by the check.
        Since v0.52.0 (#134) the `folders-twice` check is there only while the downloads folder sits inside the
        library, or the library inside it -- by path, or met by the last scan's walk however it was mounted --
        and every chapter in the inner one is scanned twice: `warn`, one item naming where, the fix in its note.
        Since v0.49.0 an item may carry `outcome`, what the last attempt at it found, from stored rows:
        {kind: 'gaps', at, why, followed, coverage, fetched, landed, sweep, capped, unfillable[], scanned} (the
        gap `detail` is now '<n> missing — <ranges>' alone; the conclusion it used to end with is here), {kind:
        'short', at, why: replaced | confirmed | no_longer_copy | source_silent | hunt_cooldown | no_searches |
        hunt_off | download_failed | partial | confirmed_by_admin, asked?, answered?, best?, hunt?, missing?,
        by?} or {kind: 'failures', firstAt (the first failure, which a Retry now no longer resets), lastAt,
        attempts, resetPending}; and `caveats` [{action, code: updates_paused | source_cooling_down |
        source_off | archiving, until?}], what an action will not be able to do, said before it is pressed. A short
        chapter saved with placeholder pages is offered confirm_short only.
        Since v0.49.0 (#115) the `sources` check reads per-stage evidence: each item adds `evidence` [{stage:
        search | chapters | pages | images, state: ok | fail | unknown, at, by: test | sweep | traffic, kind:
        error | empty | unnumbered | site_offline | rate_limited, error}] (since v0.55.1 a rate limit -- a failure
        in the words of an HTTP 429, recorded as `rate_limited`, or as `error` before -- is never a failure: the row
        is `blocked`, `cooldown.status` `rate_limited`, without `replace_source`), `tested` {at, by: test | sweep, state: pass | fail | inconclusive,
        stage} (the last live check), `diagnosis` {code, reason, fix} and `series` (how many series use the
        source), and is titled by the source's name. A confirmed failure (a failed Test or daily check, or three
        traffic failures in a row at one stage) is a finding even for a source no series uses; a test that ran
        out of time and a failure unchecked for seven days are `info`. The check carries `testMs`, how long one
        Test may take. A new check, `extension-engine` (#72), reports the extension engine: off on purpose (ok,
        one info item), not answering (warn, exactly one item), or whether its own Cloudflare helper is in use,
        with the new action `engine_solver` (POST /api/admin/extensions/solver) when the helper is off or points
        at localhost -- a finding only while an extension source is seen behind Cloudflare. It is absent when no
        engine is set up and no series depends on one.
        Since v0.49.0 (#117) a gap below an active slow archive's boundary is the archive's to fetch: a gaps item
        whose every gap is below it is `info`, with outcome `why: 'archiving'` and no `fixed`, and any gaps item
        with a gap below it carries the caveat {action: fill, code: archiving} -- the nightly repair leaves those
        numbers to the archive, and Fill now fetches them at once, at normal pace. The gaps outcome's `why` also
        reads `posting_order`: the series is numbered by posting order, so no other source is searched or
        followed for it. A new check, `numbering` (#116, "Chapter numbering"), lists each series with a
        numbering change waiting for review (the detector's proposal, an admin's choice not applied yet, or a
        remap an extension setting queued), a renumber a restart interrupted, and a series whose source the
        detector only suspects of giving different posts one number; as `info`, a series the detector numbered
        by posting order on its own in the last 14 days, and one an admin kept in its source's numbers against
        a strong verdict. Its actions are `renumber` (GET, then POST with `confirm`,
        /api/admin/series/{id}/numbering) and `keep_numbers` (POST with mode `source`); items carry `seriesId`
        and `sourceId`. The check is absent when no series has anything to say about its numbering.
        Since v0.49.1 every sentence also comes as codes (Said, beside the English, which is unchanged): a check's
        `summarySaid` and `noteSaid`, an item's `detailSaid` and, where the server wrote the title in English rather
        than naming something ("Cloudflare helper", "Downloads / (the folder itself)"), `titleSaid`; a `sources`
        item's `diagnosis` adds `fixSaid` (its `reason` is its `code`'s sentence). Moments go as ISO strings, so a
        client says them in its reader's time zone. The one detail without codes is a library-scan row carrying the
        database's own refusal of a folder, shown as it is.
        Since v0.49.1 a `sources` item whose source is failing (or turned off) and is the MAIN source of at least one
        series carries the action `find_sources` with `findSeries`, how many series a Find other sources run over
        its `sourceId` would search for (POST /api/admin/sources/find {sourceId}; the run's `total`); so does a
        `frozen-series` item whose reason is its source (no longer installed, switched off, over the source limit
        -- not the extension engine), which then names that `sourceId` too. An evidence line's `kind` and a
        diagnosis `code` can be `site_offline`: the site answered with its own offline or maintenance notice
        (reason "The site says it is offline (its own page)", fix "Wait for the site to come back, or find other
        sources for its series.") -- a failure of the source, never an empty listing.
        Since v0.52.0 (#72) the `duplicates` check counts works, not series: the language editions of one work
        share their tracker entry and are no finding. A pair whose two sides are in different languages carries
        the action `link_editions` (POST /api/admin/series/{id}/editions {with}) instead of `merge`, with the
        detail `dupes.languages` ({a, b}, language codes); every duplicates item carries `langs`, the language of
        each of its `seriesIds`.
        Since v0.53.0 every `sources` item carries `group`: `affected` (a finding on a source series use),
        `unused` (a finding on a source no series uses), `quiet` (listed for reference: a cooldown on a source
        nothing uses, a test that ran out of time, a failure unchecked for a week, an ignored finding) or `off`
        (switched off, with `offBy`: `admin` under Providers, `extension` in Admin -> Extensions, or `language`
        for a language hidden in every extension -- where it comes back on). The check lists them in that order: `affected` by series, most first, then blocked or failing
        before slow or empty; the other three by name. `state` is the row's one state -- blocked, failing, slow,
        empty, inconclusive, untested, off, or since v0.55.3 slowed -- with `stage` for failing, inconclusive and untested, and
        `cooldown` {status, until} for blocked (`until` null when no cooldown is set); `icon` is true when the
        source has an extension's logo, which GET /img/sources/icon/{id} serves. The summary counts the first two
        groups -- "3 sources your series use need a look · 5 sources nothing uses are failing", the codes
        `sources.affected` and `sources.failingUnused` with the new join `dot` (" · ") -- and with neither says
        "All sources are working" (`sources.working`), or "Nothing is failing that your library uses" while quiet
        rows are listed. The status is decided as before.
        Since v0.55.3 a source downloading at a raised pace -- one chapter at a time, at longer gaps, because its site or
        an image server it shares with another source answered 429 -- carries `slowed: true` on its row, whatever its
        state, and the detail `sources.paced` ("Downloading slowly: the site asked for fewer requests") after the rest;
        one with nothing else to say is listed for it alone, `info`, in the `quiet` group, with the state `slowed`.
        Since v0.54.0 a `sources` item whose source is switched off or failing -- a confirmed failure at the chapter
        list, the page list or the images, or the site's own offline notice at any step; not a cooldown, and not a
        failure at search alone -- and is the MAIN source of at least one series carries the action `replace_source`
        before `find_sources`, over the same `findSeries`: the Find run in replace mode (POST
        /api/admin/sources/find {sourceId, mode: replace}). `frozen-series` now also lists a series whose main source
        is loaded but switched off (`frozen.switchedOff`) or failing (`frozen.failing` {n, source, offline}: offline
        when it is the site's own offline notice) and that follows no source that can update it; a follower counts
        only while it is usable or cooling down, where before any loaded one did, a switched-off one included. Those
        rows, and every row whose reason is its source, carry `sourceId`, `findSeries` and the actions
        `replace_source` and `find_sources`; a series that still has such a follower is listed as `info` with
        `frozen.followingDown` {source, state: off|failing, names} (or `frozen.following` for a main that is not
        loaded) and the action `replace_source`, which makes that follower its main source. A main that is only
        cooling down is not listed.
        Since v0.55.0 a `frozen-series` row whose source is dropped by SUWAYOMI_MAX_SOURCES (`frozen.overLimit`: an
        extension's source, switched on, the engine answering, and not registered -- since v0.55.1 only one the last
        registration left out for want of room, as the sources overview's `overLimit` says; one the engine no longer
        offers reads `frozen.uninstalled`) carries the action `free_slot` in
        place of `replace_source` and `find_sources`, with `sourceId` and no `findSeries`: the client opens Admin ->
        Sources on that source, where a slot can be freed (no server action). Since v0.55.1 the `source` of every
        `frozen.*` sentence names the source as the rest of Health does (the loaded source's name, else the name the
        extension engine gave it, else its id), where it was the id; `sourceId` stays the key.
        A `chapter-gaps` row is about the holes at or above the series' "Latest N" start (lib_series.chapter_floor)
        alone -- `numbers` and the count are theirs, and `gaps.alsoBelowFloor` {n, start} says how many more lie
        before it -- and a series whose every hole
        lies before its start is an `info` row with no actions and the detail `gaps.belowFloor` {n, start, ranges}
        (`start` is the first chapter it was started from), counted in the summary by `gaps.beforeStart` {n}: nothing
        fetches below the start unasked, so neither the repair's gap step nor Fill now works on those holes.
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/admin/health/summary:
    get:
      tags:
        - admin
      summary: "The last Health report, boiled down for the header (since v0.48.0)."
      operationId: getApiAdminHealthSummary
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict.
        {summary: {at, worst: 'ok'|'warn'|'problem', count, headline, key, checks: [{id, title, status, summary}]}
        | null}. Never runs the checks: it answers from what GET /api/admin/health stored when it last ran, or
        what the server's own six-hourly run stored. `count` is how many checks found something, `headline` the
        worst one's "Title: summary", and `key` changes only when WHICH checks found something (or how badly)
        changes -- not when a count inside one moves -- so a client can re-show a dismissed alert exactly then.
        `summary` is null until the first report after an upgrade. Since v0.49.1 each of `checks` carries
        `summarySaid` (Said[]), worst first: the headline is `checks[0]`'s title and summary, which a client words
        from its id and those codes; a summary stored before then has none.
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
  /api/admin/health/ignore:
    post:
      tags:
        - admin
      summary: "Ignore a Health finding, or stop ignoring it (since v0.48.3)."
      operationId: postApiAdminHealthIgnore
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict.
        Body {check, key, ignored}: `check` is one of chapter-gaps, chapter-failures, sources, frozen-series,
        duplicates, outliers, downloads-missing, and `key` is the finding's `key` as GET /api/admin/health reports
        it. The server looks the finding up again and records everything it is about (every missing number of a
        gap, not only the hundred the report carries); it then reports it greyed with `ignored` and an `unignore`
        action, and stays quiet while what it is about is part of that. A finding gone for a week forgets its
        ignore. 404 {error: 'gone'} when the finding is no longer there. Short chapters use confirm-short instead.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [check, key, ignored]
              properties:
                check:
                  type: string
                  enum: [chapter-gaps, chapter-failures, sources, frozen-series, duplicates, outliers, downloads-missing]
                key:
                  type: string
                ignored:
                  type: boolean
      responses:
        "200":
          description: OK
        "400":
          description: Bad request
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "404":
          description: The finding is no longer there
  /api/admin/health/autofix:
    post:
      tags:
        - admin
      summary: "Start Health's Fix everything (since v0.55.0): one background run that drives every card it can to green."
      operationId: postApiAdminHealthAutofix
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. Body `{}`. One run
        at a time, through ten phases in order (preflight, scan, solver, sources, duplicates, numbering, chapters,
        extensions, files, recheck), each reusing what Health's own keys run: the library scan and page count; the
        repair's solver step, interrupted renumbers finished, and the engine's Cloudflare helper connected when
        Health's engine row offers it and FLARESOLVERR_URL is set; a Test of every failing, inconclusive or blocked
        source (a block cleared only after a passing Test; since v0.55.1 a rate limit is neither Tested nor its
        cooldown cleared), Replace with turnOff of every off or failing source some
        series has as its main (and of an uninstalled one) -- never for a setting (the engine, the source limit, a
        hidden language, a MangaDex language) nor behind a solver that is down -- and failing sources nothing uses
        retired; duplicate pairs in two languages linked as editions, and same-language copies merged only when their
        AniList entry, their language and their titles or chapter lists (70 %) agree, keeping the copy that still
        updates; renumbering plans applied only when the plan built at the apply is clean; the repair's failures,
        short and gap steps uncapped but paced (since v0.55.1 leaving alone every source cooling down or rate-limited
        when they begin: none of its failed chapters reset, nothing listed, fetched or searched through it, and what
        it holds back -- with every chapter a rate limit failed -- said under `clears`, never `needsYou`); extensions
        installed in a series' language for series no source carries or gaps nobody had (only that language's source
        switched on, kept only when a series now reads through it; since v0.55.1 one at a time with no cap unless
        AUTOFIX_INSTALLS sets one, until they are carried or the run's time is spent, the series' translation groups'
        packages first, then the most downloaded a day on the repository's GitHub releases, then the most updated; an
        18+ package only for a series rated 18+, after the others; never one searched in vain for the same series
        within 30 days; a miss removed at once; said in one done line, `autofix.done.tried` or
        `autofix.done.triedNone`); the later copy of a chapter saved twice deleted when the kept copy is complete, and
        impossible chapter numbers deleted, with the delete route's guards; then Health again and the summary. It
        never presses Ignore. Bounded by AUTOFIX_MAX_MINUTES and AUTOFIX_SEARCHES. Audited as `library.autofix`. 409
        `{error: busy, running}` beside another run (`autofix`), a repair (`repair`), a Find or Replace (`find`) or a
        chapter sweep (`sweep`); a repair and a Find started beside it are refused in turn.
      security:
        - bearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema:
                type: object
                required: [ok, runId]
                properties:
                  ok: { type: boolean }
                  runId: { type: string }
        "400":
          description: Bad request
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "409":
          description: "Busy: {error: busy, running: autofix | repair | find | sweep}"
    get:
      tags:
        - admin
      summary: "The Fix everything run going now, and the newest finished one (since v0.55.0)."
      operationId: getApiAdminHealthAutofix
      description: >-
        Requires an admin account and a token carrying the admin scope. Scopes only ever restrict. `{run, last}`:
        `run` the live run (null when none), `last` the newest finished one, both AutofixRun. A run still recorded as
        running after a restart reads `interrupted`. For an admin who hides 18+, a line naming a series their 18+
        switch hides is left out of `log` and of the done lines' `items`, and `current.title` with it (since v0.55.1
        by the series each names, `seriesIds`; a line from before v0.55.1, with none, is left out whatever it names).
      security:
        - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  run: { oneOf: [{ $ref: '#/components/schemas/AutofixRun' }, { type: 'null' }] }
                  last: { oneOf: [{ $ref: '#/components/schemas/AutofixRun' }, { type: 'null' }] }
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope, account permission or age limit"
