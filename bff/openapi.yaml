# Uchiyomi API -- OpenAPI 3.1.
#
# Served at /api/docs (Swagger UI) and /api/docs/json. Kept honest by bff/test/openapiCoverage.test.ts, which
# compares every registered route against this file in both directions, and docs/api.md against both.
# Generated once from the route table and then hand-maintained: add the operation here when you add the route.
openapi: 3.1.0
info:
  title: Uchiyomi API
  version: 0.55.3
  description: "Everything the web app does, it does over this API. Session JWTs are for the browser; scripts
    use a personal API token (Profile -> Connections -> API tokens), sent as `Authorization: Bearer uy_...`.
    Scopes: read (every token; GET plus the library search POST, which is a query), write (anything that changes data), admin (the /api/admin surface, which also
    needs an admin account). /img/* takes the yomi_img cookie, an API token as a Bearer, or the OPDS token
    over HTTP Basic -- so a third-party client needs ONE credential for the JSON and the pictures alike;
    /opds/* takes the OPDS token over HTTP Basic only. /api/v1/* and /api/v2/* are the Komga-compatible
    surface for Mihon's Komga extension and tracker (since v0.38.0): an API token as `X-API-Key`, as
    `Authorization: Bearer`, or as the HTTP Basic password, and the UCHIYOMI-SESSION cookie those requests
    mint -- never a password, never an OPDS token, never a session JWT. List endpoints answer { content: [...] } (the Komga routes answer
    Spring's page envelope); errors answer a non-2xx status with { error, message }. The prose guide with
    worked examples is docs/api.md."
servers:
  - url: /
    description: This server
tags:
  - name: health
    description: Liveness and readiness
  - name: auth
    description: Authentication, sessions, two-factor, single sign-on, first-run setup
  - name: library
    description: "Reading: home, series, chapters, pages, progress"
  - name: sources
    description: "Sources: find, browse and add series"
  - name: personal
    description: "Per-account data: favourites, collections, notes, tokens, trackers"
  - name: downloads
    description: Offline downloads
  - name: images
    description: Image server (cookie or OPDS Basic auth)
  - name: opds
    description: OPDS catalogue for external readers (HTTP Basic)
  - name: admin
    description: Administration (admin account and admin scope)
  - name: komga
    description: "Komga-compatible API for Mihon's Komga extension and tracker (API token as X-API-Key, Bearer or Basic password, or the UCHIYOMI-SESSION cookie)"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A session JWT from POST /auth/login, or a personal API token (uy_...). Admin routes need the
        admin scope and an admin account.
    opdsBasic:
      type: http
      scheme: basic
      description: >-
        HTTP Basic where the password is the OPDS token from POST /api/opds/token. Refused (401) while the
        account is disabled, like every other credential of a disabled account; the token is not revoked and
        works again once the account is re-enabled.
    imgCookie:
      type: apiKey
      in: cookie
      name: yomi_img
      description: Set at login so <img> tags can authenticate.
    komgaApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        A personal API token (uy_...) as the Komga extension's "API key" field sends it, on every request.
        Only on /api/v1/* and /api/v2/*. Read-only tokens browse; the tracker's PUT needs the write scope
        (403 otherwise). A token whose account is disabled, that has expired or that was revoked is a 401.
        Wins over an Authorization header, and any presented credential wins over the cookie. Ten failed
        credentials from one client address in five minutes (the /auth/login budget) and every further
        request from that address that presents a credential is 429 too_many_requests with Retry-After until
        the window ends; a request with no credential and a cookie-only request are neither counted nor
        blocked, and a valid key never counts.
    komgaBasic:
      type: http
      scheme: basic
      description: >-
        HTTP Basic where the PASSWORD is a personal API token (uy_...) and the username is ignored -- what
        the Komga extension sends after a 401 when no API key is configured. Account passwords are refused
        here on purpose: this protocol has no channel for a two-factor code, and a password path would
        bypass 2FA and the lockout. OPDS tokens and session JWTs are refused too. Because the extension only
        presents the password after a 401, a changed password is not noticed while the previous
        UCHIYOMI-SESSION cookie is valid (up to 7 days): revoke the old token, or use the API key field,
        which is sent on every request. Counted against the same failed-credential limit as komgaApiKey.
    komgaBearer:
      type: http
      scheme: bearer
      description: >-
        `Authorization: Bearer uy_...` -- a personal API token the way the rest of the API takes it, accepted
        on /api/v1/* and /api/v2/* since the v0.38.0 fix pass so a script can use one header for everything.
        API tokens only: a session JWT here is 401 ("Account sessions are not accepted here"), never
        outranked by a remembered cookie. Precedence X-API-Key, then Bearer, then Basic, then the cookie;
        counted against the same failed-credential limit as komgaApiKey.
    komgaSession:
      type: apiKey
      in: cookie
      name: UCHIYOMI-SESSION
      description: >-
        Minted by every request /api/v1/* or /api/v2/* authenticated with komgaApiKey or komgaBasic (HttpOnly;
        SameSite=Lax; Path=/; Secure only over HTTPS; Max-Age = min(7 days, the token's remaining life); no
        Domain), re-minted when absent, invalid, past half its life, or minted for another token, never on a
        401. Honoured ONLY by the Komga routes, for the requests Mihon's tracker sends with no credential at
        all. Its value names the API token row, which is re-read on every use, so revoking the token, letting
        it expire or disabling the account ends the cookie too. A cookie that does not verify counts as no
        cookie, never as a refusal -- and only the canonical value the server minted verifies
        (`v1.<tokenId>.<exp>.<mac>`, decimal exp with no leading zeros; any other spelling is no cookie).
        Named UCHIYOMI-SESSION rather than KOMGA-SESSION so a real Komga on the same host does not
        overwrite it in the phone's cookie jar. POST /auth/logout clears it from a browser too.
  schemas:
    AutofixSaid:
      type: object
      description: >-
        A sentence as a code the client words (bff lib/said.ts `autofix.*`), never English from the server. Since v0.55.1
        a line that names a series by title (`autofix.item.linked`, `merged`, `notMerged`, `renumbered`, `notRenumbered`,
        `deleted`) also carries `params.seriesIds`, the series it names.
      required: [code]
      properties:
        code: { type: string }
        params: { type: object, additionalProperties: true }
    AutofixRun:
      type: object
      description: >-
        Health's Fix everything (since v0.55.0). `by` is the starting admin's name, null for the nightly. `phase` and
        `phaseIndex` (0-based, of 10) while running; `current` is what it is on ("Now: ..."); `stopping` once Stop was
        asked and until the run reaches its safe point. `summary` once it ends: `green` (nothing but Needs you is left --
        every finding still on the page is one only a person can act on; `needsYou` may be non-empty), `again` (something
        a run could still change is left -- what this one did not get to, said in `clears` as the next run continuing --
        never for a cooldown, the sweep or Needs you alone), `done` (at most 12 kinds, the ones that matter most first,
        each with its count, its line and up to 20 `items`), `clears` (what ends by itself, with `at` where there is a
        time) and `needsYou` (per check, each with its one action: `open` {href}, `health` {check} or `settings` {key};
        a card is listed there only once every phase that works on it ran to its end in this run). `log` is the detail,
        newest last, at most 200 lines. For an admin who hides 18+, a line naming a series by title is left out when
        their 18+ switch hides one of the series it names (`params.seriesIds`, since v0.55.1, judged on the series as it
        stands, a merged-away one included), and `current.title` the same way by `current.seriesIds`; a line written
        before v0.55.1, with no ids, is left out whatever it names.
      required: [id, status, startedAt, by, phase, phaseIndex]
      properties:
        id: { type: string }
        status: { type: string, enum: [running, done, stopped, failed, interrupted] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        by: { type: string, nullable: true }
        phase:
          type: string
          nullable: true
          enum: [preflight, scan, solver, sources, duplicates, numbering, chapters, extensions, files, recheck, null]
        phaseIndex: { type: integer }
        stopping: { type: boolean }
        current:
          type: object
          properties:
            title: { type: string }
            seriesIds: { type: array, items: { type: string }, description: "Since v0.55.1: the series `title` names." }
            done: { type: integer }
            of: { type: integer }
            said: { $ref: '#/components/schemas/AutofixSaid' }
        summary:
          type: object
          properties:
            green: { type: boolean }
            again: { type: boolean }
            done:
              type: array
              items:
                type: object
                properties:
                  kind:
                    type: string
                    enum: [replaced, retired, tested, unblocked, linked, merged, renumbered, fetched, refetched, shortFixed, shortConfirmed,
                           failuresCleared, installed, uninstalled, deletedTwice, deletedOdd, scanned, resumedRenumber, solverReset, engineConnected]
                  n: { type: integer }
                  said: { $ref: '#/components/schemas/AutofixSaid' }
                  items: { type: array, items: { $ref: '#/components/schemas/AutofixSaid' } }
            clears:
              type: array
              items:
                type: object
                properties:
                  said: { $ref: '#/components/schemas/AutofixSaid' }
                  at: { type: string, format: date-time }
            needsYou:
              type: array
              items:
                type: object
                properties:
                  check: { type: string }
                  said: { $ref: '#/components/schemas/AutofixSaid' }
                  action: { type: object, additionalProperties: true }
        log: { type: array, items: { $ref: '#/components/schemas/AutofixSaid' } }
    KomgaPage:
      type: object
      description: >-
        Spring's page envelope, every one of the nine keys always present (the Kotlin client refuses a
        missing one). `number` is 0-based; `size` is 1..500 (default 20); `totalPages` is 0 for an empty
        result and `last` is true on the final page and on an empty one. An `unpaged=true` chapter list is
        the one answer that is not a page: `size` is the row count (at least 1, no 500 cap), `number` 0,
        `first` and `last` true, `totalPages` 1 (0 for an empty series).
      required: [content, empty, first, last, number, numberOfElements, size, totalElements, totalPages]
      properties:
        content: { type: array, items: {} }
        empty: { type: boolean }
        first: { type: boolean }
        last: { type: boolean }
        number: { type: integer, minimum: 0 }
        numberOfElements: { type: integer }
        size: { type: integer, minimum: 1, description: "1..500 on a page; the row count on an unpaged chapter list." }
        totalElements: { type: integer }
        totalPages: { type: integer }
    KomgaDateTime:
      type: string
      description: >-
        `yyyy-MM-ddTHH:mm:ss`, UTC, no zone letter and no milliseconds: the extension parses chapter dates
        strictly (LocalDateTime.parse) and a trailing `Z` or `.sss` would date every chapter at the epoch.
        A required date that is not known is `1970-01-01T00:00:00`.
      example: "2026-09-20T12:34:56"
    KomgaAuthor:
      type: object
      required: [name, role]
      properties:
        name: { type: string }
        role: { type: string, description: "`writer` for a series author; `translator` for a chapter's scanlation group (what the extension turns back into `scanlator`)." }
    KomgaLibrary:
      type: object
      required: [id, name, root, unavailable]
      properties:
        id: { type: string }
        name: { type: string }
        root: { type: string, description: Always empty; the on-disk path is not disclosed. }
        unavailable: { type: boolean, description: Always false. }
    KomgaSeries:
      type: object
      description: >-
        Komga's SeriesDto as both the extension and Mihon's tracker decode it, every non-null field padded.
        `metadata.status` is ENDED | ONGOING | ABANDONED | HIATUS for the statuses this server knows
        (Completed, Ongoing, On Hiatus, Cancelled and their synonyms) and otherwise the stored value
        upper-cased, which the client shows as UNKNOWN. `readingDirection` is one of LEFT_TO_RIGHT |
        RIGHT_TO_LEFT | VERTICAL | WEBTOON: the series' own direction since v0.48.0 (WEBTOON when unknown, and
        for every series before). The three read counts are real on GET /api/v1/series/{id}
        (Mihon derives UNREAD / READING / COMPLETED from them) and zero read / all unread in listings.
      required: [id, libraryId, name, url, fileLastModified, booksCount, booksReadCount, booksUnreadCount, booksInProgressCount, deleted, oneshot, metadata, booksMetadata]
      properties:
        id: { type: string }
        libraryId: { type: string }
        name: { type: string }
        url: { type: string, description: Always empty. }
        created: { oneOf: [ { $ref: "#/components/schemas/KomgaDateTime" }, { type: "null" } ] }
        lastModified: { oneOf: [ { $ref: "#/components/schemas/KomgaDateTime" }, { type: "null" } ] }
        fileLastModified: { $ref: "#/components/schemas/KomgaDateTime" }
        booksCount: { type: integer }
        booksReadCount: { type: integer }
        booksUnreadCount: { type: integer }
        booksInProgressCount: { type: integer }
        deleted: { type: boolean, description: Always false; a hidden series is a 404 here. }
        oneshot: { type: boolean, description: Always false. }
        metadata:
          type: object
          required: [status, statusLock, title, titleLock, titleSort, titleSortLock, summary, summaryLock, readingDirection, readingDirectionLock, publisher, publisherLock, ageRatingLock, language, languageLock, genres, genresLock, tags, tagsLock, totalBookCountLock]
          properties:
            status: { type: string }
            statusLock: { type: boolean }
            created: { oneOf: [ { $ref: "#/components/schemas/KomgaDateTime" }, { type: "null" } ] }
            lastModified: { oneOf: [ { $ref: "#/components/schemas/KomgaDateTime" }, { type: "null" } ] }
            title: { type: string }
            titleLock: { type: boolean }
            titleSort: { type: string }
            titleSortLock: { type: boolean }
            summary: { type: string }
            summaryLock: { type: boolean }
            readingDirection: { type: string, enum: [LEFT_TO_RIGHT, RIGHT_TO_LEFT, VERTICAL, WEBTOON] }
            readingDirectionLock: { type: boolean }
            publisher: { type: string }
            publisherLock: { type: boolean }
            ageRating: { type: [integer, "null"] }
            ageRatingLock: { type: boolean }
            language: { type: string }
            languageLock: { type: boolean }
            genres: { type: array, items: { type: string } }
            genresLock: { type: boolean }
            tags: { type: array, items: { type: string } }
            tagsLock: { type: boolean }
            totalBookCount: { type: [integer, "null"], description: Always null. }
            totalBookCountLock: { type: boolean }
        booksMetadata:
          type: object
          required: [authors, authorsLock, tags, tagsLock, summary, summaryNumber, created, lastModified]
          properties:
            authors: { type: array, items: { $ref: "#/components/schemas/KomgaAuthor" } }
            authorsLock: { type: boolean }
            tags: { type: array, items: { type: string } }
            tagsLock: { type: boolean }
            releaseDate: { type: [string, "null"], description: Always null. }
            summary: { type: string, description: The series summary again; the extension falls back to it. }
            summaryNumber: { type: string, description: Always empty. }
            created: { $ref: "#/components/schemas/KomgaDateTime" }
            lastModified: { $ref: "#/components/schemas/KomgaDateTime" }
    KomgaBook:
      type: object
      description: >-
        Komga's BookDto for one chapter. `number`, `metadata.numberSort` and the progress endpoint's numbers
        are ONE quantity, the override-aware chapter number, unrounded: the extension makes it the chapter
        number, and Mihon compares and PUTs it back in that unit. `metadata.number` is the display string.
        `name` is the chapter title or empty, never null. `media.status` is READY for a chapter whose file
        is on the server and ERROR for a tombstone (deleted from the server). `sizeBytes` is the file's size
        on disk (lib_books.size; 0 when never stamped) and `size` is Komga's text for it ("1.5 KiB", "0 B"),
        which the extension shows in its default chapter name `{number} - {title} ({size})`.
      required: [id, seriesId, seriesTitle, name, url, number, fileLastModified, sizeBytes, size, media, metadata, deleted, oneshot]
      properties:
        id: { type: string }
        seriesId: { type: string }
        seriesTitle: { type: string }
        name: { type: string }
        url: { type: string, description: Always empty. }
        number: { type: number }
        created: { oneOf: [ { $ref: "#/components/schemas/KomgaDateTime" }, { type: "null" } ] }
        lastModified: { oneOf: [ { $ref: "#/components/schemas/KomgaDateTime" }, { type: "null" } ] }
        fileLastModified: { $ref: "#/components/schemas/KomgaDateTime" }
        sizeBytes: { type: integer, description: The file size on disk; 0 when never stamped. }
        size: { type: string, description: "Komga's text for sizeBytes (\"1.5 KiB\")." }
        media:
          type: object
          required: [status, mediaType, pagesCount, mediaProfile, epubDivinaCompatible, comment]
          properties:
            status: { type: string, enum: [READY, ERROR] }
            mediaType: { type: string }
            pagesCount: { type: integer }
            mediaProfile: { type: string, description: Always DIVINA. }
            epubDivinaCompatible: { type: boolean, description: Always false. }
            comment: { type: string }
        metadata:
          type: object
          required: [title, titleLock, summary, summaryLock, number, numberLock, numberSort, numberSortLock, releaseDateLock, authors, authorsLock, tags, tagsLock, isbn, isbnLock, links, linksLock]
          properties:
            title: { type: string }
            titleLock: { type: boolean }
            summary: { type: string }
            summaryLock: { type: boolean }
            number: { type: string, description: "The display string: the chapter number, or \"1–7\" for a file holding chapters 1 to 7 (since v0.55.2)." }
            numberLock: { type: boolean }
            numberSort: { type: number, description: "The override-aware chapter number; a file holding a range sorts at its start." }
            numberSortLock: { type: boolean }
            releaseDate: { type: [string, "null"], description: "`yyyy-MM-dd` (the source's chapter date, else the file's time) or null." }
            releaseDateLock: { type: boolean }
            authors: { type: array, items: { $ref: "#/components/schemas/KomgaAuthor" }, description: The scanlation group, if any, as role `translator`. }
            authorsLock: { type: boolean }
            tags: { type: array, items: { type: string } }
            tagsLock: { type: boolean }
            isbn: { type: string }
            isbnLock: { type: boolean }
            links: { type: array, items: {} }
            linksLock: { type: boolean }
        deleted: { type: boolean }
        oneshot: { type: boolean }
    KomgaPageDto:
      type: object
      required: [number, fileName, mediaType]
      properties:
        number: { type: integer, minimum: 1, description: 1-based, as Komga numbers pages and as the extension puts it in the image URL. }
        fileName: { type: string }
        mediaType: { type: string }
        width: { type: [integer, "null"] }
        height: { type: [integer, "null"] }
    KomgaReadProgressV2:
      type: object
      description: >-
        What Mihon's Komga tracker reads. Over EVERY chapter of the series, tombstones included (members'
        history refers to them). `lastReadContinuousNumberSort` is the number of the last chapter in the
        LEADING run of completed chapters ordered by the override-aware number (chapters 1, 2 and 4 read
        reports 2; nothing read reports 0, and so does a run that ends on -- or starts with an unread --
        number-0 chapter); `maxNumberSort` is the highest chapter number. Mihon truncates the latter to its chapter total and derives UNREAD / READING /
        COMPLETED from the counts. A file holding a range of chapters (since v0.55.2) counts its end in both: finished,
        "Batman 01-07" ends the run at 7.
      required: [booksCount, booksReadCount, booksUnreadCount, booksInProgressCount, lastReadContinuousNumberSort, maxNumberSort]
      properties:
        booksCount: { type: integer }
        booksReadCount: { type: integer }
        booksUnreadCount: { type: integer }
        booksInProgressCount: { type: integer }
        lastReadContinuousNumberSort: { type: number }
        maxNumberSort: { type: number }
    KomgaUser:
      type: object
      required: [id, email, roles, sharedAllLibraries, sharedLibrariesIds, labelsAllow, labelsExclude]
      properties:
        id: { type: string }
        email: { type: string, description: The username (the extension calls the field the account email). }
        roles: { type: array, items: { type: string }, description: "[USER], or [ADMIN, USER] for an admin." }
        sharedAllLibraries: { type: boolean, description: True when the account has no per-library grants. }
        sharedLibrariesIds: { type: array, items: { type: string } }
        labelsAllow: { type: array, items: { type: string }, description: Always empty. }
        labelsExclude: { type: array, items: { type: string }, description: Always empty. }
        ageRestriction:
          type: [object, "null"]
          description: "`{ age, restriction: ALLOW_ONLY }` from the account's max_age_rating, or null when it has none."
          properties:
            age: { type: integer }
            restriction: { type: string }
    SourceOrder:
      type: object
      description: >-
        Which sources to take a chapter from, most preferred first, when a series follows more than one. It
        ranks below the scanlation group preferences and the hosted-before-external rule, so it decides only
        between copies those consider equal, and it only ever chooses among copies of a chapter the server
        does not have yet. Stored server-wide on the settings row and, optionally, per series, where it
        replaces the server's order rather than merging with it.
      required: [priority]
      properties:
        priority:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 120 }
          description: Source ids, best first. Sources not named here rank below every named one, in the series' follow order.
    ScanlatorPrefs:
      type: object
      description: >-
        Release preferences: which scanlation group to take when a source lists a chapter more than once,
        which never to take, and how long to hold a new chapter for a ranked group before the best available
        copy is taken instead. Stored server-wide on the settings row and, optionally, per series. When both
        exist they merge: blocked is the union, a per-series priority replaces the global list, and a null
        per-series patienceDays inherits the global one (2 when that is null too). Names are compared
        case-insensitively with punctuation and spaces ignored, so "Asura Scans" and "asurascans" are one
        group. On write every field is optional: a missing list is empty and a missing patienceDays is
        null (inherit); responses always carry all three.
      properties:
        priority:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 80 }
          description: Groups to take first, best first. A chapter only waits for one of these when the list is non-empty.
        blocked:
          type: array
          maxItems: 200
          items: { type: string, minLength: 1, maxLength: 80 }
          description: >-
            Groups never to take. A joint release is dropped only when every group on it is blocked, and a
            copy that names no group is never blocked.
        patienceDays:
          type: [integer, "null"]
          minimum: 0
          maximum: 30
          description: Days to hold a new chapter for a ranked group; 0 takes the best copy at once; null inherits.
    SeriesSource:
      type: object
      description: One place a series' chapters come from. The primary is the pair the series was added with; the rest were followed later.
      required: [sourceId, name, sourceSeriesId, primary, checkedAt, chapters, registered, auto, standing]
      properties:
        sourceId: { type: string, description: The adapter id. }
        name: { type: string, description: The adapter's display name, or the id when the adapter is not loaded. }
        sourceSeriesId: { type: string, description: The series' id on that source. }
        primary: { type: boolean }
        checkedAt: { type: [string, "null"], format: date-time, description: When the updater last listed it. }
        chapters: { type: [integer, "null"], description: "For a follower, the distinct chapter numbers it listed then; for the primary, the merged count across every followed source after the release preferences (the same figure as the series' source.chapters)." }
        registered: { type: boolean, description: Whether the adapter is loaded right now; a follower whose extension was removed keeps its row so it can still be unfollowed. }
        auto: { type: boolean, description: "Followed by the add-time auto-follow (POST /api/sources/add alsoFollow) rather than by a person: the row has no author. Always false for the primary. A person confirming the same source through a fill-scan plan turns it false." }
        standing:
          $ref: "#/components/schemas/SourceStanding"
    SourceStanding:
      type: string
      enum: [usable, cooling, failing, off, not_loaded]
      description: >-
        Since v0.54.0 (bff lib/sourceStanding.ts): whether a series can be updated through the source right now.
        `off`: switched off -- under Sources (POST /api/admin/sources/{id}/disable) or in the extension's own
        switches, which also unloads it; `not_loaded`: no adapter by that id is loaded (uninstalled, a site removed,
        the extension engine away); `failing`: a confirmed, current failure at the chapter list, the page list or the
        images, or the site's own offline notice at any step (a search failure stops no update); `cooling`: inside a
        cooldown, which ends by itself -- or, since v0.55.1, asked to slow down (HTTP 429) at the chapter list, the
        page list or the images, a rate limit being a cooldown and never a failure; `usable`: none of those. Only a `usable` or `cooling` follower can be made the
        main source, and only those count as still carrying a series.
    Ghost:
      type: object
      description: A chapter number the sources listed at the last check that this server has no row for.
      required: [number, title, publishedAt, scanlator, groups, sourceId, sourceName, why]
      properties:
        number: { type: number }
        title: { type: [string, "null"] }
        publishedAt: { type: [string, "null"], format: date-time }
        scanlator: { type: [string, "null"], description: The group on the copy the release rules chose, as the source shows it. }
        groups: { type: array, items: { type: string }, description: Every group that released any copy of the number. }
        sourceId: { type: string, description: The adapter the chosen copy would be fetched through. }
        sourceName: { type: string }
        why:
          type: string
          enum: [missing, held, blocked, failed, floor, archive, covered]
          description: >-
            `archive` (since v0.49.0, #117): an active slow archive will fetch it -- available, under the retry
            cap, below the archive's boundary. It comes before `floor`; a capped, held or blocked number keeps
            its own reason, since the archive does not fetch those either. `covered` (since v0.50.0): another
            site's split of a chapter this server holds -- not on disk, at a whole number the disk holds a file
            at, from a source none of those files came from -- or, with nothing of that chapter on disk yet, a
            part only sources other than the first-ranked one that lists the chapter list. Never fetched by the
            sweep or the slow archive and not counted as missing; a fetch by hand still takes it. It comes before
            `floor`.
        attempts: { type: integer, description: Only when the chapter has failed at least once. }
        reason: { type: string, description: The downloader's last error text. Admins only. }
        waitingFor: { type: string, description: "Only when why is held, and only when a priority group survives the blocklist: the effective first-choice group (the series' own priority over the global one) the chapter is being held for, spelt as the preference names it." }
        waitDaysLeft: { type: integer, minimum: 0, description: "Only with waitingFor: whole days until the patience window closes, counted as the sweep counts it -- from the oldest hosted copy that is not from a blocked group, under today's preferences (so 0 when the window has closed since the last check)." }
        read: { type: boolean, enum: [true], description: "Only when the caller marked this number read although the server does not hold it (POST /api/series/{id}/listing-progress). Absent, never false, for everyone else." }
    ArchiveSeries:
      type: object
      description: >-
        One series queued for the slow archive (#117), as a viewer may see it. `left` is what the archive may
        still fetch below its boundary (null until its first listing is read). `waiting` is why it is not
        fetching right now: `turn` (another series on its source has the slot, or the archive has as many
        sources in flight as it may), `break` (its source is between chapters; `until`), `backoff` (its source
        refused a chapter and is left alone: 1 h, 3 h, 12 h, then a day), `source_busy` (somebody else's
        download is on its source), `pace` (its source answered 429 within the hour; since v0.55.3 the archive then goes on
        at its own slow pace while the source's raised download pace lasts, no longer waiting for that to end), `cooldown` (the source's own
        back-off), `disabled`, `source_missing`, `series_busy` (a download for the series itself is running),
        `listing` (its listing must be read before its next chapter, and the last read gave none: read again at
        `until`, 1 h, 3 h, 12 h, then a day apart), `renumbering` (a renumber is pending for it). `attention` puts
        it under Needs attention: `backoff` (refused twice in a row), `source_missing` or `disabled` (for over a
        day), `disk`, `stalled` (paused a week, or queued three days without a chapter coming in over at least two
        finished turns that brought nothing -- a turn in flight or one refusal is not a stall), `finished_with_gaps`
        (done, with `note` saying what was left behind). Chapters landed but not scanned in yet are already out of
        `left`.
      required: [seriesId, title, state, direction, done, left, failed, bytes, mine, queuedAt, startedAt]
      properties:
        seriesId: { type: string }
        title: { type: string }
        state: { type: string, enum: [queued, paused, done] }
        direction: { type: string, enum: [up, down], description: "Which way the missing numbers are fetched: up from the lowest, or down from the edge of the chapters already held (a Latest-N add)." }
        done: { type: integer, description: Chapters the archive has landed. }
        left: { type: [integer, "null"] }
        failed: { type: integer, description: Chapters that failed (each also on the Health page's failures). }
        bytes: { type: integer, description: Bytes the archive has written. }
        mine: { type: boolean, description: This account queued it, and so may pause, resume or stop it (as may an admin). }
        current: { type: object, properties: { number: { type: number }, startedAt: { type: string, format: date-time } } }
        nextAt: { type: string, format: date-time, description: "When it may next go: its source's break or backoff, or its own listing retry when that is what it waits for. Absent while a chapter of it is in flight." }
        etaMs: { type: integer, description: "About how long until the rest is in: left x the series sharing its source x the running average time per chapter, in calendar time -- with a time window set, stretched by the share of the day the window is open." }
        waiting:
          type: object
          properties:
            why: { type: string, enum: [turn, break, backoff, source_busy, pace, cooldown, disabled, source_missing, series_busy, listing, renumbering] }
            until: { type: string, format: date-time }
            source: { type: string, description: The source's name. }
        attention:
          type: object
          properties:
            why: { type: string, enum: [backoff, source_missing, disabled, stalled, disk, finished_with_gaps] }
            since: { type: string, format: date-time }
        queuedAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: string, format: date-time }
        note:
          type: object
          description: "Only when done: numbers below the boundary it left behind -- capped (failed three times), held (waiting for a preferred group), blocked (only blocked groups released them)."
          properties:
            capped: { type: integer }
            held: { type: integer }
            blocked: { type: integer }
    ArchiveView:
      type: object
      description: >-
        The slow archive (#117) as one viewer may see it: the pacing an admin set, why nothing is being archived
        right now when that is the case, and the series this viewer may browse (the same rule as the Downloads
        view's cards; a finished one is listed for a day, or until dismissed when something was left behind).
        `waiting.why` is `stopping`, `paused`, `window` (outside the hours it may run; `until` it opens),
        `sweep`, `repair`, `check` (the daily source check is walking every source) or `disk` (free space is
        under archive_min_free_gb).
      required: [paused, perHour, window, series]
      properties:
        paused: { type: boolean }
        perHour: { type: integer, minimum: 1, maximum: 30, description: Chapters an hour, per source. }
        window:
          type: [object, "null"]
          properties:
            from: { type: integer, minimum: 0, maximum: 23 }
            to: { type: integer, minimum: 0, maximum: 23 }
        waiting:
          type: object
          properties:
            why: { type: string, enum: [stopping, paused, window, sweep, repair, check, disk] }
            until: { type: string, format: date-time }
        series:
          type: array
          items:
            $ref: "#/components/schemas/ArchiveSeries"
    ListingNumbers:
      type: object
      description: The chapter numbers a listing-progress call names, as the listing spells them.
      required: [numbers]
      properties:
        numbers:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: number
            minimum: 0
            maximum: 1000000
    SkippedNumber:
      type: object
      required: [number, reason]
      properties:
        number: { type: number }
        reason:
          type: string
          enum: [not_listed, blocked_group, already_here, source_unavailable, cooldown, duplicate]
          description: >-
            `duplicate` is a second pick for a number already picked in the same body: the first pick was
            handled, this one was not.
        source: { type: string, description: Present when the skipped entry was a pick, naming the copy asked for. }
        sourceId: { type: string, description: Present when the skipped entry was a pick. }
    Pick:
      type: object
      description: >-
        One specific copy of a chapter number, as GET /api/series/{id}/versions lists it. A pick is
        authorised by a matching entry in the number's stored copies (`not_listed` otherwise) and ignores
        the group rules including the blocklist -- an explicit choice of one copy -- but never `already_here`.
      required: [number, source, sourceId]
      properties:
        number: { type: number, minimum: 0, maximum: 1000000 }
        source: { type: string, minLength: 1, maxLength: 200, description: The adapter id the copy is listed on. }
        sourceId: { type: string, minLength: 1, maxLength: 200, description: The chapter id within that source. }
    SearchSourceLine:
      type: object
      description: >-
        One source's part in a cross-source search (GET /api/sources/search-all), in the order the sources
        were asked. Only sources the caller may reach are ever listed.
      required: [id, name, state]
      properties:
        id: { type: string }
        name: { type: string }
        state:
          type: string
          enum: [ok, empty, timeout, failed, skipped, pending]
          description: >-
            `ok` answered with results, `empty` answered with none, `timeout` outran its budget (recorded as
            slow, never as a failure), `failed` threw (recorded against its health), `pending` is still
            being asked, `skipped` was not asked at all.
        ms: { type: integer, description: How long the source took, once it has settled. }
        why:
          type: string
          enum: [disabled, cooldown]
          description: Only with `skipped`. An operator switched the source off, or it is serving out a cooldown.
    DownloadSwitch:
      type: object
      description: A chapter completed from a followed source after its first copy failed.
      required: [number, from, to]
      properties:
        number: { type: number }
        from: { type: string, description: The source whose copy failed. }
        to: { type: string, description: The followed source whose copy landed. }
        why:
          type: string
          enum: [rate_limited]
          description: Present as `rate_limited` when a 429 caused the switch; absent for an ordinary failure.
    Cadence:
      type: object
      description: >-
        A group's release rhythm, from the median gap between its last ten release DAYS (a day with several
        chapters is one release day, so a group that ships two at a time is not "daily"): `daily` (at most
        1.5 days), `weekly` (at most 9), `monthly` (at most 40), `irregular` (longer); `unknown` with fewer
        than two distinct dated days. `quiet` when the silence since the last release exceeds three
        intervals (never less than 14 days), or 45 days when the rhythm is unknown.
      required: [kind, intervalDays, daysSince, quiet]
      properties:
        kind:
          type: string
          enum: [daily, weekly, monthly, irregular, unknown]
        intervalDays: { type: [number, "null"], description: The median gap in days, one decimal; null when unknown. }
        daysSince: { type: [integer, "null"], description: Whole days since the last dated release; null when none is dated. }
        quiet: { type: boolean }
    GroupStat:
      type: object
      description: >-
        One scanlation group's figures for a series. Groups are merged by the same equality the release
        rules use (case, spaces and punctuation ignored); the name is the first spelling seen on disk, else
        the first listed. A joint release counts once for each of its groups.
      required: [name, releases, first, last, lastReleaseAt, cadence, onDisk, chapters, langs, weeks]
      properties:
        name: { type: string }
        releases: { type: integer, description: Chapters the group released -- distinct numbers across every followed source; a second copy of a number is not a second release. }
        first: { type: [number, "null"], description: The lowest chapter number it released. }
        last: { type: [number, "null"], description: The highest chapter number it released. }
        lastReleaseAt: { type: [string, "null"], format: date-time }
        cadence:
          $ref: "#/components/schemas/Cadence"
        onDisk: { type: integer, description: Live chapters on this server stamped with the group. }
        chapters: { type: array, items: { type: number }, description: The numbers it released, ascending, each once. }
        langs: { type: array, items: { type: string }, description: The languages its copies are in, sorted. }
        weeks:
          type: array
          minItems: 12
          maxItems: 12
          items: { type: boolean }
          description: "One flag per week for the last twelve, oldest first, newest last (index 11 is the seven days ending now): true when the group released in that week, from the same per-number release dates the cadence is judged on. A release dated ahead of the server's clock counts as this week."
    Copy:
      type: object
      description: One version of a listed chapter number, as the sources list it.
      required: [key, source, sourceName, groups, scanlator, lang, pages, publishedAt, chosen, blocked, onDisk]
      properties:
        key: { type: string, description: "`<source>:<sourceId>`, unique within the number." }
        source: { type: string, description: The adapter id; with `sourceId` this is what a Pick names. }
        sourceName: { type: string }
        groups: { type: array, items: { type: string } }
        scanlator: { type: [string, "null"], description: The group string as the source shows it (a joint release reads "A & B"). }
        lang: { type: [string, "null"] }
        pages: { type: [integer, "null"], description: 0 is an external link (not downloadable); null when the source does not say. }
        publishedAt: { type: [string, "null"], format: date-time }
        chosen: { type: boolean, description: The copy the release rules chose at the last check. }
        blocked: { type: boolean, description: Every group on the copy is blocked by the effective preferences. A copy with no groups is never blocked. }
        onDisk: { type: boolean, description: "Best effort: a live chapter for the number came from the same source with the same group stamp (or, for a file with no stamp, this is the chosen copy). Since v0.49.0 a chapter that landed with the post it came from stamped (lib_books.source_chapter_id) matches that copy alone." }
        title: { type: [string, "null"], description: "Since v0.49.0 (#116): the copy's own title as the source lists it. Copies from one source and one group under different titles are different posts that share a number, not versions." }
    NotifyTarget:
      type: object
      description: >-
        A notification target (since v0.43.0), as the admin panel may see it. The address, the token and the ntfy
        topic are never in it: `target` is scheme and host only, with "/…" when the stored address has a path.
      required: [id, kind, name, target, service, hasToken, userId, userName, events, template, enabled, includeAdult, consecutiveFailures, lastOkAt, lastError, lastErrorMessage, lastErrorAt, lastResult, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [webhook, home_assistant, ntfy, discord] }
        name: { type: string }
        target: { type: string, description: "The masked display form, e.g. https://discord.com/… or http://homeassistant.local:8123." }
        service: { type: [string, "null"], description: The Home Assistant service (domain.service); null for the other kinds. }
        hasToken: { type: boolean, description: Whether a token is stored. The token itself is never returned. }
        userId: { type: [string, "null"], description: The person the target is aimed at; null for the whole server. }
        userName: { type: [string, "null"] }
        events: { type: array, items: { type: string, enum: [new_chapters, health] } }
        template: { type: [string, "null"], description: "The digest template; null is the default \"{count} new chapters in {series}\"." }
        enabled: { type: boolean, description: Switched off automatically after 10 consecutive failed deliveries, with one notice to the admins. }
        includeAdult: { type: boolean, description: "Whether the digest may name series from libraries rated 18+. False by default, like an OPDS link's and an API token's showAdult. A target aimed at a person is bounded by that person's libraries and age cap whatever this says." }
        consecutiveFailures: { type: integer }
        lastOkAt: { type: [string, "null"], format: date-time }
        lastError: { type: [string, "null"], description: "The last failure's reason code (as POST .../test answers), never the target's own answer." }
        lastErrorMessage: { type: [string, "null"], description: The reason as an English sentence. }
        lastErrorAt: { type: [string, "null"], format: date-time }
        lastResult: { type: [string, "null"], enum: [ok, error, null], description: Whichever of the last success and the last failure is newer; null before the first delivery. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Said:
      type: object
      description: >-
        One sentence the server says, as a code a client can word in its reader's language (since v0.49.1; bff
        lib/said.ts, and lib/sourceDiagnosis.ts for a diagnosis's `fix.*` codes). Always sent BESIDE the English
        field it words -- `summary`/`summarySaid`, `note`/`noteSaid`, `detail`/`detailSaid`, `title`/`titleSaid`,
        `fix`/`fixSaid`, `reason`/`reasonSaid`, `message`/`messageSaid`, `error`/`errorSaid` -- never instead of it:
        a client that does not know a code shows the English, and the English is unchanged. A field that is a
        list of these is one line of parts, each joined to the one before it as `join` says.
      required: [code]
      properties:
        code:
          type: string
          description: "Stable, e.g. gaps.live, sources.failing, missing.files, job.partial, renumber.onDisk, pref.noChoice, fix.moved; `text` is a string the server had no code for, in `params.text`, to show as it is."
        params:
          type: object
          additionalProperties: true
          description: "What fills the sentence: counts as numbers, moments as ISO 8601 strings (the English prints them in UTC, with no zone), names, file names and a system's own error text as strings, lists as arrays."
        join:
          type: string
          enum: [clause, sentence, then, period, dash, dashCap, paren, colon]
          description: "How this part joins the one before it: \"a; b\" (clause, the default when absent), a new sentence (its first letter raised), a new sentence as it is (then: one that opens on a name, whose case is the name's), \"a. B\", \"a — b\" (dashCap raises the next letter), \"a (b)\", \"a: b\"."
    AltTitles:
      type: object
      description: >-
        The other names a series goes by (since v0.49.1), the names a person chose first: an admin's, then a
        tracker import's, then those read from its main source's description.
      required: [titles]
      properties:
        titles:
          type: array
          items:
            type: object
            required: [title, norm, origin, addedBy, createdAt]
            properties:
              title: { type: string }
              norm: { type: string, description: "The key the name is compared and removed by: lower case, letters and digits only (DELETE .../alt-titles/{norm})." }
              origin:
                type: string
                enum: [admin, import, description]
                description: "`admin` typed by hand, `import` a tracker's synonym kept when an import added the series, `description` read from the series' main source's own description."
              addedBy: { type: [string, "null"], description: "The admin's username; null for a name the server read, or for an account since deleted." }
              createdAt: { type: string, format: date-time }
    FindResult:
      type: object
      description: What a Find other sources run did for one series (since v0.49.1).
      required: [seriesId, followed]
      properties:
        seriesId: { type: string }
        title: { type: string, description: "Left out for a series the viewer may not list (the 18+ hide, above all), and for one no longer in the library when a restart's run was closed; the entry stays." }
        followed:
          type: array
          description: The sources it now follows, in scan order.
          items:
            type: object
            required: [sourceId, name, chapters]
            properties:
              sourceId: { type: string }
              name: { type: string }
              chapters: { type: integer, minimum: 0, description: The distinct chapter numbers that source lists. }
        why:
          type: string
          enum: [posting_order, full, too_few, no_source, refused, no_answer, followed_already, no_match, not_tried, moved, busy, renumber_pending]
          description: >-
            Only when nothing was followed (in a Replace run: when nothing was promoted), and exactly what happened.
            Since v0.54.0, a Replace run: `moved` (the series' main source is no longer the one replaced), `busy` (a
            sweep, a check or a listing refresh stayed inside the series for 30 s), `renumber_pending` (its chapters
            wait to be renumbered). `posting_order`: numbered by posting order, so
            no follower is ever merged (not searched). `full`: the series already follows two sources (not searched),
            or another search filled the last slot meanwhile. `too_few`: it lists fewer than three chapter numbers,
            which no candidate can be measured against (not searched). `no_source`: no other source could be asked --
            every one turned off, cooling down, beyond the starting admin's age cap, in another language than the
            series (since v0.52.0), or one it follows already (not searched; the server log says which, by count).
            `refused`: a source carried the title and did not pass the title and chapter-number check (another book).
            `no_answer`: the sources asked did not answer, or the one that carried the title did not answer for its
            chapters, so nothing could be judged. `followed_already`: the sources that answered do not carry it, and
            the series already follows another source -- which does, so it is not "no other source lists it".
            `no_match`: the sources that answered do not carry it, and it follows no other source. `not_tried`: a
            stop, the series' 90 s wall or a restart cut it short (rarely also a series deleted or merged away before
            or during its turn) -- never "not found".
        proposals:
          type: array
          description: "Since v0.51.0, a review-first run only, for a series it found candidates for: each, in scan order, for an admin to follow or dismiss. Such a series carries no `why`, and `followed` gains each proposal an admin follows. In a Replace review (v0.54.0): the series' followers that could take over, best first (`kind: follower`), or what its search found (`kind: search`), the one it would make the main source marked `promote`."
          items:
            $ref: "#/components/schemas/FindProposal"
        promoted:
          type: object
          description: "Since v0.54.0, a Replace run: the series was moved off the replaced source. `via`: a follower it had, or a source its search found and followed. `old`: the replaced source dropped from its followers (always, in a run)."
          required: [from, fromName, to, toName, via, old]
          properties:
            from: { type: string }
            fromName: { type: string }
            to: { type: string }
            toName: { type: string }
            via: { type: string, enum: [follower, search] }
            old: { type: string, enum: [dropped, kept] }
        skipped:
          type: array
          description: "Since v0.54.0, a Replace run: the followers passed over, each with why -- off, failing, not_loaded (standing), language (another language than the series), age (beyond the starting admin's age reach), or cooling (a follower in a cooldown that was not the one promoted)."
          items:
            type: object
            required: [sourceId, name, why]
            properties:
              sourceId: { type: string }
              name: { type: string }
              why: { type: string, enum: [off, failing, cooling, not_loaded, language, age] }
        dropped:
          type: array
          description: "Since v0.54.0, a Replace run: dead followers (failing, not loaded, switched off, worst first) dropped, with their listing rows, to make room under the follower cap for a source the search found."
          items:
            type: object
            required: [sourceId, name]
            properties:
              sourceId: { type: string }
              name: { type: string }
    FindProposal:
      type: object
      description: "A candidate a review-first Find other sources run kept for an admin to confirm, the best one per source (since v0.51.0). For a series the viewer may not list, `title`, `coverUrl` and `url` are left out."
      required: [sourceId, sourceName, sourceSeriesId, chapters, ours, theirs, coverage, verdict]
      properties:
        sourceId: { type: string }
        sourceName: { type: string }
        sourceSeriesId: { type: string, description: "The series' id on that source: what a follow writes." }
        url: { type: string, description: "Its page on the source, when the source's search gave one." }
        title: { type: string, description: The title as the source names it. }
        coverUrl: { type: string, description: "The source's own cover URL, as its search gave it; shown through GET /img/sources/cover." }
        chapters: { type: integer, minimum: 0, description: The distinct chapter numbers it lists. }
        ours:
          type: object
          description: "Of the series' own chapter numbers (whole numbers), how many it lists: `lined` of `of`."
          required: [lined, of]
          properties: { lined: { type: integer, minimum: 0 }, of: { type: integer, minimum: 0 } }
        theirs:
          type: object
          description: "Of its chapter numbers (whole numbers, one copy each under the series' release preferences), how many the series lists."
          required: [lined, of]
          properties: { lined: { type: integer, minimum: 0 }, of: { type: integer, minimum: 0 } }
        coverage: { type: [number, "null"], description: "The judgement's coverage: the lower of the two shares when it measured both ways." }
        verdict:
          type: string
          enum: [green, amber]
          description: "`green`: an automatic run would have followed it (title and chapter numbers). `amber`: for a person to look at first, `amber` says why."
        amber:
          type: string
          enum: [numbering, other_name, cooling, coverage, stale]
          description: "`numbering`: a name matches exactly and the chapter numbers do not line up (a title that merely contains the series' with numbers that do not line up -- a sequel's shape -- is never proposed). `other_name`: it lines up, but matched only under another name of the series, not its title. Since v0.54.0, a Replace review's follower: `cooling` (in a cooldown), `coverage` (it lists under 90% of the series' numbers), `stale` (it has not answered for its list within the week)."
        state:
          type: string
          enum: [followed, dismissed, promoted]
          description: "Set once an admin decided; final. `promoted` (since v0.54.0): made the series' main source by POST .../find/{runId}/promote."
        kind:
          type: string
          enum: [follower, search]
          description: "Since v0.54.0, a Replace review: a follower the series has, or a source its search found."
        promote: { type: boolean, enum: [true], description: "Since v0.54.0, a Replace review: the one the run would make the main source -- the best follower, or the first green match." }
        newer: { type: integer, minimum: 0, description: "Since v0.54.0, a Replace review's follower: chapters it lists past what the library holds." }
        standing:
          $ref: "#/components/schemas/SourceStanding"
    FindRunSummary:
      type: object
      description: One Find other sources run, without its per-series results (since v0.49.1).
      required: [id, status, total, done, followed, startedBy, startedAt]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [running, done, stopped, failed, interrupted]
          description: "`stopped`: an admin stopped it (POST .../find/stop, or Cancel on its card). `interrupted`: the server went away under it -- a shutdown, where the run closes its own row, or a row found still running after a restart, closed at boot. Either way `results` then lists every series it never reached as `not_tried`, as a stopped run does."
        total: { type: integer, minimum: 0, description: Series in its scope. }
        done: { type: integer, minimum: 0, description: "Series settled so far; a stopped or interrupted run's rest are in `results` as not_tried but not counted here, and since v0.52.0 neither is the series a stop cut short with nothing to show (runs kept from before count it)." }
        followed: { type: integer, minimum: 0, description: Sources followed, across its series. }
        startedBy: { type: [string, "null"], description: "The admin who started it, by username (never the account id); null for an account since deleted." }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        sourceId: { type: string, description: The source whose series it was about, when the scope was a source. }
        sourceName: { type: string, description: That source's display name, or its id when it is not loaded. }
        review: { type: boolean, enum: [true], description: "Since v0.51.0: a review-first run, which followed nothing itself; its results carry `proposals`. Absent for an automatic run." }
        mode: { type: string, enum: [replace], description: "Since v0.54.0: a Replace run, which moved the series of `sourceId` off it. Absent for Find other sources." }
        promoted: { type: integer, minimum: 0, description: "Since v0.54.0, a Replace run: how many of its series were moved to another main source (counted from its results)." }
    FindRun:
      description: A Find other sources run in full (since v0.49.1).
      allOf:
        - $ref: "#/components/schemas/FindRunSummary"
        - type: object
          required: [results]
          properties:
            current:
              type: object
              description: The series it is on now, while it runs; left out for a series the viewer may not list.
              required: [seriesId, title]
              properties:
                seriesId: { type: string }
                title: { type: string }
            waiting:
              type: string
              enum: [sweep, repair, check]
              description: While it runs, what it is waiting on before its next series.
            left: { type: integer, minimum: 0, description: "Since v0.54.0, a Replace run: the series whose main source the replaced source is now." }
            turnedOff: { type: boolean, description: "Since v0.54.0, a Replace run: whether the replaced source is switched off now -- by this run's turnOff, or before." }
            results:
              type: array
              description: "One entry per series settled, in the order they were asked about; after the run ends -- done, stopped or interrupted -- one for every series in its scope, those it never reached as `not_tried`."
              items:
                $ref: "#/components/schemas/FindResult"
paths:
  /livez:
    get:
      tags:
        - health
      summary: Is the process alive? Unconditional {ok:true}; what the container healthcheck polls.
      operationId: getLivez
      security: []
      responses:
        "200":
          description: OK
  /healthz:
    get:
      tags:
        - health
      summary: Is the database reachable? Runs SELECT 1; 503 when Postgres is down.
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: OK
        "503":
          description: Database unreachable
  /api/setup/status:
    get:
      tags:
        - auth
      summary: Whether first-run setup has been completed.
      operationId: getApiSetupStatus
      security: []
      responses:
        "200":
          description: OK
  /api/setup:
    post:
      tags:
        - auth
      summary: Create the first admin account (only while no account exists).
      operationId: postApiSetup
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                displayName:
                  type: string
      security: []
      responses:
        "200":
          description: OK
        "400":
          description: Malformed body or parameter
        "409":
          description: "Conflict: already exists, already running, or duplicate"
  /auth/config:
    get:
      tags:
        - auth
      summary: Login options the client should offer (registration open, OIDC configured).
      operationId: getAuthConfig
      security: []
      responses:
        "200":
          description: OK
  /auth/login:
    post:
      tags:
        - auth
      summary: Log in with username and password (and a TOTP code when enabled); returns a short-lived JWT and sets
        the refresh cookie.
      operationId: postAuthLogin
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                totp:
                  type: string
      security: []
      responses:
        "200":
          description: OK
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
        "429":
          description: Too many attempts
  /auth/register:
    post:
      tags:
        - auth
      summary: Create an account, when registration is open.
      operationId: postAuthRegister
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                displayName:
                  type: string
      security: []
      responses:
        "200":
          description: OK
        "400":
          description: Malformed body or parameter
        "403":
          description: "Forbidden: token scope, account permission or age limit"
        "409":
          description: "Conflict: already exists, already running, or duplicate"
  /auth/refresh:
    post:
      tags:
        - auth
      summary: Exchange the rotating refresh cookie for a new JWT.
      operationId: postAuthRefresh
      security: []
      responses:
        "200":
          description: >-
            A new access token, the signed-in user, and when the refresh token itself expires.
            The installed app persists `refreshExpiresAt` so it can honour the same expiry offline
            that this server would enforce online -- it cannot derive it, because REFRESH_TTL_DAYS is
            an operator setting and the cookie is httpOnly.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresIn, user, refreshExpiresAt]
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer, description: Access-token lifetime in seconds }
                  user: { type: object, description: The same payload /auth/me returns }
                  refreshExpiresAt:
                    type: integer
                    format: int64
                    description: >-
                      Refresh-token expiry, ms since the epoch. On the stale-rotation race this is the
                      existing row's real expiry, not a fresh one -- rotating nothing must not extend it.
        "401":
          description: Not authenticated
        "403":
          description: The account has been disabled; every session was revoked
  /auth/logout:
    post:
      tags:
        - auth
      summary: End this session and clear its cookies (yomi_rt, yomi_img and, since v0.38.0, UCHIYOMI-SESSION).
      operationId: postAuthLogout
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /auth/logout-all:
    post:
      tags:
        - auth
      summary: Revoke every session of the calling account.
      operationId: postAuthLogoutAll
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /auth/me:
    get:
      tags:
        - auth
      summary: "The calling account: id, username, role, permissions."
      operationId: getAuthMe
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /auth/password:
    post:
      tags:
        - auth
      summary: Change the calling account's password.
      operationId: postAuthPassword
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                current:
                  type: string
                next:
                  type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
  /auth/sessions:
    get:
      tags:
        - auth
      summary: Active sessions of the calling account.
      operationId: getAuthSessions
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /auth/sessions/{id}:
    delete:
      tags:
        - auth
      summary: Revoke one session.
      operationId: deleteAuthSessionsId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "404":
          description: Not found, or not visible to this account
  /auth/totp/setup:
    post:
      tags:
        - auth
      summary: "Start two-factor enrolment: returns the secret and QR payload."
      description: >-
        Writes a pending secret and returns it with the otpauth URI and a QR data URL; nothing is enforced
        until `/auth/totp/enable` confirms a code. Refused while two-factor is already on for the account
        (since v0.39.0), so a stale "Set up 2FA" button can never rotate the secret an authenticator app
        holds — turn it off with `/auth/totp/disable` first.
      operationId: postAuthTotpSetup
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "409":
          description: "`totp_enabled`: two-factor is already on for this account; the live secret was not touched. Disable it first."
  /auth/totp/enable:
    post:
      tags:
        - auth
      summary: Confirm two-factor with a first code; returns recovery codes once.
      operationId: postAuthTotpEnable
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
  /auth/totp/disable:
    post:
      tags:
        - auth
      summary: Turn two-factor off (requires the account password).
      operationId: postAuthTotpDisable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated, or `wrong_password`
  /auth/oidc/start:
    get:
      tags:
        - auth
      summary: "Begin single sign-on: redirects to the identity provider."
      operationId: getAuthOidcStart
      security: []
      responses:
        "302":
          description: Redirect
  /auth/oidc/callback:
    get:
      tags:
        - auth
      summary: "Single sign-on return leg: finishes login and redirects into the app."
      operationId: getAuthOidcCallback
      security: []
      responses:
        "302":
          description: Redirect
  /api/libraries:
    get:
      tags:
        - library
      summary: The libraries the caller may see; adult:true marks an 18+ one the client can reveal.
      operationId: getApiLibraries
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/adult-filter:
    get:
      tags:
        - library
      summary: Whether the 18+ filter names any genre or source, so a client can offer the reveal without an 18+ library.
      operationId: getApiAdultFilter
      description: >-
        `configured` is true when Admin → Settings → 18+ filter lists at least one genre or source
        (adult_genres / adult_sources), i.e. when "Show 18+" would reveal something even on an install with
        no library rated 18+. Only the flag is returned, never the lists. Always false for an account whose
        age limit is below 18, which is never offered the reveal. Does not depend on `adult`.
      security:
        - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [configured]
                properties:
                  configured:
                    type: boolean
        "401":
          description: Not authenticated
  /api/genres:
    get:
      tags:
        - library
      summary: Every genre in the caller's visible library.
      operationId: getApiGenres
      parameters:
        - name: adult
          in: query
          required: false
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/genres/overview:
    get:
      tags:
        - library
      summary: Genres with series counts and cover ids for tiles.
      operationId: getApiGenresOverview
      parameters:
        - name: covers
          in: query
          required: false
          schema:
            type: integer
        - name: adult
          in: query
          required: false
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/library/sources:
    get:
      tags:
        - library
      summary: The sources the viewer's library comes from, with series counts -- the library's source filters (since v0.49.2).
      operationId: getApiLibrarySources
      description: >-
        `{content: [{id, name, main, any, installed}], none}`, busiest first: `main` counts the series added from
        the source, `any` the series that read from it at all (added from it, or following it as a fallback).
        `none` (since v0.55.1, #149) counts the series with no main source at all -- folders added by hand, and
        anything never matched to a site: what `hasMainSource: isFalse` returns in POST /api/series/search, the
        Library's "No source".
        Counted over what this viewer may list (their libraries, age cap and the 18+ switch), so the numbers are
        the ones the filtered grid shows. `name` is the one Health uses: the loaded source's, else the name the
        extension engine gave it, else the id. `installed` is false for a source that is not loaded now (its
        extension is gone or switched off, or the engine is down); its series still filter. On a Komga backend
        `content` is empty and `none` 0. Use the ids as `mainSource` / `anySource` in POST /api/series/search.
      parameters:
        - name: adult
          in: query
          required: false
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/trending:
    get:
      tags:
        - library
      summary: What the household is reading most right now.
      operationId: getApiTrending
      parameters:
        - name: adult
          in: query
          required: false
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/leaderboard:
    get:
      tags:
        - library
      summary: Members ranked by reading this period.
      operationId: getApiLeaderboard
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/random:
    get:
      tags:
        - library
      summary: One random visible series id (hero art fallback).
      operationId: getApiRandom
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/foryou:
    get:
      tags:
        - library
      summary: Recommendations built from the caller's history.
      operationId: getApiForyou
      parameters:
        - name: adult
          in: query
          required: false
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/featured:
    get:
      tags:
        - library
      summary: The featured rail.
      operationId: getApiFeatured
      parameters:
        - name: adult
          in: query
          required: false
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/refresh:
    post:
      tags:
        - library
      summary: Ask the server to refresh its cached home data.
      operationId: postApiRefresh
      description: >-
        Rescans the library, at most once a minute server-wide: within a minute of the last scan it answers
        {scanned: false, reason: 'rate_limited'}. Otherwise {scanned: true, libraries}, and since v0.49.0 in
        owned mode, to an admin, also the scan's counts {series, books, ms, skipped} (skipped: folders it could
        not index, which Health lists), so Scan library now can say what it found. A member is never told the
        counts: they are the whole library's, libraries that member cannot open included. It also refreshes the stored Health
        summary the header reads (coalesced, at most once every 30 s).
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/home:
    get:
      tags:
        - library
      summary: "Everything the home screen is built from: on-deck books with progress, rails, updates."
      operationId: getApiHome
      parameters:
        - name: adult
          in: query
          required: false
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
  /api/series/search:
    post:
      tags:
        - library
      summary: "Search and page the library: the grid, the search page, browse-by-genre and the command palette all
        use this."
      description: "A query, not a mutation: it is a POST only because the filter tree travels in a body, so a
        read-scoped API token may call it (the one non-GET a read token can use). `condition` is Komga's tree
        (`allOf` / `anyOf` of `{key: {operator: is|isNot, value}}`) over `libraryId`, `readStatus`, `status`,
        `genre`, `author`, and -- owned library only, since v0.49.2 -- `mainSource` (the source a series was added
        from, by id) and `anySource` (that, or a source it follows as a fallback); since v0.55.1 (#149)
        `hasMainSource` in Komga's boolean shape (`{operator: isTrue|isFalse}`, no value), `isFalse` being the series
        with no main source at all, whatever they follow. An unknown key is 400 `unsupported_filter`, and so is
        `hasMainSource` with any other operator."
      operationId: postApiSeriesSearch
      parameters:
        - name: adult
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                page:
                  type: integer
                size:
                  type: integer
                sort:
                  description: >-
                    `field,dir`. Fields: `updated` (last chapter added), `added` (series created), `title`,
                    `author`, `unread` (your unread count), `favorites` (your starred series first, then by
                    unread -- what "popular" means for a personal library), `random`. The per-user ones need
                    a signed-in caller and fall back to title order without one.
                  type: string
                condition:
                  type: object
                collapseEditions:
                  description: >-
                    Since v0.52.0. One series per work: of the language editions of one work that pass the filters,
                    the one this caller read most recently, else the oldest. `totalElements` then counts works. The
                    Library grid sends it; nothing else does.
                  type: boolean
      security:
        - bearer: []
      responses:
        "200":
          description: >-
            A page of series. Since v0.52.0 every series carries `lang` (the language it is in: its own, else its
            main source's, else the server's unstated language), `workId` (the work it is a language edition of, or
            null) and `edition`: `{langs}` -- the languages of its work this caller may browse, oldest edition
            first -- or null when that is only this one.
        "400":
          description: Malformed body or parameter
        "401":
          description: Not authenticated
  /api/series/{id}:
    get:
      tags:
        - library
      summary: One series with its metadata.
      operationId: getApiSeriesId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer: []
      responses:
        "200":
          description: >-
            The series. Only the fields added in v0.31.0 are described here; the rest of the shape follows
            Komga's series DTO (id, name, metadata, booksCount, ...).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  autoHero:
                    description: >-
                      Since v0.51.0, on every series in a payload: `{seed}` once the banner made from its own pages
                      is made -- GET /img/series/{id}/hero?v={seed} -- and null when none is made yet, when it has a
                      banner of its own, or when it may not have one (18+, or a last try made none).
                    oneOf:
                      - type: object
                        required: [seed]
                        properties:
                          seed: { type: integer }
                      - type: "null"
                  sources:
                    type: array
                    description: Where the chapters come from, primary first, then followed sources in the order they were added. Present for every viewer.
                    items:
                      $ref: "#/components/schemas/SeriesSource"
                  lang:
                    description: >-
                      Since v0.52.0. The language the series is in, as a BCP-47 code (`en`, `es-419`, `pt-BR`): its
                      own, else what its main source declares, else the server's unstated language. Also
                      `metadata.language`.
                    type: string
                  workId:
                    description: Since v0.52.0. The work this series is a language edition of, or null on its own.
                    type: [string, "null"]
                  edition:
                    description: >-
                      Since v0.52.0. The language editions of this work the caller may open (removed ones, those in
                      a library they were not granted and those above their age cap left out), oldest first, or null
                      when that is only this series. `lastRead` is the caller's highest finished chapter there.
                    oneOf:
                      - type: object
                        properties:
                          workId: { type: string }
                          editions:
                            type: array
                            items:
                              type: object
                              properties:
                                seriesId: { type: string }
                                lang: { type: string }
                                title: { type: string }
                                booksCount: { type: integer }
                                current: { type: boolean }
                                lastRead: { type: [number, "null"] }
                      - type: "null"
                  langStated:
                    description: Admins only (since v0.52.0). Whether `lang` is the series' own (stated) rather than inferred.
                    type: boolean
                  langAuto:
                    description: >-
                      Admins only (since v0.52.0). The language the series would be in with none of its own: what its
                      main source declares, else the server's unstated language -- Edit details' "Automatic".
                    type: string
                  paths:
                    description: >-
                      Admins only (since v0.52.0, #136). The series' folder as full paths on the server, one per root
                      its chapters are under -- the read library and the downloads folder -- or, holding nothing yet,
                      where its first chapter will land.
                    type: array
                    items: { type: string }
                  scanlatorPrefs:
                    description: >-
                      Admins only. The series' own release preferences, or null when it has none and the
                      server-wide ones apply.
                    oneOf:
                      - $ref: "#/components/schemas/ScanlatorPrefs"
                      - type: "null"
                  sourcePrefs:
                    description: >-
                      Admins only. The series' own source order, most preferred first, or null when the
                      server-wide order applies. See sourcePrefs on PATCH /api/admin/series/{id}.
                    oneOf:
                      - $ref: "#/components/schemas/SourceOrder"
                      - type: "null"
                  borrowNames:
                    description: Admins only. This series' own chapter-name borrowing switch; null follows the server's.
                    type: [boolean, "null"]
                  borrowNamesEffective:
                    description: Admins only. Whether names are borrowed for this series once the server setting is applied.
                    type: boolean
                  detectedDirection:
                    description: >-
                      Admins only (since v0.48.0). What the evidence says about the series' reading direction
                      and which evidence said it -- `comicinfo`, `source` or `anilist`, most trusted first --
                      or null when nothing has. `metadata.readingDirection` is the effective value: an admin's
                      override (`overrides.readingDirection`), else this, else WEBTOON.
                    oneOf:
                      - type: object
                        properties:
                          direction:
                            type: string
                            enum: [LEFT_TO_RIGHT, RIGHT_TO_LEFT, VERTICAL, WEBTOON]
                          from:
                            type: string
                            enum: [comicinfo, source, anilist]
                      - type: "null"
                  seriesType:
                    description: >-
                      Admins only. What kind of comic the series is, as the notice-chapter switches read it: the
                      admin's override (`overrides.seriesType`), else `detectedType`, else `unknown`.
                    type: string
                    enum: [manga, manhwa, manhua, webtoon, comic, unknown]
                  detectedType:
                    description: >-
                      Admins only. What the evidence says the series is and which evidence said it -- `genre` (a
                      genre naming one origin; a list naming several, or Manga alone, says nothing), `source`
                      (MangaDex's original language), `anilist` (the country of origin) or `webtoon` (a Webtoon
                      genre with no origin genre), most trusted first -- or null when nothing has.
                    oneOf:
                      - type: object
                        properties:
                          type: { type: string, enum: [manga, manhwa, manhua, webtoon, comic] }
                          from: { type: string, enum: [genre, source, anilist, webtoon] }
                      - type: "null"
                  hideNotices:
                    description: >-
                      Admins only. This series' own notice-chapter switch: true hides its notice chapters (numbered
                      with a fraction, like 100.5, and 3 pages or fewer), false shows them; null follows its type's
                      switch (`hideNoticeTypes` on PATCH /api/admin/settings).
                    type: [boolean, "null"]
                  hideNoticesEffective:
                    description: Admins only. Whether this series' notice chapters are hidden once its type's switch is applied.
                    type: boolean
                  hiddenNotices:
                    description: Admins only. How many notice chapters that hides right now, downloaded or only listed by its sources.
                    type: integer
                  hideNoticeShortOnly:
                    description: >-
                      Admins only, since v0.55.3: the rule the notice switches hide by (`hideNoticeShortOnly` on PATCH
                      /api/admin/settings) -- true, a fraction with 3 pages or fewer; false, every fraction.
                    type: boolean
        "401":
          description: Not authenticated
        "404":
          description: Not found, or not visible to this account
