  /api/sources/edition-candidates:
    get:
      tags:
        - sources
      summary: The languages a series could be added in, and the sources offering one (v0.52.0).
      operationId: getApiSourcesEditionCandidates
      description: >-
        The add dialog's "Which language?" step for a language edition (#72), opened from the series page. Without
        `lang`: one row per language some source declares -- every source the caller may be shown that is neither
        switched off nor cooling down -- leaving out the languages the series' work already holds (a removed
        edition's too: its slot is taken), plus `unstated`, the sources that declare no single language. Nothing is
        searched. With `lang` (a code, or `unstated`): those sources are searched for the work -- its title, the
        other editions' titles and its other names, the title by the fill scan's rule and every other name exactly
        -- under the source hunt's concurrency and one 30-second wall, and the hits come back as `providers`.
        Behind the download permission, like every /api/sources route.
      parameters:
        - name: seriesId
          in: query
          required: true
          schema:
            type: string
        - name: lang
          in: query
          required: false
          schema:
            type: string
          description: A language code from `languages`, or `unstated`.
        - name: adult
          in: query
          required: false
          schema:
            type: string
          description: "`1` to include adult sources. Absent means they are not offered."
      security:
        - bearer: []
      responses:
        "200":
          description: >-
            Without `lang`: `{title, held: [{seriesId, lang}], languages: [{lang, sources: [{id, name}]}],
            unstated: [{id, name}]}`, the languages with the most sources first. With `lang`: `{providers:
            [{source, name, sourceId, title, coverUrl, lang}]}`.
        "401":
          description: Not authenticated
        "403":
          description: "Forbidden: token scope or account permission"
        "404":
          description: Not found, or not visible to this account
  /api/sources/detail:
    get:
