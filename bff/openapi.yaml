  /api/v2/series/{id}/read-progress/tachiyomi:
    get:
      tags:
        - komga
      summary: This account's reading progress on the series, as Mihon's Komga tracker reads it.
      operationId: getApiV2SeriesIdReadProgressTachiyomi
      description: >-
        Over every chapter of the series, tombstones included. `lastReadContinuousNumberSort` is the number of
        the last chapter in the leading run of completed chapters (chapters 1, 2 and 4 read reports 2; nothing
        read reports 0, and so does a run that ends on -- or starts with an unread -- number-0 chapter),
        `maxNumberSort` the highest chapter number, and the counts split the chapters into
        read / in progress / unread. 404 unless the series is visible to the token's account (visible, not
        browsable: the 18+ hide is a surfacing preference and progress is data).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - komgaApiKey: []
        - komgaBearer: []
        - komgaBasic: []
        - komgaSession: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KomgaReadProgressV2"
        "401":
          description: Not authenticated
        "429":
          description: "too_many_requests { message } with Retry-After -- ten failed credentials from this client address in five minutes; a request with no credential or with only the cookie is never counted."
        "404":
          description: Not found, or not visible to this account
    put:
      tags:
        - komga
      summary: "Mark every chapter up to a number read, as Komga does: forward-only, idempotent, never un-marks."
      operationId: putApiV2SeriesIdReadProgressTachiyomi
      description: >-
        Body `{ lastBookNumberSortRead: n }`. Every not-yet-completed chapter whose override-aware number is
        <= n becomes completed in one statement (page moves to the chapter's page count, never backwards;
        chapters already completed are untouched; nothing is ever un-marked -- the protocol has no unread).
        No reading event is written, so streaks, the leaderboard and Wrapped are unaffected; AniList / MAL /
        Kitsu are pushed once, only when something changed. `n <= 0` is a no-op 204: Mihon PUTs
        max(remote, local) on every bind and refresh, which is 0.0 for a freshly bound series, and a chapter
        numbered 0 ("Extra", "Oneshot" -- any file without a digit) must not be marked read by that; the first
        real sync (n >= 1) marks a number-0 chapter read on both sides, as Komga does. `n` must be finite and
        at most 1000000000 (it is bound as a Postgres real; 1e300 used to be a 500), else 400. Needs the
        write scope. 404 unless the series is visible to the token's account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lastBookNumberSortRead]
              properties:
                lastBookNumberSortRead:
                  type: number
                  minimum: 0
                  maximum: 1000000000
                  description: Finite, 0 to 1000000000, in the same unit as KomgaBook.number / metadata.numberSort.
      security:
        - komgaApiKey: []
        - komgaBearer: []
        - komgaBasic: []
        - komgaSession: []
      responses:
        "204":
          description: Marked (or nothing to do).
        "400":
          description: "bad_request -- lastBookNumberSortRead must be a finite number between 0 and 1000000000."
        "401":
          description: Not authenticated
        "429":
          description: "too_many_requests { message } with Retry-After -- ten failed credentials from this client address in five minutes; a request with no credential or with only the cookie is never counted."
        "403":
          description: "forbidden -- the token is read-only."
        "404":
          description: Not found, or not visible to this account
