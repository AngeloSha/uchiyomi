# Weekly, grouped. The CI run is ~18 minutes and the test tier is serial on purpose, so one grouped pull
# request per ecosystem per week is the right cadence -- thirty single-package PRs would each cost that.
version: 2
updates:
  - package-ecosystem: npm
    directory: /bff
    schedule: { interval: weekly, day: monday }
    groups:
      bff-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 3
  # The desktop app (Electron, electron-builder, electron-updater). Electron majors arrive as their own pull
  # requests, not in the group: each is a new Chromium and Node, and only the three newest get security fixes,
  # so they are wanted -- but they are exactly the update the desktop build on real Windows and macOS runners
  # (.github/workflows/desktop.yml) has to prove before a release, not something to merge on a green Tests job
  # that never starts the app.
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly, day: monday }
    groups:
      desktop-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
  # The base images in the three Dockerfiles (node:24-alpine, nginx:1.31-alpine).
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker
    directory: /bff
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker
    directory: /web
    schedule: { interval: weekly, day: monday }
