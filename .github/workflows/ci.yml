name: CI

# Builds the two deployable images and runs the test suites on every pull request
# (and on pushes to main). A green build proves deps install and the app compiles:
# `tsc` for the BFF and `next build` for the web app. The Tests job additionally
# proves behaviour — including the reading-progress rules, which are enforced in
# SQL and so run against a real Postgres.
# Build BFF / Build Web are required to pass before a PR can be merged into main
# (see branch protection).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: "1"

jobs:
  build-bff:
    name: Build BFF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the BFF image
        run: docker build -t uchiyomi-bff:ci ./bff

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the web image
        run: docker build -t uchiyomi-web:ci ./web

  build-aio:
    name: Build All-in-one
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the single-container image
        run: docker build -f Dockerfile.aio -t uchiyomi:ci .

  # The web tier had one test file and CI proved only that it compiles, which is how four user-facing bugs
  # shipped in v0.8.0 -- all of them routes wired to the wrong thing, none of them visible to a test that
  # imports a function and calls it. This brings the app up for real and drives it in a browser.
  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser tooling
        working-directory: ./web
        run: npm install --no-audit --no-fund
      - name: Bring it up and drive it
        working-directory: ./web
        run: KEEP=1 npm run test:e2e
      # Machine-assisted translation fails in two ways a unit test cannot see: a string longer than its
      # container, and a right-to-left language rendered inside a left-to-right frame. Both need a browser.
      - name: Every language renders, and Arabic mirrors
        working-directory: ./web
        run: npm run test:i18n
      - name: Tear it down
        if: always()
        run: docker rm -f uchiyomi-e2e uchiyomi-e2e-db || true
      - name: Keep the screenshots when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            web/test/e2e/shots/
            web/test/e2e/shots-i18n/
          retention-days: 7

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: uchiyomi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # the reading-progress rules live in SQL, so those tests need a real database
      TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/uchiyomi_test
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: BFF tests
        working-directory: ./bff
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Web tests
        working-directory: ./web
        run: |
          npm install --no-audit --no-fund
          npm test
