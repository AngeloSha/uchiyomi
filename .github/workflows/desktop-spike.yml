name: Desktop spike

# Uchiyomi Desktop, Phase 0 (spike track A): the Electron shell prototype built, installed and exercised on real
# Windows and macOS runners. Nothing here publishes anything: installers are uploaded as short-lived workflow
# artifacts only. The checks (S1, S2, S5, S6, S8) are desktop/scripts/ci/*; each prints `RESULT <id> <verdict>`.
#
#   prebuild     web export + bff dist, built ONCE on Linux (platform-independent output, like Dockerfile.aio's
#                first two stages) and handed to every OS job
#   s1-suite     the bff's full test suite under plain Node vs ELECTRON_RUN_AS_NODE=1 Electron (3 shards each)
#   s1-compare   the two runtimes' counts side by side
#   s1-native    the native/WASM-module test files, both runtimes, on Windows and macOS against the BUNDLED Postgres
#   desktop      per OS: stage -> pg-dist -> electron-builder (unpacked + installer) -> the checks

on:
  push:
    branches: [spike/desktop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-spike-${{ github.ref }}
  cancel-in-progress: true

env:
  PG_EDB: 16.15-4
  ELECTRON_CACHE_KEY: electron-44.4.5-eb-26.15.3

jobs:
  prebuild:
    name: Build web + bff once
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            bff/package-lock.json
      - name: Web static export
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: bff dist
        working-directory: bff
        run: npm ci --no-audit --no-fund && npm run build
      - run: mkdir -p prebuilt && cp -r web/out prebuilt/web-out && cp -r bff/dist prebuilt/bff-dist
      - uses: actions/upload-artifact@v7
        with:
          name: prebuilt
          path: prebuilt
          retention-days: 3

  s1-suite:
    name: S1a suite ${{ matrix.runtime }} ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, electron]
        shard: [1, 2, 3]
    # Same service and env as ci.yml's Tests job, so the only difference between the legs is the binary.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: uchiyomi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/uchiyomi_test
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            bff/package-lock.json
            desktop/package-lock.json
      - name: bff dependencies (npm ci, as ci.yml)
        working-directory: bff
        run: npm ci --no-audit --no-fund
      - name: Electron 44 (for ELECTRON_RUN_AS_NODE)
        if: matrix.runtime == 'electron'
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          ELECTRON_RUN_AS_NODE=1 "$(node -e "process.stdout.write(require('electron'))")" -e "console.log('electron', process.versions.electron, 'node', process.versions.node)"
      - name: Suite
        run: node desktop/scripts/ci/s1-suite.mjs --runtime ${{ matrix.runtime }} --shard ${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: s1-suite-${{ matrix.runtime }}-${{ matrix.shard }}
          path: desktop/ci-out/suite-*
          retention-days: 5

  s1-compare:
    name: S1a compare
    needs: s1-suite
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: s1-suite-*
          path: s1
      - run: node desktop/scripts/ci/s1-compare.mjs s1 --id S1a-suite-ubuntu
      - run: node desktop/scripts/ci/summary.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: s1-compare-results
          path: desktop/ci-out/results.jsonl
          retention-days: 5

  s1-native:
    name: S1a native subset ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            bff/package-lock.json
            desktop/package-lock.json
      - uses: actions/cache@v6
        with:
          path: desktop/.cache/*.zip
          key: pg-zip-${{ runner.os }}-${{ env.PG_EDB }}
      - name: bff dependencies
        working-directory: bff
        run: npm ci --no-audit --no-fund
      - name: desktop dependencies (Electron)
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: pg-dist
        working-directory: desktop
        run: node scripts/pg-dist.mjs --version ${{ env.PG_EDB }} --cache .cache
      - name: Native-module tests, node vs electron-as-node
        working-directory: desktop
        run: node scripts/ci/s1-native.mjs
      - run: node desktop/scripts/ci/summary.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: s1-native-${{ matrix.os }}
          path: desktop/ci-out
          retention-days: 5

  desktop:
    name: Desktop ${{ matrix.os }}
    needs: prebuild
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            eb: --win --x64
          - os: macos-15
            arch: arm64
            eb: --mac --arm64
          - os: macos-15-intel
            arch: x64
            eb: --mac --x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: prebuilt
          path: prebuilt
      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ env.ELECTRON_CACHE_KEY }}-${{ runner.os }}-${{ matrix.arch }}
      - uses: actions/cache@v6
        with:
          path: desktop/.cache/*.zip
          key: pg-zip-${{ runner.os }}-${{ env.PG_EDB }}
      - name: desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Stage web + bff (as Dockerfile.aio)
        working-directory: desktop
        run: node scripts/stage.mjs --prebuilt ../prebuilt
      - name: pg-dist (EDB PostgreSQL ${{ env.PG_EDB }}, pruned)
        working-directory: desktop
        run: node scripts/pg-dist.mjs --version ${{ env.PG_EDB }} --cache .cache
      - name: Package (unpacked + installer)
        working-directory: desktop
        run: npx electron-builder ${{ matrix.eb }} --publish never
      - name: Sizes
        working-directory: desktop
        run: |
          node -e "
            const fs=require('fs'),p=require('path');
            const du=(d)=>{const s=fs.lstatSync(d);return s.isDirectory()?fs.readdirSync(d).reduce((n,e)=>n+du(p.join(d,e)),0):s.size};
            const files=fs.readdirSync('dist').filter(f=>/\.(exe|dmg|zip)$/.test(f)).map(f=>[f,fs.statSync(p.join('dist',f)).size]);
            const unpacked=fs.readdirSync('dist').filter(d=>/unpacked|^mac/.test(d)).map(d=>[d,du(p.join('dist',d))]);
            const res=['bff','web','pg'].map(r=>[r,du(p.join('resources',r))]);
            const mb=(b)=>(b/1048576).toFixed(1)+' MB';
            const s='installers: '+files.map(([f,b])=>f+' '+mb(b)).join(', ')+'; unpacked: '+unpacked.map(([d,b])=>d+' '+mb(b)).join(', ')+'; resources: '+res.map(([r,b])=>r+' '+mb(b)).join(', ');
            fs.mkdirSync('ci-out',{recursive:true});
            fs.writeFileSync(p.join(process.env.RUNNER_TEMP,'sizes.json'),JSON.stringify({files,unpacked,res}));
            require('child_process').execFileSync(process.execPath,['scripts/ci/record.mjs','M-sizes','INFO',s,p.join(process.env.RUNNER_TEMP,'sizes.json')],{stdio:'inherit'});
          "
      - name: S1b sharp throughput (node vs electron-as-node vs utilityProcess)
        continue-on-error: true
        working-directory: desktop
        run: node scripts/ci/s1-bench.mjs
      - name: S2 postgres lifecycle
        continue-on-error: true
        working-directory: desktop
        run: node scripts/ci/s2-postgres.mjs
      - name: S2 (iv) standard user
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: desktop
        shell: pwsh
        run: ./scripts/ci/s2-standard-user.ps1
      - name: S6 unsigned macOS
        if: runner.os == 'macOS'
        continue-on-error: true
        working-directory: desktop
        run: bash scripts/ci/s6-mac.sh
      - name: S8 web app in the Electron window
        continue-on-error: true
        working-directory: desktop
        run: node scripts/ci/s8-web.mjs
      - name: S5 build vN+1 installer
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: desktop
        run: |
          cp package.json "$RUNNER_TEMP/package.json.orig"
          cp package-lock.json "$RUNNER_TEMP/package-lock.json.orig"
          npm version 0.43.1 --no-git-tag-version --allow-same-version
          npx electron-builder --win --x64 --publish never -c.directories.output=dist-next
          cp "$RUNNER_TEMP/package.json.orig" package.json
          cp "$RUNNER_TEMP/package-lock.json.orig" package-lock.json
      - name: S5 NSIS update with children running
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: desktop
        shell: pwsh
        run: ./scripts/ci/s5-update.ps1 -SetupN dist/Uchiyomi-Setup-0.43.0.exe -SetupN1 dist-next/Uchiyomi-Setup-0.43.1.exe -VersionN1 0.43.1
      - name: Verdicts
        if: always()
        working-directory: desktop
        run: node scripts/ci/summary.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-${{ matrix.os }}-evidence
          path: |
            desktop/ci-out
            desktop/resources/pg/PG_BUNDLE.json
          retention-days: 5
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-${{ matrix.os }}-installers
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist-next/*.exe
          retention-days: 3
          if-no-files-found: ignore
