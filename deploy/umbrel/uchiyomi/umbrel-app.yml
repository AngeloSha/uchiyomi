manifestVersion: 1
id: uchiyomi
category: media
name: Uchiyomi
version: "0.40.0"
tagline: Self-hosted manga server that downloads too
description: >-
  Uchiyomi is a self-hosted manga server that also downloads: it serves your manga, manhwa and webtoons
  the way a library server does, and fetches and watches for new chapters the way a source app does, so
  discover, grab, monitor, serve and read all happen in one app. Open it and create your admin account in the browser; there is no
  default password. Put your existing CBZ or CBR files (any folder layout) in the Downloads folder under
  "manga", using the Files app or a network share, and they appear after the first scan. The database runs
  inside the app; there is nothing else to set up.


  Read on any device through a true-black OLED interface built webtoon-first: continuous vertical scroll
  across chapters, pinch zoom, per-series settings, and double-page spreads for classic manga. It installs
  as a PWA, so it works offline and lives on your home screen. External reader apps such as Panels, Chunky
  and KOReader can connect over OPDS, including page streaming.


  Unlike a plain library server it can follow series: add a source by pasting a site's address, and a
  scheduled updater grabs new chapters as they appear, choosing between scanlation groups and trying another
  source when one refuses. A Cloudflare solver is included for the many sites that need one. Bring your
  library over from a Mihon/Tachiyomi backup, a public MangaDex list, or your AniList, MyAnimeList or Kitsu
  list, with every match reviewed before it lands. The optional Mihon extension engine (a separate 800 MB
  Java server) is not part of this package.


  Built for a household: per-user reading progress, favourites, history and a leaderboard, age ratings,
  two-factor auth, single sign-on, an audit log, an admin panel, and nightly backups. No account and no
  cloud; the update check can be turned off and the anonymous install count is off unless you turn it on.
releaseNotes: ""

developer: AngeloSha
website: https://uchiyomi.com
dependencies: []
repo: https://github.com/AngeloSha/uchiyomi
support: https://github.com/AngeloSha/uchiyomi/issues

port: 8110
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

permissions:
  - STORAGE_DOWNLOADS
backupIgnore:
  - data/cache/*

submitter: AngeloSha
submission: https://github.com/getumbrel/umbrel-apps/pull/6055
