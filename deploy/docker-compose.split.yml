# Uchiyomi — the SPLIT layout: the API and the web app as two containers.
#
# This is not the layout the install instructions use any more. Uchiyomi ships as ONE container
# (deploy/docker-compose.yml), which is smaller, uses less memory, has one less network hop on every API
# call and no redirect on deep links.
#
# It is kept, still built and still published, because people are running it. Nothing about it has stopped
# working and you are not required to move. When you want to, docs/MIGRATING.md is four commands: both
# layouts use the SAME named volumes and the same Postgres image, so nothing is copied or converted.
#
#   curl -O https://raw.githubusercontent.com/AngeloSha/uchiyomi/main/deploy/docker-compose.split.yml
#   docker compose -f docker-compose.split.yml up -d
#
# Then open http://localhost:8080 and create your admin account in the browser.
# No secrets to generate, no config file to edit.
#
# To UPDATE later:
#   docker compose pull      <- required; `up -d` alone will not fetch a newer :latest
#   docker compose up -d
#
# Optional overrides (put them in a .env file next to this one — it is picked up automatically):
#   LIBRARY_PATH=/mnt/media/comics   your existing CBZ/CBR library (default: ./library)
#   PUID= / PGID=                    run as the user that OWNS your library, so Uchiyomi can rename and
#                                    delete files in it. Find them with `id -u` / `id -g`. Leave both unset
#                                    and nothing changes: the app runs as uid 10002 and treats your library
#                                    as read-only, exactly as before. Removing :ro from the mount alone does
#                                    NOT grant write access; the uid has to match.
#   WEB_PORT=8080                    host port to serve on
#   DB_PASSWORD=...                  only used inside the private network; the DB has no published port
#   PUBLIC_ORIGIN=https://manga.example.com   set this if you put it behind a reverse proxy
#   BACKUP_PATH=/mnt/backups/uchiyomi   where nightly backups go — ideally a different disk than your Docker
#                                       volumes, so a dead drive doesn't take the backups with it.
#                                       IF YOU SET THIS to a host path, create it and give it to uid 10002
#                                       first, or backups fail silently — Docker makes a bind mount
#                                       root-owned and the app does not run as root:
#                                         sudo mkdir -p /mnt/backups/uchiyomi
#                                         sudo chown 10002:10002 /mnt/backups/uchiyomi
#                                       (named volumes, the default, need none of this)
#   SOURCES_PATH=/path/to/sources/dist  a built source pack, mounted read-only (optional; none by default)
#   VAPID_PUBLIC_KEY= / VAPID_PRIVATE_KEY= / VAPID_SUBJECT=   enable web push (see docs/USAGE.md)

services:
  uchiyomi-db:
    image: postgres:16-alpine
    container_name: uchiyomi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: yomi
      POSTGRES_USER: yomi
      POSTGRES_PASSWORD: ${DB_PASSWORD:-uchiyomi}
    volumes:
      - uchiyomi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yomi -d yomi"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [uchiyomi_internal]

  uchiyomi-bff:
    image: ghcr.io/angelosha/uchiyomi-bff:latest
    container_name: uchiyomi-bff
    restart: unless-stopped
    environment:
      # Run as the owner of your library so file operations work. Unset = uid 10002, library read-only.
      PUID: ${PUID:-}
      PGID: ${PGID:-}
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://yomi:${DB_PASSWORD:-uchiyomi}@uchiyomi-db:5432/yomi
      LIBRARY_BACKEND: ${LIBRARY_BACKEND:-owned}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      FLARESOLVERR_URL: http://uchiyomi-flaresolverr:8191
      SOURCES_DIR: /sources
      CUSTOM_SITES_FILE: /config/sites.json
      # Generated and persisted to /config on first boot when left empty; set JWT_SECRET in .env to pin it.
      JWT_SECRET: ${JWT_SECRET:-}
      # Web push is off unless you supply keys (see docs/USAGE.md).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      # Optional single sign-on. Leave OIDC_ISSUER empty and nothing changes; set it plus a client id
      # and a "Continue with ..." button appears on the login screen. See docs/api.md.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-SSO}
      OIDC_ALLOW_SIGNUP: ${OIDC_ALLOW_SIGNUP:-false}
      OIDC_LINK_BY_USERNAME: ${OIDC_LINK_BY_USERNAME:-false}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-}
      # Extension engine (Mihon/Tachiyomi extensions), wired up by default. Set to an empty string to
      # turn the feature off entirely. See docs/extensions.md.
      SUWAYOMI_URL: ${SUWAYOMI_URL:-http://uchiyomi-suwayomi:4567}
      SUWAYOMI_USERNAME: ${SUWAYOMI_USERNAME:-}
      SUWAYOMI_PASSWORD: ${SUWAYOMI_PASSWORD:-}
      SUWAYOMI_MAX_SOURCES: ${SUWAYOMI_MAX_SOURCES:-25}
    volumes:
      - ${LIBRARY_PATH:-./library}:/library     # your existing comics (see PUID below)
      - ${SOURCES_PATH:-./sources}:/sources:ro   # optional built source pack
      - uchiyomi_downloads:/library-dl           # chapters Uchiyomi downloads
      - uchiyomi_config:/config                  # secrets, custom sites, art overrides
      - uchiyomi_cache:/cache                    # image cache (safe to delete)
      - ${BACKUP_PATH:-uchiyomi_backups}:/backups # nightly database + config backups
    depends_on:
      uchiyomi-db:
        condition: service_healthy
    networks:
      uchiyomi_internal:
      uchiyomi_app:
        # the web image's nginx proxies to this hostname
        aliases: [yomi-bff]

  uchiyomi-web:
    image: ghcr.io/angelosha/uchiyomi-web:latest
    container_name: uchiyomi-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - uchiyomi-bff
    networks: [uchiyomi_app]

  # Only used when you add a source that sits behind Cloudflare. Harmless to leave running.
  uchiyomi-flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: uchiyomi-flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: warning
    networks: [uchiyomi_app]

  # Extension engine (Mihon/Tachiyomi extensions on the JVM). Browse and install them from Uchiyomi's own
  # admin panel. Pinned rather than :stable because :stable is older than the extension API today's
  # repository indexes require. It is a JVM and sits around 800MB of RAM.
  uchiyomi-suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:v2.3.2243
    container_name: uchiyomi-suwayomi
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      # Uchiyomi owns the library and does the downloading; this must never write into it.
      AUTO_DOWNLOAD_CHAPTERS: "false"
    volumes:
      - uchiyomi_suwayomi:/home/suwayomi/.local/share/Tachidesk
    networks: [uchiyomi_internal]
    expose:
      - "4567"

networks:
  uchiyomi_internal:   # database only — deliberately not reachable from outside the stack
  uchiyomi_app:

volumes:
  uchiyomi_suwayomi:   # optional extension engine's own data
  uchiyomi_pgdata:
  uchiyomi_downloads:
  uchiyomi_config:
  uchiyomi_cache:
  uchiyomi_backups:
