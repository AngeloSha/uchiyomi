# Uchiyomi, single container, with Postgres as its own container.
#
#   curl -O https://raw.githubusercontent.com/AngeloSha/uchiyomi/main/deploy/docker-compose.external-db.yml
#   docker compose -f docker-compose.external-db.yml up -d
#
# This was the layout the install instructions used until v0.18.0. It still works, is still supported, and
# is the right choice when you want the database in a container you manage yourself -- or already have one.
# The layout the docs now lead with is docker-compose.yml: one container, with Postgres inside it on a unix
# socket. See docs/MIGRATING.md to move between them; it is a dump and a restore, and both directions are
# written down.
#
# An existing install keeps using this file. Nothing here changed except this header.
#
# The extension engine is Suwayomi-Server, run headless -- you never use its own interface -- and it runs the
# Mihon/Tachiyomi extensions. It ships ON, as its own container because it is a JVM, capped at 2 GB below.
# MangaDex and sites you add by URL work without it: put EXTENSION_ENGINE=0 in .env and run
# `docker compose -f docker-compose.external-db.yml up -d`, and this is three containers total (with the solver).
# Its data is kept; delete the line and run the same command to bring it back.
#
#   EXTENSION_ENGINE=0               don't run the extension engine (default 1)
#   LIBRARY_PATH=/mnt/media/comics   your existing library (default: ./library)
#   PUID= / PGID=                    run as the user that OWNS your library, so Uchiyomi can rename and
#                                    delete files in it. `id -u` and `id -g`. Leave both unset and nothing
#                                    changes: the app runs as uid 10002 and your library is read-only.
#   WEB_PORT=8080                    the port you open in a browser
#   DB_PASSWORD=...                  only used inside the private network; the DB has no published port

services:
  uchiyomi-db:
    image: postgres:16-alpine
    container_name: uchiyomi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: yomi
      POSTGRES_USER: yomi
      POSTGRES_PASSWORD: ${DB_PASSWORD:-uchiyomi}
    volumes:
      - uchiyomi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yomi -d yomi"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [uchiyomi_internal]

  uchiyomi:
    image: ghcr.io/angelosha/uchiyomi:latest
    container_name: uchiyomi
    restart: unless-stopped
    environment:
      # Run as the owner of your library so file operations work. Unset = uid 10002, library read-only.
      PUID: ${PUID:-}
      PGID: ${PGID:-}
      NODE_ENV: production
      # How much the log says (v0.92.0): info, warn, or debug for what Find other sources searched and why.
      LOG_LEVEL: ${LOG_LEVEL:-}
      PORT: "3000"
      DATABASE_URL: postgres://yomi:${DB_PASSWORD:-uchiyomi}@uchiyomi-db:5432/yomi
      LIBRARY_BACKEND: ${LIBRARY_BACKEND:-owned}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      FLARESOLVERR_URL: http://uchiyomi-flaresolverr:8191
      SOURCES_DIR: /sources
      CUSTOM_SITES_FILE: /config/sites.json
      # Generated and persisted to /config on first boot when left empty.
      JWT_SECRET: ${JWT_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-SSO}
      OIDC_ALLOW_SIGNUP: ${OIDC_ALLOW_SIGNUP:-false}
      OIDC_LINK_BY_USERNAME: ${OIDC_LINK_BY_USERNAME:-false}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-}
      # SSO-only sign-in (v0.63.0): AUTH_MODE=oidc-only makes the provider the only way in. See docs/api.md, SSO-only mode.
      AUTH_MODE: ${AUTH_MODE:-local}
      OIDC_BOOTSTRAP_ADMIN_SUB: ${OIDC_BOOTSTRAP_ADMIN_SUB:-}
      AUTH_RESCUE_ADMIN: ${AUTH_RESCUE_ADMIN:-}
      # Extension engine (Mihon/Tachiyomi extensions). EXTENSION_ENGINE=0 in .env turns it off and drops the
      # container below (it is a JVM and costs about 800 MB); SUWAYOMI_URL points at a Suwayomi you run yourself
      # instead. The single dash is deliberate: `:-` treats an empty value as unset, so the documented
      # `SUWAYOMI_URL=` never turned anything off.
      SUWAYOMI_URL: ${SUWAYOMI_URL-http://uchiyomi-suwayomi:4567}
      EXTENSION_ENGINE: ${EXTENSION_ENGINE:-1}
      SUWAYOMI_USERNAME: ${SUWAYOMI_USERNAME:-}
      SUWAYOMI_PASSWORD: ${SUWAYOMI_PASSWORD:-}
      SUWAYOMI_MAX_SOURCES: ${SUWAYOMI_MAX_SOURCES:-25}
      SUWAYOMI_PAGE_CONCURRENCY: ${SUWAYOMI_PAGE_CONCURRENCY:-4}
    volumes:
      - ${LIBRARY_PATH:-./library}:/library      # your existing comics (see PUID above)
      - ${SOURCES_PATH:-./sources}:/sources:ro   # optional built source pack
      - uchiyomi_downloads:/library-dl           # chapters Uchiyomi downloads
      - uchiyomi_config:/config                  # secrets, custom sites, art overrides
      - uchiyomi_cache:/cache                    # image cache (safe to delete)
      - ${BACKUP_PATH:-uchiyomi_backups}:/backups
    ports:
      - "${WEB_PORT:-8080}:3000"
    depends_on:
      uchiyomi-db:
        condition: service_healthy
    networks: [uchiyomi_internal, uchiyomi_app]

  # Cloudflare solver. Most manga aggregators sit behind Cloudflare, so the fetching half needs this.
  uchiyomi-flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: uchiyomi-flaresolverr
    restart: unless-stopped
    # Chrome writes its shared-memory segments here, and Docker's default /dev/shm is 64 MB. Under that,
    # chromedriver dies mid-challenge and FlareSolverr reports "Service /app/chromedriver unexpectedly
    # exited" or fails to reach its own session -- which looks, from the app's side, exactly like the manga
    # site blocking us. Measured on one install: seven such failures in 24 hours across four sources.
    shm_size: 1gb
    # The leak is the other half of the problem. FlareSolverr grew to 2.5 GB over 62 days of uptime on one
    # install, and a bloated solver starts failing mid-challenge rather than dying cleanly, which reads from
    # the app's side as the SITES being broken. A cap plus `restart: unless-stopped` turns an unbounded leak
    # into an automatic restart: idle it sits around 150 MB, so 2 GB is generous headroom for a real solve.
    mem_limit: 2g
    # It had no healthcheck at all, so `docker ps` said "Up 2 months" while it was crashing on every request.
    # The root endpoint answers with a readiness sentence, which is the only honest signal it offers.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8191/ | grep -q 'FlareSolverr is ready' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      LOG_LEVEL: warning
    networks: [uchiyomi_app]
    expose:
      - "8191"

  # Optional: Mihon/Tachiyomi extensions. EXTENSION_ENGINE=0 in .env drops it (see the header). The tag is pinned and
  # moves only with a release that says so; the engine upgrades its data one way, so back it up first
  # (docs/extensions.md#updating-the-engine).
  uchiyomi-suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:v2.4.2366
    container_name: uchiyomi-suwayomi
    # The switch. EXTENSION_ENGINE=0 in .env, then `docker compose up -d`: this container is not run, and the app
    # (which reads the same variable) treats extensions as off. Its data stays in the volume; delete the line and
    # run the same command to bring it back where it left off. Never `docker compose down -v`, which deletes it.
    deploy:
      replicas: ${EXTENSION_ENGINE:-1}
    restart: unless-stopped
    # The engine is a JVM, and a JVM with no limit sizes its heap from the HOST's memory -- a quarter of it:
    # 15.7 GiB on a 62 GB machine, measured 2026-09-25 against this image -- so without a cap a small NAS is at
    # its mercy (discussion #72). JAVA_TOOL_OPTIONS below caps the heap at 768 MB with the serial collector, as
    # the desktop app does (desktop/src/engine.js). This ceiling has to hold the rest as well: Java's own native
    # memory, and the Chromium (the engine's WebView) and Xvfb that this image runs and the desktop app turns
    # off. Measured for #275, with 45 extensions on 12 cores: 1.4 GB after two days, 630 MB of it heap. Under
    # the old 1.5 GB ceiling it kept going only by swapping; a host with no swap (Unraid's default) kills it
    # there. The ceiling still turns a runaway into a restart, which the restart policy above handles.
    # SUWAYOMI_MEM_LIMIT and SUWAYOMI_JAVA_OPTS raise both; keep the ceiling at least 1.25 GB above -Xmx.
    mem_limit: ${SUWAYOMI_MEM_LIMIT:-2048m}
    environment:
      TZ: ${TZ:-UTC}
      # The heap cap itself. The image's startup script runs a bare `java -jar` with no options of its own, so
      # JAVA_TOOL_OPTIONS -- which every JVM reads when it starts -- is the way in.
      JAVA_TOOL_OPTIONS: "${SUWAYOMI_JAVA_OPTS:--Xmx768m -XX:+UseSerialGC}"
      # Two malloc arenas instead of glibc's up to eight per CPU. Each thread that allocates gets an arena of its
      # own, and what it frees stays there: in #275's engine 94 arenas held 428 MB, and side by side under the
      # same load two held 120 MB less (measured 2026-10-16). Read by the C library, not the startup script.
      MALLOC_ARENA_MAX: "2"
      # Uchiyomi owns the library and does the downloading; this instance must never write into it. The
      # development compose has said so from the start and this file, the one people actually install from,
      # did not.
      AUTO_DOWNLOAD_CHAPTERS: "false"
      DOWNLOAD_AS_CBZ: "true"
      # The engine shares the bundled Cloudflare solver. Suwayomi has no browser of its own: a challenged
      # site makes it throw "Cloudflare bypass currently disabled" unless it is pointed at a FlareSolverr,
      # and it ships with that off. The image maps exactly these two variables into its server.conf.
      FLARESOLVERR_ENABLED: "true"
      FLARESOLVERR_URL: http://uchiyomi-flaresolverr:8191
    volumes:
      - uchiyomi_suwayomi:/home/suwayomi/.local/share/Tachidesk
    networks: [uchiyomi_app]
    expose:
      - "4567"
    healthcheck:
      # The image has bash but no curl, wget or nc, so bash opens the socket itself. 401 counts as alive:
      # the engine is up, it just has authentication switched on. A JVM takes a while to come up, hence the
      # long start period; before this `docker ps` could not tell "still starting" from "broken".
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4567; printf 'GET /api/v1/settings/about HTTP/1.0\\r\\n\\r\\n' >&3; head -1 <&3 | grep -qE ' (200|401) '"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  uchiyomi_internal:   # database only — deliberately not reachable from outside the stack
  uchiyomi_app:

volumes:
  uchiyomi_pgdata:
  uchiyomi_downloads:
  uchiyomi_config:
  uchiyomi_cache:
  uchiyomi_backups:
  uchiyomi_suwayomi:
