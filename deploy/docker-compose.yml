# Uchiyomi, one container.
#
#   curl -O https://raw.githubusercontent.com/AngeloSha/uchiyomi/main/deploy/docker-compose.yml
#   docker compose up -d
#
# Then open http://localhost:8080 and create your admin account in the browser. There are no secrets to
# generate, no config file to edit, and no database to run: Postgres lives inside the container, on a unix
# socket, in the uchiyomi_data volume. Leave DATABASE_URL unset and that is what you get; set it and the
# same image talks to a database you run yourself instead (docker-compose.external-db.yml is that layout,
# ready to use). The two share every other volume, and docs/MIGRATING.md has the move in both directions.
#
# The extension engine is still opt-in and still its own container, because it is a JVM. Leave it out and
# the whole thing is one container plus the Cloudflare solver.
#
#   LIBRARY_PATH=/mnt/media/comics   your existing library (default: ./library)
#   PUID= / PGID=                    run as the user that OWNS your library, so Uchiyomi can rename and
#                                    delete files in it. `id -u` and `id -g`. Leave both unset and nothing
#                                    changes: the app runs as uid 10002 and your library is read-only.
#   WEB_PORT=8080                    the port you open in a browser

services:
  uchiyomi:
    image: ghcr.io/angelosha/uchiyomi:latest
    container_name: uchiyomi
    restart: unless-stopped
    # The app finishes the chapter it is writing on SIGTERM (up to 20 s), and then Postgres checkpoints and
    # stops. Docker's default 10 s would kill the database mid-checkpoint.
    stop_grace_period: 40s
    environment:
      # Run as the owner of your library so file operations work. Unset = uid 10002, library read-only.
      PUID: ${PUID:-}
      PGID: ${PGID:-}
      NODE_ENV: production
      PORT: "3000"
      # No DATABASE_URL: that is the switch. Set one here and the embedded database is not started.
      LIBRARY_BACKEND: ${LIBRARY_BACKEND:-owned}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      FLARESOLVERR_URL: http://uchiyomi-flaresolverr:8191
      SOURCES_DIR: /sources
      CUSTOM_SITES_FILE: /config/sites.json
      # Generated and persisted to /config on first boot when left empty.
      JWT_SECRET: ${JWT_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-SSO}
      OIDC_ALLOW_SIGNUP: ${OIDC_ALLOW_SIGNUP:-false}
      OIDC_LINK_BY_USERNAME: ${OIDC_LINK_BY_USERNAME:-false}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-}
      # Extension engine (Mihon/Tachiyomi extensions). Set to an empty string to turn it off entirely and
      # drop the container below; it is a JVM and costs about 800 MB.
      SUWAYOMI_URL: ${SUWAYOMI_URL:-http://uchiyomi-suwayomi:4567}
      SUWAYOMI_USERNAME: ${SUWAYOMI_USERNAME:-}
      SUWAYOMI_PASSWORD: ${SUWAYOMI_PASSWORD:-}
      SUWAYOMI_MAX_SOURCES: ${SUWAYOMI_MAX_SOURCES:-25}
      SUWAYOMI_PAGE_CONCURRENCY: ${SUWAYOMI_PAGE_CONCURRENCY:-4}
    volumes:
      - ${LIBRARY_PATH:-./library}:/library      # your existing comics (see PUID above)
      - ${SOURCES_PATH:-./sources}:/sources:ro   # optional built source pack
      - uchiyomi_data:/data                      # the embedded database (Postgres, in /data/pg)
      - uchiyomi_downloads:/library-dl           # chapters Uchiyomi downloads
      - uchiyomi_config:/config                  # secrets, custom sites, art overrides
      - uchiyomi_cache:/cache                    # image cache (safe to delete)
      - ${BACKUP_PATH:-uchiyomi_backups}:/backups
    ports:
      - "${WEB_PORT:-8080}:3000"
    networks: [uchiyomi_app]

  # Cloudflare solver. Most manga aggregators sit behind Cloudflare, so the fetching half needs this.
  #
  # `:latest` is not self-updating -- Docker keeps whatever layer is on disk until you `docker compose pull`.
  # Uchiyomi never updates this container itself; it does check the solver's health hourly and tells you when
  # it stops answering or starts failing mid-challenge, and Admin -> Health says when a newer release exists.
  # If you run Watchtower and would rather the solver kept pace with Cloudflare on its own, add:
  #     labels: [ "com.centurylinklabs.watchtower.enable=true" ]
  # Off by default: opting somebody into unattended updates of a dependency is not ours to decide.
  uchiyomi-flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: uchiyomi-flaresolverr
    restart: unless-stopped
    # Chrome writes its shared-memory segments here, and Docker's default /dev/shm is 64 MB. Under that,
    # chromedriver dies mid-challenge and FlareSolverr reports "Service /app/chromedriver unexpectedly
    # exited" or fails to reach its own session -- which looks, from the app's side, exactly like the manga
    # site blocking us. Measured on one install: seven such failures in 24 hours across four sources.
    shm_size: 1gb
    # The leak is the other half of the problem. FlareSolverr grew to 2.5 GB over 62 days of uptime on one
    # install, and a bloated solver starts failing mid-challenge rather than dying cleanly, which reads from
    # the app's side as the SITES being broken. A cap plus `restart: unless-stopped` turns an unbounded leak
    # into an automatic restart: idle it sits around 150 MB, so 2 GB is generous headroom for a real solve.
    mem_limit: 2g
    # It had no healthcheck at all, so `docker ps` said "Up 2 months" while it was crashing on every request.
    # The root endpoint answers with a readiness sentence, which is the only honest signal it offers.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8191/ | grep -q 'FlareSolverr is ready' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      LOG_LEVEL: warning
    networks: [uchiyomi_app]
    expose:
      - "8191"

  # Optional: Mihon/Tachiyomi extensions. Remove this service and set SUWAYOMI_URL= empty to drop it.
  uchiyomi-suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:v2.3.2243
    container_name: uchiyomi-suwayomi
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      # Uchiyomi owns the library and does the downloading; this instance must never write into it. The
      # development compose has said so from the start and this file, the one people actually install from,
      # did not.
      AUTO_DOWNLOAD_CHAPTERS: "false"
      DOWNLOAD_AS_CBZ: "true"
    volumes:
      - uchiyomi_suwayomi:/home/suwayomi/.local/share/Tachidesk
    networks: [uchiyomi_app]
    expose:
      - "4567"
    healthcheck:
      # The image has bash but no curl, wget or nc, so bash opens the socket itself. 401 counts as alive:
      # the engine is up, it just has authentication switched on. A JVM takes a while to come up, hence the
      # long start period; before this `docker ps` could not tell "still starting" from "broken".
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4567; printf 'GET /api/v1/settings/about HTTP/1.0\\r\\n\\r\\n' >&3; head -1 <&3 | grep -qE ' (200|401) '"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  uchiyomi_app:

volumes:
  uchiyomi_data:       # the embedded database; back it up like any other volume, or rely on the nightly dump in /backups
  uchiyomi_downloads:
  uchiyomi_config:
  uchiyomi_cache:
  uchiyomi_backups:
  uchiyomi_suwayomi:
