# Uchiyomi Desktop packaging. Windows: NSIS, per-user, x64. macOS: dmg + zip per arch, ad-hoc signed.
# Unsigned for now (owner's decision, 2026-09-23): Windows shows SmartScreen's "More info -> Run anyway" once;
# macOS needs System Settings -> Privacy & Security -> Open Anyway once, and cannot auto-update (updates.js).
appId: com.uchiyomi.desktop
productName: Uchiyomi
copyright: Copyright © 2026 Angelo Shaheen
directories:
  output: dist
  buildResources: build
# The shell itself goes into app.asar: src/ (plain CommonJS + the local pages) and out/src/ (the solver, compiled
# from TypeScript by `npm run build` -- it must run BEFORE electron-builder, see package.json "dist").
# electron-updater, the one runtime dependency, is added from node_modules automatically.
files:
  - src/**/*
  - "!src/**/*.ts"
  - out/src/**/*.js
  - package.json
extraResources:
  # ONE entry rooted at resources/, on purpose. electron-builder's copy filter drops a node_modules directory at
  # the ROOT of any copy source, whatever the patterns say (app-builder-lib/out/util/filter.js: relative ===
  # "node_modules" -> false). Rooted at resources/bff that silently shipped a bff with no dependencies; rooted
  # here, it is bff/node_modules and is copied.
  - from: resources
    to: .
    filter:
      - bff/**/*
      - web/**/*
      - pg/**/*
asar: true
electronFuses:
  # utilityProcess keeps working with this off, and it closes "run this signed app as a plain Node".
  runAsNode: false
  # ⚠️ OFF while the builds are unsigned (owner's decision, 2026-09-23). On macOS Chromium keeps the cookie key in
  # the login Keychain with an access list naming the app by its code-directory hash, and an ad-hoc signature
  # gets a NEW hash every build: in the spike the updated app hung behind a hidden "wants to use your
  # confidential information" prompt for 2 minutes, and even the same build came back with unreadable cookies
  # (S6 run 35928548323). These cookies are only a session with our own loopback server, inside the user's
  # private data folder, and the desktop sign-in re-creates them silently. Turn it back ON together with real
  # signing (Developer ID + DPAPI-backed Windows is fine either way).
  enableCookieEncryption: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: false
# The same GitHub Release as the server's `v*` tag. electron-builder writes app-update.yml from this (Windows'
# electron-updater reads it) and latest.yml / latest-mac.yml beside the installers; the release workflow uploads
# them LAST, after the binaries, so no client ever sees a latest.yml whose installer is not there yet. Builds
# always run with --publish never: publishing is the release workflow's job.
publish:
  provider: github
  owner: AngeloSha
  repo: uchiyomi
  releaseType: release
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Uchiyomi-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
mac:
  target: [dmg, zip]
  category: public.app-category.books
  # Unsigned for now (owner decision): ad-hoc only. Hardened runtime needs a Team ID to be useful and would
  # enforce library validation against the ad-hoc framework, so it stays off until there is a Developer ID.
  identity: "-"
  hardenedRuntime: false
  artifactName: Uchiyomi-${version}-${arch}.${ext}
dmg:
  artifactName: Uchiyomi-${version}-${arch}.${ext}
