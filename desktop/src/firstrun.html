<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Uchiyomi</title>
<style>
  :root { color-scheme: dark; --ink-850: #0b0b0f; --ink-700: #1a1a22; --ink-600: #26262f; --fog-100: #ececf2; --fog-400: #9292a3; --fog-500: #6f6f81; --accent: #7c5cff; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fog-100); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; padding: 32px 24px; box-sizing: border-box; }
  .card { width: min(560px, 100%); }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 10px; letter-spacing: -0.005em; }
  p { margin: 0 0 22px; color: var(--fog-400); font-size: 14px; }
  .path { display: flex; gap: 10px; align-items: center; }
  .box { flex: 1; min-width: 0; background: var(--ink-850); border: 1px solid var(--ink-600); border-radius: 12px; padding: 10px 14px; }
  .dir { font-size: 13px; overflow-wrap: anywhere; direction: ltr; unicode-bidi: isolate; text-align: start; }
  .free { font-size: 12px; color: var(--fog-500); margin-top: 2px; }
  button { font: inherit; font-size: 14px; border-radius: 999px; padding: 9px 18px; cursor: pointer; border: 1px solid var(--ink-600); background: var(--ink-700); color: var(--fog-100); white-space: nowrap; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: 0.55; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
  #back { margin-inline-end: auto; }
  .note { font-size: 13px; margin-top: 14px; border-radius: 12px; padding: 10px 14px; }
  .note.warn { color: #fcd34d; background: rgb(252 211 77 / 0.08); border: 1px solid rgb(252 211 77 / 0.25); }
  .note.err { color: #fca5a5; background: rgb(252 165 165 / 0.08); border: 1px solid rgb(252 165 165 / 0.25); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1 data-s="first.title">Where should Uchiyomi keep your manga?</h1>
    <p data-s="first.body">Everything you download is saved in this folder as ordinary files you can see and back up. Pick a drive with room to grow.</p>
    <div class="path">
      <div class="box"><div class="dir" id="dir"></div><div class="free" id="free"></div></div>
      <button id="choose" data-s="first.choose">Choose…</button>
    </div>
    <div class="note warn" id="warn" hidden></div>
    <div class="note err" id="err" role="alert" hidden></div>
    <div class="actions">
      <button id="back" data-s="first.back" hidden>Back</button>
      <button class="primary" id="use" data-s="first.use">Use this folder</button>
    </div>
  </div>
</main>
<script>
  const shell = window.uchiyomiShell;
  let S = {};
  let dir = '';
  let anyway = false;
  const $ = (id) => document.getElementById(id);
  const t = (k, vars = {}) => (S[k] || k).replace(/\{(\w+)\}/g, (m, x) => (x in vars ? String(vars[x]) : m));
  function show(info) {
    dir = info.dir || dir;
    $('dir').textContent = dir;
    $('free').textContent = typeof info.freeGB === 'number' ? t('first.free', { n: info.freeGB }) : '';
    $('warn').hidden = !info.warning; $('warn').textContent = info.warning || '';
    $('err').hidden = !info.error; $('err').textContent = info.error || '';
    anyway = !!info.warning && !info.error;
    $('use').textContent = anyway ? t('first.anyway') : t('first.use');
    $('use').disabled = !!info.error && !info.dir;
  }
  async function init() {
    document.documentElement.lang = shell.lang;
    if (shell.lang === 'ar') document.documentElement.dir = 'rtl';
    S = await shell.strings();
    for (const el of document.querySelectorAll('[data-s]')) if (S[el.dataset.s]) el.textContent = S[el.dataset.s];
    show(await shell.firstRun.defaults());
    $('use').focus();
  }
  // Back to the first-launch choice (welcome.html), when that is where this page came from.
  $('back').hidden = new URLSearchParams(location.search).get('back') !== '1';
  $('back').onclick = () => shell.firstRun.back();
  $('choose').onclick = async () => {
    const r = await shell.firstRun.choose();
    if (r) show(r);
  };
  $('use').onclick = async () => {
    $('use').disabled = true; $('choose').disabled = true;
    try {
      const r = await shell.firstRun.confirm(dir, anyway);
      if (r && !r.ok) show(r);
    } finally {
      $('use').disabled = false; $('choose').disabled = false;
    }
  };
  if (shell) init();
</script>
</body>
</html>
